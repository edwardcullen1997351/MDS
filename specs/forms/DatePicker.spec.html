    <h1>DatePicker</h1>
    <p className="lede">A <strong>text field with a calendar</strong> — not a calendar with a field. An operator entering a downtime date types it faster than any grid can be clicked, so typing is the primary path and the panel answers "which Tuesday was that". Two decisions carry the whole component: the value is an ISO <em>string</em>, never a <code>Date</code>, and the display and typed formats are ISO, because <code>05/09/2026</code> is two different days depending on who is reading it. Everything else — the grid keyboard, the range model, the presets — is the WAI-ARIA pattern implemented once so no product has to.</p>

      <div className="pane do"><h3>Do</h3><ul>
        <li><strong>ISO in the field:</strong> <code>2026-09-05</code>, mono, tabular.</li>
        <li><strong>Keep <code>YYYY-MM-DD</code> as the placeholder</strong> — the format is the most useful hint there is.</li>
        <li><strong>Label with the event,</strong> not the widget: "Downtime date", "Due date", "Shift window".</li>
        <li><strong>Say the rule in the hint:</strong> "Within this quarter", "Weekends are non-production".</li>
        <li><strong>Name presets in the operator’s words:</strong> "This shift", "Last 7 days".</li>
        <li><strong>Spell dates out in prose</strong> around the field ("5 September 2026") where a sentence, not a value, is being read.</li>
      </ul></div>
      <div className="pane dont"><h3>Don't</h3><ul>
        <li><strong>Slash formats.</strong> <code>05/09/2026</code> is two days. Refused on input and never displayed.</li>
        <li><strong>Locale-formatted values</strong> in the field. A value the API stores as ISO should read as ISO.</li>
        <li><strong>"Pick a date"</strong> as the placeholder. It replaces information with instruction.</li>
        <li><strong>Relative windows in a calendar</strong> — "Last 24 hours" is a chip, not four clicks in a grid.</li>
        <li><strong>Two-digit years,</strong> ever.</li>
        <li><strong>"Invalid date"</strong> as the error. Say what is wrong: "Enter the date as YYYY-MM-DD" or "Must be on or before today".</li>
      </ul></div>
    </div>
  </Sec>

  <Sec n="11" title="Responsive" note="The field reflows; the panel is a fixed 246px and stays on screen.">
    <ul>
      <li><strong>The field fills its container</strong> and has no width of its own. A range renders two fields with an arrow between them, both shrinking equally.</li>
      <li><strong>Below ~380px, a range stacks</strong> — that is the product's layout call (a flex column), not a prop: the component lays out its two fields in a row and lets the container decide.</li>
      <li><strong>The panel is one month wide at every breakpoint</strong> and is anchored by the shared engine, which clamps it to the viewport with an 8px gutter and flips it above the field when there is no room below. It cannot render off-screen, and it is not clipped by a scrolling ancestor because it is <code>position: fixed</code>.</li>
      <li><strong>Day cells stay 30px</strong> — the grid does not shrink at any breakpoint or density (§05).</li>
      <li><strong>Presets sit beside the grid,</strong> which makes the panel ~380px wide. Below that the product should pass fewer presets rather than expect a reflow: a preset column that wraps under the calendar puts the common choices below the fold.</li>
      <li><strong>Touch: <code>lg</code></strong>, for the 16px type that stops iOS zooming the viewport on focus — the same reason <code>Input</code> and <code>Select</code> carry the size.</li>
    </ul>
    <div className="demo col">
      <div style={{maxWidth:300,border:'var(--border-hairline)',borderRadius:'var(--radius-sm)',padding:12}}>
        <Field label="Shift window"><DatePicker range label="Shift window" value={rng} onChange={setRng} /></Field>
      </div>
      <Text size="xs" tone="tertiary">300px: both fields shrink together and the panel stays a full month wide.</Text>
    </div>
  </Sec>

  <Sec n="12" title="Anti Patterns" note="Half of these are formats; the other half are calendars answering non-calendar questions.">
    <div className="two">
      <div className="pane dont"><h3>Dangerous</h3><ul>
        <li><strong>A <code>Date</code> object as the value.</strong> §13 — the off-by-one that files a shift against the wrong day, silently, for half the world.</li>
        <li><strong>Ambiguous formats.</strong> A US and a Dutch operator reading <code>05/09</code> disagree by four months, and nothing on screen tells them.</li>
        <li><strong>Hiding out-of-range days</strong> instead of disabling them. A grid missing its first nine days is a grid the user does not trust.</li>
        <li><strong>Silently clamping a typed date</strong> into range. Say it in the error; do not move what they typed.</li>
        <li><strong>A picker for a timestamp.</strong> Without a time field and a timezone, "the 5th" is an 8-hour ambiguity in a plant that runs three shifts.</li>
      </ul></div>
      <div className="pane dont"><h3>Misapplied</h3><ul>
        <li><strong>A calendar for a relative window.</strong> "Last 24 hours" is a <code>ChipGroup</code>.</li>
        <li><strong>A calendar for a month or a year.</strong> <code>Select</code>.</li>
        <li><strong>Two months side by side</strong> as the default. §04.</li>
        <li><strong>An always-open inline calendar</strong> in a form. It is 246px of chrome for one value.</li>
        <li><strong>A grid with 42 tab stops.</strong> The single most common keyboard defect in this pattern (§07).</li>
        <li><strong>Three separate day/month/year selects.</strong> Three controls, three chances to be wrong, and no way to type a date.</li>
      </ul></div>
    </div>
    <p className="warn"><strong>The one that will be requested: a native <code>&lt;input type="date"&gt;</code>, "for free accessibility".</strong> It is genuinely tempting — the platform's keyboard and announcement are good. It is refused because its picker cannot do ranges, presets or per-date vetoes; it cannot be styled at all, so it is the one control in the product that ignores the design system; and it formats to the OS locale, which reintroduces exactly the <code>05/09</code> ambiguity the ISO decision exists to remove. What this component keeps from the native control is the part that matters: a real, typable text input.</p>
  </Sec>

  <Sec n="13" title="Implementation Notes" note="New in 1.21.0 — and one decision worth more than the rest.">
    <ul>
      <li><strong>ISO strings, never <code>Date</code> objects, and this is the load-bearing decision.</strong> A <code>Date</code> is an instant; a calendar date is three integers. <code>new Date('2026-09-05')</code> parses as UTC midnight, <code>new Date(2026, 8, 5)</code> as local midnight, and <code>.toISOString()</code> on the second yields <code>2026-09-04</code> anywhere west of Greenwich — so a downtime logged on the 5th is filed against the 4th, silently, and only for some users. The value stays a <code>'YYYY-MM-DD'</code> string from the keystroke to the API, and <code>date.js</code> does all its arithmetic on strings; the one unavoidable <code>Date</code> — the weekday of a given day — is built <em>and</em> read in UTC so no local offset can enter.</li>
      <li><strong>Slash formats are refused on input.</strong> Accepting <code>05/09/2026</code> would mean guessing an order, and a wrong guess is a four-month error that looks like a successful entry. ISO, compact ISO, <code>today</code> and <code>yesterday</code> are accepted — the last two because operators reach for them constantly and neither is ambiguous.</li>
      <li><strong>Typing never clears the value mid-edit.</strong> The text is parsed on every keystroke but committed only when it resolves to a real date, so "2026-0" leaves the existing value alone. The naive version — commit or clear on every change — wipes the date the moment the user starts editing it.</li>
      <li><strong>Six rows, always.</strong> The grid is 42 cells whatever the month, so the panel's height is identical in February and in a 31-day month starting on a Sunday. A calendar that grows a row moves the day under a pointer already travelling towards it.</li>
      <li><strong>Roving tabindex, and it is not optional.</strong> One tab stop for the whole grid; arrows move focus and cursor together. 42 focusable days is the most common keyboard defect in this pattern (§07).</li>
      <li><strong><code>addMonths</code> clamps rather than rolls over.</strong> 31 March minus one month is 28 February, not 3 March — rolling over skips a month in a chevron-stepped grid, which is the classic date-library bug.</li>
      <li><strong>The panel rides <code>core/anchor.js</code></strong> — the same engine as the other six anchored surfaces (<code>Combobox</code>, <code>Autocomplete</code>, <code>MultiCombobox</code>, <code>Menu</code>, <code>Tooltip</code>, <code>Popover</code>), which is why it sits at tier 2 rather than beside any one of them: <code>fixed</code> so no ancestor <code>overflow: hidden</code> clips it, measured rather than predicted, side decided at open and held. A sixth surface reusing it is exactly why it was extracted at 1.5.0, and <code>clampHeight</code> is off here because a month grid has one correct height.</li>
      <li><strong>The field borrows <code>--input-*</code> wholesale,</strong> as <code>Select</code>, <code>Combobox</code> and <code>Autocomplete</code> do, so a date field cannot drift from the text field beside it. The 20 <code>--datepicker-*</code> tokens are all panel and grid.</li>
      <li><strong>Range ends swap instead of being refused,</strong> and the footer names which end the next press sets — the two halves of making a two-press interaction legible.</li>
      <li><strong>Four warnings:</strong> no accessible name, <code>range</code> without an array value, an array value without <code>range</code>, and <code>min</code> after <code>max</code> (which disables every day and offers nothing).</li>
      <li><strong>Programmatic focus runs in a post-commit effect, never in a <code>requestAnimationFrame</code>.</strong> The first cut focused the new day from an rAF, which fires <em>before</em> React commits — so it focused the day about to be replaced, and that button's <code>onFocus</code> handler wrote the stale date back into the cursor, cancelling the move: one arrow press took two presses, focus lagged a press behind, and <code>PageDown</code> left focus on <code>&lt;body&gt;</code> because the focused day had unmounted. Two causes, one shape: <strong>a timing hook standing in for a lifecycle, and two owners of one piece of state.</strong> Focus now follows the cursor in an effect keyed on it <em>and on the anchor position</em>, and the day buttons no longer write the cursor at all — the key handler and clicks own it. The position matters: the panel is gated on the measurement <code>useAnchor</code> makes in its own effect, so on the commit that opens the panel the grid does not exist yet — the first fix spent its focus flag on that pass and left the <em>first</em> open (the documented <kbd>↓</kbd> route) doing nothing at all. The flag is cleared only once the day node has actually been found.</li>
      <li><strong>Date maths lives in <code>date.js</code></strong> rather than in the component: it is business logic, it is the part worth reading in isolation, and a second date control — should one ever be justified — must share it rather than re-derive the timezone rules.</li>
    </ul>
    <div className="tokenlist">
      {['--datepicker-panel-background','--datepicker-panel-border','--datepicker-panel-radius','--datepicker-panel-shadow','--datepicker-header-text','--datepicker-weekday-text','--datepicker-day-size','--datepicker-day-radius','--datepicker-day-text','--datepicker-day-outside-text','--datepicker-day-disabled-text','--datepicker-day-background-hover','--datepicker-day-background-selected','--datepicker-day-foreground-selected','--datepicker-day-background-range','--datepicker-day-foreground-range','--datepicker-today-border','--datepicker-footer-border'].map(t=><span key={t}>{t}</span>)}
    </div>
    <p className="warn"><strong>Deferred, with the evidence that would reopen it: date + time.</strong> A plant console genuinely has timestamped events — a fault at 04:12, a changeover boundary — and this component covers none of them. It is deferred rather than bolted on because a timestamp needs three things this control does not have: a time field, a <em>timezone</em> (a site in Tilburg reporting to a group in Chicago cannot use "local"), and a decision about what a range means when the ends are instants rather than days. Shipping a <code>time</code> flag would answer none of those and would quietly turn every existing date value into an ambiguous one. What reopens it: a product that needs to file an event to the minute, at which point the honest shape is a separate <code>DateTimePicker</code> sharing <code>date.js</code> and carrying an explicit timezone — not a prop on this one. <strong>The timezone half of that is now decided</strong> (1.21.2, <code>Design Principles.md</code> → Dates, times and timezones): instants are stored in UTC and displayed in the <em>Site's</em> timezone with the zone named, never the browser's, because the shift is the unit of work and the shift's clock wins. So the deferral is now waiting on a consumer, not on a decision.</p>
  </Sec>

  <Sec n="14" title="Developer Notes" note="Wiring it into a form.">
    <pre>{`import { DatePicker } from '@meridian/forms';

// Single date, inside a Field — which supplies the label, hint and error.
const [date, setDate] = React.useState('');       // ISO string, or ''
<Field label="Downtime date" hint="ISO, or type “today”."
       error={submitted && !date ? 'Enter the date the line stopped.' : undefined}>
  <DatePicker value={date} onChange={setDate} max={todayIso()} />
</Field>

// Range with presets — the value is a pair, in order, always.
const [win, setWin] = React.useState(['2026-08-30', '2026-09-05']);
<DatePicker range value={win} onChange={setWin} label="Report window"
  presets={[
    { label: 'Today',       value: [today, today] },
    { label: 'Last 7 days', value: [addDays(today, -6), today] },
    { label: 'This month',  value: [monthStart(today), today] },
  ]} />

// Non-production days are vetoed per date, never hidden.
<DatePicker value={date} onChange={setDate}
  isDateDisabled={(iso) => !calendar.isProductionDay(iso)} />

// Straight to the API. No serialisation step, because there is nothing
// to serialise — and no timezone to get wrong.
await api.post('/downtime', { line: id, date });   // { date: '2026-09-05' }`}</pre>
    <ul>
      <li><strong>Never convert to a <code>Date</code> to store or send it.</strong> If a backend wants a timestamp, build it there with an explicit timezone; the moment a date passes through a local <code>Date</code> it can move a day.</li>
      <li><strong>Compare with string comparison.</strong> ISO dates sort and compare lexicographically — <code>from &lt;= to</code> is correct and needs no library.</li>
      <li><strong>Always controlled.</strong> There is no <code>defaultValue</code>: a date field that owns its value cannot be reset by a "clear filters" button or restored from a saved view.</li>
      <li><strong>Validate on submit, in the form,</strong> and say what is wrong in words. The component reports the bounds it was given; it does not decide policy.</li>
      <li><strong>Presets belong to the product,</strong> because "this shift" is a business definition. Compute them from the site's shift calendar, not from the browser.</li>
      <li><strong>In a table filter row, use <code>size="sm"</code></strong> and give it a name with <code>aria-label</code> — the column header is the visible question (the pattern <code>Field labelHidden</code> exists for).</li>
      <li><strong>Testing hooks:</strong> the field is <code>getByRole('textbox', {'{ name: \'Downtime date\' }'})</code> — type into it rather than clicking the grid, which is what most users do. The panel is <code>getByRole('dialog', {'{ name: \'Choose a date\' }'})</code>, days are <code>getByRole('gridcell')</code>/buttons named "Saturday 5 September 2026", and selection is <code>aria-selected</code>. Assert the emitted string, never a Date.</li>
    </ul>
  </Sec>
</div>
);}
ReactDOM.createRoot(document.getElementById('root')).render(<Spec />);
</script></body></html>
