<script type="text/babel">
const { Select, Field, Input, RadioGroup, Button, Badge, Tabs } = window.MeridianDesignSystem_962c43;

const Sec = ({n,title,note,children}) => (
  <section>
    <div className="sec-head"><span className="num">{n}</span><h2>{title}</h2>{note?<span className="sec-note">{note}</span>:null}</div>
    <div className="body">{children}</div>
  </section>
);
const T = ({cols,rows,numCols=[]}) => (
  <table><thead><tr>{cols.map((c,i)=><th key={i} className={numCols.includes(i)?'num':''}>{c}</th>)}</tr></thead>
  <tbody>{rows.map((r,i)=><tr key={i}>{r.map((c,j)=><td key={j} className={(j===0?'k ':'')+(numCols.includes(j)?'num':'')}>{c}</td>)}</tr>)}</tbody></table>
);
const Row = ({label,children}) => <div className="staterow"><span className="lbl">{label}</span>{children}</div>;

const ENVS = ['Production', 'Staging', 'Development'];
const REGIONS = [
  {value:'us-east-1', label:'us-east-1 · N. Virginia'},
  {value:'us-west-2', label:'us-west-2 · Oregon'},
  {value:'eu-west-1', label:'eu-west-1 · Ireland'},
  {value:'eu-central-1', label:'eu-central-1 · Frankfurt'},
  {value:'ap-south-1', label:'ap-south-1 · Mumbai'},
];

function Controlled(){
  const [env,setEnv] = React.useState('');
  return (
    <div style={{width:300}}>
      <Field label="Environment" hint={env ? 'Deploys go to ' + env.toLowerCase() + '.' : 'Pick the target before deploying.'}>
        <Select options={ENVS} placeholder="Choose an environment" value={env} onChange={(e) => setEnv(e.target.value)} />
      </Field>
    </div>
  );
}

function Spec(){
return (
<div className="page">
  <div className="masthead">
    <span className="eyebrow">Forms · Component specification</span>
    <h1>Select</h1>
    <p className="lede">One value, chosen from a list the system already knows. Meridian's Select is a native <code>&lt;select&gt;</code> in Meridian chrome, and that is the whole design decision: we own the box, the browser owns the list. Typeahead, mobile pickers, scroll containment and every screen reader's dropdown vocabulary come free — and the price is that we cannot style an option, group with icons, or search inside the list. When the list needs any of those, the answer is a different component, not a bigger Select.</p>
    <div className="meta">
      <span>components/forms/Select.jsx</span><span>window.MeridianDesignSystem_962c43.Select</span><span style={{color:'var(--text-primary)'}}>status: frozen 4 Sep 2026 · 1 open item</span><span>since: 1.0.0 · revised 1.2.0</span>
    </div>
  </div>

  <Sec n="01" title="Purpose" note="A value, from 4 or more known options.">
    <p>Select collapses a known set into one line so the surface around it stays readable. It earns its place from roughly four options upward: below that the choices fit on screen as radios and hiding them behind a click costs more than it saves. Above about fifteen, the native list becomes a scroll you cannot search, and the choice wants a searchable field instead.</p>
    <T cols={['You want to…','Component','Why']} rows={[
      ['Pick one of 4–15 known values','Select','This component.'],
      ['Pick one of 2–3 values','RadioGroup','All options visible costs one row and no clicks.'],
      ['Pick one of hundreds','Input + suggestions','A list you cannot search is a list you scroll blindly. No Combobox ships yet (§14).'],
      ['Switch which view is shown','Tabs','Selecting a value is not navigation; a Select that navigates fails 3.2.2 (§08).'],
      ['Pick several values','CheckboxGroup','multiple is refused (§03) — native multi-select needs ctrl-click and hides what is chosen.'],
      ['Run one of several actions','ButtonGroup split button','A Select stores a value; a menu of verbs is an action control.'],
      ['Show a value that cannot change','Text, or Badge','Never a disabled Select as a read-only display (§06).'],
    ]}/>
    <ul>
      <li><strong>Use</strong> for environment, region, severity, owner, time window, status — closed sets the product defines.</li>
      <li><strong>Do not use</strong> when the option list needs styling: colour chips, two-line rows, icons, or a live count per option. A native <code>&lt;option&gt;</code> takes text, and only text.</li>
      <li><strong>Do not use</strong> to navigate on change. That is the single most common misuse, and it strands keyboard users (§07).</li>
      <li><strong>Do not use</strong> as the only field on a surface with no submit. If the pick applies immediately, say so in the surrounding copy — Select has no live-write contract the way <code>Switch</code> does.</li>
    </ul>
    <div className="demo">
      <Controlled />
      <div style={{width:260}}>
        <RadioGroup label="Rollout" name="spec-rollout" options={['Immediate','Canary']} defaultValue="Canary" />
      </div>
    </div>
  </Sec>

  <Sec n="02" title="Anatomy" note="A box we own, a list we don't.">
    <div className="demo"><div style={{width:280}}><Field label="Region" hint="Where the cluster is created."><Select options={REGIONS} placeholder="Choose a region" /></Field></div></div>
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      <div className="callout"><span className="cnum">1</span><span><strong>Box</strong> — <code>--control-h-md</code> tall, <code>--input-background</code>, <code>--input-radius</code> (4 px, the house corner). Identical chrome to <code>Input</code> and <code>Textarea</code>, so a form of mixed controls aligns on one edge.</span></div>
      <div className="callout"><span className="cnum">2</span><span><strong>Border</strong> — <code>--input-border</code> → <code>--border-control</code>, 4.74:1 on a card. The boundary is what says “interactive”: a Select with a structural hairline reads as a table cell.</span></div>
      <div className="callout"><span className="cnum">3</span><span><strong>Value text</strong> — 13 px <code>--input-text</code> when something is chosen, <code>--input-placeholder</code> (tertiary) while the placeholder option is. That switch is the only signal that no choice has been made yet, and it was broken on uncontrolled Selects before 1.2.0 (§13).</span></div>
      <div className="callout"><span className="cnum">4</span><span><strong>Chevron</strong> — <code>chevron-down</code> at 14 px (16 at <code>lg</code>), <code>--input-icon</code>, <code>pointer-events:none</code>. It is the only thing distinguishing the box from a text input, so it is never optional and never rotates (§09).</span></div>
      <div className="callout"><span className="cnum">5</span><span><strong>Gutter</strong> — computed as <code>padding-x + glyph + 6 px</code>, not a fixed 28 px. A long value now ellipsises before it reaches the chevron at every size.</span></div>
      <div className="callout"><span className="cnum">6</span><span><strong>Native popup</strong> — painted by the OS: our tokens do not reach inside it, and it inherits the platform's dark mode, not ours. Accept it, and never build a fake one on top.</span></div>
      <div className="callout"><span className="cnum">7</span><span><strong>Field wrapper</strong> — label, hint and error live in <code>Field</code>, which wires <code>id</code>, <code>aria-describedby</code>, <code>aria-invalid</code> and <code>aria-required</code> through context. The Select carries no label of its own.</span></div>
      <div className="callout"><span className="cnum">8</span><span><strong>Focus ring</strong> — 3 px <code>--input-focus-ring</code> on the box, <code>--input-focus-ring-invalid</code> when invalid.</span></div>
    </div>
    <T cols={['Region','Value (md)','Token']} rows={[
      ['Height','34 px','--control-h-md'],
      ['Padding left','12 px','--control-px-md'],
      ['Padding right','32 px (12 + 14 + 6)','computed'],
      ['Radius','4 px','--input-radius'],
      ['Border','1 px','--border-width · --input-border'],
      ['Value type','13 px','--text-sm'],
      ['Chevron','14 px','--icon-xs · --input-icon'],
      ['Focus','3 px ring','--input-focus-ring'],
    ]}/>
  </Sec>

  <Sec n="03" title="Properties" note="Eight props. No multiple, no clearable, no groups.">
    <T cols={['Prop','Type','Default','Notes']} rows={[
      ['options',<span className="t">Array&lt;string | {'{value,label}'}&gt;</span>,<span className="t">[]</span>,'Strings are used as both value and label. Empty warns — the control would open onto nothing.'],
      ['value',<span className="t">string</span>,'—','With onChange the control is controlled; without it, this seeds the initial choice.'],
      ['defaultValue',<span className="t">string</span>,'—','The same seed under the native name. With neither, and no placeholder, the browser selects the first option and the control treats it as chosen.'],
      ['onChange',<span className="t">(e) => void</span>,'—','Read e.target.value. Presence of this prop is what makes the control controlled.'],
      ['placeholder',<span className="t">string</span>,'—','Renders a leading empty option and keeps the value text tertiary until a real choice is made. Selectable, so a filter can be cleared.'],
      ['size',<span className="t">'sm' | 'md' | 'lg'</span>,<span className="t">'md'</span>,'Height, padding and type. §05.'],
      ['invalid',<span className="t">boolean</span>,<span className="t">false</span>,'Danger border and ring. Inherited from Field error — set it directly only outside a Field.'],
      ['disabled',<span className="t">boolean</span>,<span className="t">false</span>,'Genuinely unavailable, not read-only (§06).'],
      ['style',<span className="t">CSSProperties</span>,'—','Layout only — width, flex, grid placement — applied to the outer box.'],
      ['…rest',<span className="t">SelectHTMLAttributes</span>,'—','name, required, aria-label, data-*. size and multiple are removed from the type.'],
    ]}/>
    <p><strong><code>multiple</code> is refused and warns.</strong> A native multi-select asks the user to ctrl-click to add, cmd-click to remove, and shows a fixed-height scrolling box in which the selections above and below the fold are invisible. Nothing about it can be fixed from our side, so multi-choice is <code>CheckboxGroup</code>, which names the set and shows every option and its state.</p>
    <p><strong>There is no <code>clearable</code>, and no <code>optgroup</code> support.</strong> Clearing is what the placeholder option is for — it stays selectable precisely so a filter can go back to “All regions”. Grouping was considered and dropped: <code>&lt;optgroup&gt;</code> renders differently on every platform and is announced inconsistently, and a list that needs headings is usually a list that needs search.</p>
    <p><strong>Width is not a prop.</strong> A Select is <code>width:100%</code> of whatever it sits in, so it stretches inside a <code>Field</code> and takes a fixed width in a filter bar via <code>style</code>. Sizing by option length would make a filter bar reflow every time the value changed.</p>
  </Sec>

  <Sec n="04" title="Variants" note="No variant prop. Three placements.">
    <T cols={['Placement','Shape','Note']} rows={[
      ['In a Field','md, full width, label + hint','The default. Field owns the name and the error; the Select owns the value.'],
      ['Filter bar','size="sm", placeholder as "All …", aria-label','The placeholder is a real, selectable option here — it is how the filter is cleared.'],
      ['Table cell / toolbar','size="sm", fixed width, aria-label','Beside 12 px table type. Never full-width in a cell — the chevron would sit at the column edge.'],
    ]}/>
    <div className="demo col">
      <Row label="in a field"><div style={{width:300}}><Field label="Severity" hint="Alerts at or above this level page the on-call."><Select options={['Critical','Warning','Info']} defaultValue="Warning" /></Field></div></Row>
      <Row label="filter bar">
        <div className="filterbar">
          <Select size="sm" aria-label="Environment" placeholder="All environments" options={ENVS} style={{width:170}} />
          <Select size="sm" aria-label="Region" placeholder="All regions" options={REGIONS} style={{width:200}} />
          <Select size="sm" aria-label="Time window" options={['Last hour','Last 24 hours','Last 7 days']} style={{width:150}} />
          <Button variant="ghost" size="sm">Clear</Button>
        </div>
      </Row>
      <Row label="cell"><span style={{display:'inline-flex',alignItems:'center',gap:12,fontSize:'var(--text-xs)',color:'var(--text-secondary)'}}><span className="mono">api-gateway</span><Select size="sm" aria-label="Owner for api-gateway" options={['Platform','Payments','Growth']} defaultValue="Platform" style={{width:130}} /></span></Row>
    </div>
    <p><strong>There is no ghost or borderless variant.</strong> A Select without a border is indistinguishable from static text until hovered, and a table full of them looks like data rather than controls. If the density of a table cannot take bordered controls, the edit belongs in a row action, not in the cell.</p>
  </Sec>

  <Sec n="05" title="Sizes" note="Three, matched to Input — and lg exists for iOS.">
    <T cols={['size','Height','Padding-x','Type','Chevron','Use']} rows={[
      ['sm','28 px','8 px','12 px','14 px','Filter bars, toolbars, table cells.'],
      ['md','34 px','12 px','13 px','14 px','Default. Forms and panels.'],
      ['lg','40 px','16 px','16 px','16 px','Touch and single-question surfaces.'],
    ]}/>
    <div className="demo col">
      <Row label="sm"><div style={{width:260}}><Select size="sm" aria-label="Region small" options={REGIONS} defaultValue="eu-west-1" /></div></Row>
      <Row label="md"><div style={{width:260}}><Select size="md" aria-label="Region medium" options={REGIONS} defaultValue="eu-west-1" /></div></Row>
      <Row label="lg"><div style={{width:260}}><Select size="lg" aria-label="Region large" options={REGIONS} defaultValue="eu-west-1" /></div></Row>
    </div>
    <p><strong><code>lg</code> draws 16 px type, and that is not a taste decision.</strong> iOS Safari zooms the viewport when a control with type under 16 px receives focus, and on a Select the zoom happens as the picker opens — so the page is left scaled and offset when it closes. <code>--text-lg</code> is 16 px in this system; before 1.2.0 <code>lg</code> stayed at 13 px and did exactly that.</p>
    <T cols={['Density','sm','md','lg']} numCols={[1,2,3]} rows={[
      ['compact','24 px','28 px','34 px'],
      ['comfortable','28 px','34 px','40 px'],
      ['expanded','34 px','44 px','52 px'],
    ]}/>
    <p>Heights come from <code>--control-h-*</code>, so a Select tracks the surrounding density automatically. Under <code>expanded</code>, <code>md</code> is 44 px and clears the touch minimum on its own.</p>
  </Sec>

  <Sec n="06" title="States" note="Six on the box. The popup has none of ours.">
    <T cols={['State','Chrome','Notes']} rows={[
      ['Rest, empty','--input-border, value text tertiary','The placeholder option is selected. Tertiary text is the only cue that nothing has been chosen.'],
      ['Rest, chosen','--input-border, value text primary','Fixed in 1.2.0 for uncontrolled Selects, which showed every real choice in placeholder grey.'],
      ['Hover','--input-border-hover (7.78:1)','Border only. The fill never tints — the box is a value holder, not a button.'],
      ['Focus','--input-border-focus + 3 px --input-focus-ring','Set on focus, so it appears with the popup on click as well as on Tab. Consistent with Input (§14).'],
      ['Invalid','--input-border-invalid + --input-focus-ring-invalid on focus, aria-invalid','Colour is never the whole message: Field renders the text and the control points at it. Warns if it does not.'],
      ['Disabled','--input-background-disabled fill, --input-text-disabled text and chevron, cursor not-allowed','Inert, unfocusable, and its reason is never announced — so put the reason in the hint.'],
    ]}/>
    <div className="demo">
      <div className="rows" style={{width:250}}>
        <Select aria-label="Rest empty" placeholder="Choose a region" options={REGIONS} />
        <Select aria-label="Rest chosen" options={REGIONS} defaultValue="us-east-1" />
      </div>
      <div className="rows" style={{width:280}}>
        <Field label="Region" error="Pick a region before continuing."><Select options={REGIONS} placeholder="Choose a region" /></Field>
        <Field label="Region" hint="Fixed for the lifetime of this cluster."><Select options={REGIONS} defaultValue="eu-central-1" disabled /></Field>
      </div>
    </div>
    <div className="demo col">
      <Row label="greyscale"><span className="grey" style={{display:'inline-flex',gap:16}}><Select aria-label="g1" placeholder="Choose a region" options={REGIONS} style={{width:200}} /><Select aria-label="g2" options={REGIONS} defaultValue="us-east-1" style={{width:200}} /></span></Row>
    </div>
    <p className="warn"><strong>Never a disabled Select as a read-only value.</strong> A greyed dropdown still says “you could change this, but not now”, cannot be focused, and hides its own reason. If the value is fixed, print it as text or a <code>Badge</code> — and if it is fixed only in this context, say why in the hint, as above.</p>
    <p><strong>The option list has no states we control.</strong> Hover, selection highlight, checkmarks, and dark mode inside the popup are the platform's. Under our dark theme a native popup on some platforms still paints light; that is the cost of the native list, and it is a cost we chose over a fake listbox that breaks typeahead.</p>
  </Sec>

  <Sec n="07" title="Keyboard" note="All of it is the browser's, which is the point.">
    <T cols={['Key','Behaviour','Note']} rows={[
      ['Tab / Shift-Tab','Focuses the control.','One tab stop, closed or open.'],
      ['Space / Enter / Alt-↓','Opens the popup.','Platform-dependent, and correct on each platform because we did not reimplement it.'],
      ['↑ ↓','Moves through options. On some platforms this changes the value while closed.','This is why onChange must never navigate: arrowing past an option would fire it (§08).'],
      ['Type a letter','Typeahead — jumps to the next option starting with those letters.','The strongest argument for the native select, and the first thing a custom listbox loses.'],
      ['Home / End','First / last option.','Free.'],
      ['Enter (open)','Commits the highlighted option and closes.','Enter on a closed Select submits the form.'],
      ['Esc (open)','Closes without changing the value.','Free, and correctly scoped — it does not close the Dialog behind it.'],
    ]}/>
    <ul>
      <li><strong>Nothing here is our code.</strong> The component adds no key handlers at all, and must not: every one of these behaviours differs by platform, and matching them by hand is how a custom dropdown ends up worse than the native one.</li>
      <li><strong>Arrow keys can change the value without opening the list.</strong> Any handler that acts on change — navigating, submitting, refetching — will fire once per option passed. Debounce or act on <code>blur</code> if the work is expensive.</li>
      <li><strong>Do not intercept Enter</strong> to open the popup. On a closed Select in a form, Enter is submit, and stealing it breaks the form.</li>
    </ul>
  </Sec>

  <Sec n="08" title="Accessibility" note="Name, boundary, message — and the 3.2.2 trap.">
    <T cols={['Requirement','How it is met']} rows={[
      ['Role & name','A real <select>, announced as a combobox with its value and position ("3 of 5"). The name comes from Field\u2019s <label for> or aria-label. Warns when unnamed.'],
      ['A placeholder is not a name (2.4.6, 3.3.2)','New warning in 1.2.0. The placeholder option is replaced by the chosen value and stops being announced, so a Select whose only text was "Choose a region" had no name at all once used.'],
      ['Control boundary (1.4.11)','--input-border is --border-control: 4.74:1 on a card, 4.46:1 on the page band, 6.96:1 in dark. Hover 7.78:1. Retargeted from --border-default (1.29:1) in 1.2.0 with the rest of the sweep.'],
      ['Empty vs chosen (1.4.1)','The empty state is carried by tertiary TEXT, not by colour alone: the placeholder words are themselves the message ("Choose a region"), which is why they must read as an instruction (§10).'],
      ['Error identification (3.3.1)','invalid sets aria-invalid; Field renders the message with role="alert" and links it by id. A red border alone warns in the console.'],
      ['Required (3.3.2)','Field\u2019s required publishes aria-required through context. The placeholder option stays selectable, so validation — not the control — is what enforces the choice.'],
      ['Focus (2.4.7)','3 px --input-focus-ring on the box. Never removed: a Select in a filter bar has no visible label, so the ring is the only position cue.'],
      ['Target size (2.5.8)','The whole box is the target: 28 / 34 / 40 px, and 44 px at md under expanded density.'],
      ['Change of context (3.2.2)','A Select must not navigate, submit, or open a dialog on change. Arrow keys change the value while the list is closed, so an auto-navigating Select traps a keyboard user on the first option they pass. Filter on change is fine — it changes DATA, not context.'],
      ['Mobile','The native control opens the platform picker — a wheel on iOS, a sheet on Android. lg draws 16px type so iOS does not zoom the viewport as it opens (§05).'],
      ['Windows High Contrast','Border and chevron are currentColor-adjacent tokens and survive forced-colors; the popup is drawn by the OS and is correct by construction.'],
    ]}/>
    <div className="demo col">
      <Row label="wrong"><span style={{display:'inline-flex',alignItems:'center',gap:12}}><Select aria-label="Region" placeholder="Choose a region" options={REGIONS} style={{width:190}} /><span style={{fontSize:'var(--text-xs)',color:'var(--text-tertiary)'}}>placeholder as the only label — the name disappears on first use</span></span></Row>
      <Row label="right"><span style={{display:'inline-flex',alignItems:'flex-end',gap:12}}><div style={{width:190}}><Field label="Region"><Select options={REGIONS} placeholder="Choose a region" /></Field></div><span style={{fontSize:'var(--text-xs)',color:'var(--text-tertiary)'}}>a persistent name, plus an instruction</span></span></Row>
    </div>
  </Sec>

  <Sec n="09" title="Motion" note="140 ms on the box. Nothing on the chevron.">
    <T cols={['Change','Duration','Easing','Property']} rows={[
      ['Border colour','140 ms','--ease-out','border-color'],
      ['Focus ring','140 ms','--ease-out','box-shadow'],
      ['Chevron rotation','—','—','never'],
      ['Popup open / close','—','—','the platform\u2019s, not ours'],
    ]}/>
    <ul>
      <li><strong>The chevron does not rotate on open.</strong> We are not told when the native popup opens or closes, so a rotation would desynchronise from the thing it claims to describe — and a chevron flipping under an OS-drawn list is noise, not feedback.</li>
      <li><strong>All of it is <code>--transition-control</code></strong>, the same 140 ms as Input, Textarea and Button, so a form settles as one object.</li>
      <li><strong>Nothing animates the value text.</strong> A crossfade on change would read as loading.</li>
    </ul>
  </Sec>

  <Sec n="10" title="Content rules" note="Options are values. The placeholder is an instruction.">
    <T cols={['Slot','Job','Write','Not']} rows={[
      ['Field label','The noun being chosen','Region','Select region · Choose region · Region:'],
      ['Placeholder','An instruction, when nothing is chosen yet','Choose a region','— · None · Please select an option'],
      ['Placeholder (filter)','The unfiltered state, as a real option','All regions','Any · Filter by region · —'],
      ['Option','The value as the user says it','us-east-1 · N. Virginia','US East 1 (Virginia) region'],
      ['Hint','What the choice affects','Where the cluster is created.','Choose one of the options below.'],
      ['Error','What to do','Pick a region before continuing.','Invalid selection · This field is required'],
    ]}/>
    <ul>
      <li><strong>Never “Select …” as the label.</strong> The control is the selecting; the label is the noun. It also collides with the announced role: “Select region, combobox”.</li>
      <li><strong>A placeholder is not a default.</strong> If one option is right nearly always, ship it as the value and drop the placeholder — an empty Select the user must open is a question we chose not to answer.</li>
      <li><strong>Never a bare dash or “None”.</strong> In a form the empty option should tell the user what to do; in a filter it should name the unfiltered set (“All regions”), which is a real, meaningful choice.</li>
      <li><strong>Order options by how they are used</strong> — frequency, then severity or scale, then alphabetical. Alphabetical is a fallback, not a default: Critical / Warning / Info beats Critical / Info / Warning.</li>
      <li><strong>Keep option labels short and front-loaded.</strong> They ellipsise at the gutter, and the popup width is the platform's business.</li>
      <li><strong>No counts, no icons, no punctuation tricks in options.</strong> Options are plain text; a count that goes stale inside a closed list is worse than no count.</li>
      <li><strong>Fifteen options is the soft ceiling.</strong> Past that, the user is scrolling a list they cannot search — group the surface differently or use a searchable field (§14).</li>
    </ul>
  </Sec>

  <Sec n="11" title="Responsive" note="Full width down, and never narrower than its longest value.">
    <T cols={['Breakpoint','Behaviour']} rows={[
      ['mobile ≥ 0','Full width, one per row, size="lg" where the surface is touch-first. The native picker takes over the screen, so the box width does not affect the list.'],
      ['tablet ≥ 600','Selects may pair with a sibling field on one row. A filter bar wraps rather than shrinking its Selects below their longest value.'],
      ['desktop ≥ 1024','As authored: full width in a Field, fixed width in a filter bar.'],
      ['ultrawide ≥ 1600','Keep the form inside --measure-narrow. A 900 px Select puts its chevron a screen away from its value.'],
    ]}/>
    <div className="demo col" style={{maxWidth:340}}>
      <Field label="Region" hint="Where the cluster is created."><Select size="lg" options={REGIONS} placeholder="Choose a region" /></Field>
      <div className="filterbar"><Select size="sm" aria-label="Environment mobile" placeholder="All environments" options={ENVS} style={{flex:'1 1 150px'}} /><Select size="sm" aria-label="Window mobile" options={['Last hour','Last 24 hours']} style={{flex:'1 1 130px'}} /></div>
    </div>
    <ul>
      <li><strong>Size a filter Select to its longest option, not to the grid.</strong> Values that ellipsise in a filter bar leave the user unable to read what they filtered by.</li>
      <li><strong>Do not shrink below <code>sm</code>.</strong> There is no <code>xs</code>; a filter bar that will not fit should wrap or collapse behind a “Filters” button.</li>
    </ul>
  </Sec>

  <Sec n="12" title="Anti-patterns">
    <div className="two">
      <div className="pane do"><h3>Do</h3><ul>
        <li>Wrap it in a <code>Field</code>, or pass <code>aria-label</code>.</li>
        <li>Ship a sensible default instead of a placeholder.</li>
        <li>Use the placeholder as “All …” in filters.</li>
        <li>Order options by use, not alphabet.</li>
        <li>Let the browser own keyboard and popup.</li>
        <li>Use <code>lg</code> on touch surfaces.</li>
        <li>Print read-only values as text.</li>
      </ul></div>
      <div className="pane dont"><h3>Don’t</h3><ul>
        <li>Navigate or submit on change.</li>
        <li>Use the placeholder as the label.</li>
        <li>“Select …” as the label text.</li>
        <li><code>multiple</code> — that is a CheckboxGroup.</li>
        <li>40 options with no search.</li>
        <li>A disabled Select as a read-only field.</li>
        <li>A fake styled dropdown over it.</li>
        <li>Two Selects for a yes/no choice.</li>
      </ul></div>
    </div>
    <p className="warn"><strong>The failure this component invites.</strong> A Select wired to navigate on change — “jump to environment”. With the list closed, arrow keys move through options and fire change on each one, so a keyboard user pressing ↓ once is thrown to another page and cannot reach the second option at all. The same pattern also breaks the back button, because the value that navigated is restored on return and can fire again. If a dropdown must lead somewhere, use <code>Tabs</code> for views or a menu of links for destinations.</p>
  </Sec>

  <Sec n="13" title="Implementation notes" note="What ships, and the five defects closed in 1.2.0.">
    <ul>
      <li><strong>A native <code>&lt;select&gt;</code> with <code>appearance:none</code></strong>, inside a wrapper that draws the border, background, radius and focus ring. The wrapper carries the hover state; the select carries the value, the keyboard and the form. No portal, no listbox, no popper.</li>
      <li><strong>The chevron gutter is computed</strong> — <code>padding: 0 calc(px + glyph + 6px) 0 px</code> — and the glyph sits at <code>right: px</code>. It was a fixed <code>28px</code> gutter with the chevron at <code>right: 9px</code>, which was tight at <code>md</code> and wrong at both other sizes.</li>
      <li><strong><code>lg</code> now draws <code>--control-px-lg</code> and <code>--text-lg</code></strong> (16 px), matching the Input fix: at 13 px, iOS Safari zoomed the viewport as the picker opened and left the page scaled behind it.</li>
      <li><strong>Uncontrolled Selects track their own value.</strong> The placeholder colour was derived from the <code>value</code> prop, which is <code>undefined</code> when uncontrolled — so an uncontrolled Select rendered every real choice in placeholder grey. It now keeps internal state seeded from <code>value</code> or <code>defaultValue</code>, and — with neither, and no placeholder — from the first option, which is what the browser selects. Controlled Selects still read <code>value</code> alone.</li>
      <li><strong><code>{'{...rest}'}</code> is spread before our handlers</strong>, and <code>onFocus</code>/<code>onBlur</code> compose the caller's. Previously <code>rest</code> was spread last, so a consumer's own <code>onFocus</code> silently replaced the focus-ring setter and the ring never appeared.</li>
      <li><strong>Four console warnings</strong>, none of which change rendering: no accessible name; <code>invalid</code> with no <code>aria-describedby</code>; <code>multiple</code>; and an empty <code>options</code> array.</li>
      <li><strong>Options accept strings or <code>{'{value,label}'}</code></strong> and are normalised once. <code>option</code> elements are never styled — nothing in the popup is ours.</li>
      <li><strong>No new tokens.</strong> Select consumes the <code>--input-*</code> set on purpose: the two controls must be indistinguishable at rest, and a parallel <code>--select-*</code> family would let them drift.</li>
      <li><strong>Tokens consumed:</strong></li>
    </ul>
    <div className="tokenlist">
      <span>--input-background</span><span>--input-background-disabled</span><span>--input-border</span><span>--input-border-hover</span><span>--input-border-focus</span><span>--input-border-invalid</span><span>--input-text</span><span>--input-text-disabled</span><span>--input-placeholder</span><span>--input-icon</span><span>--input-radius</span><span>--input-focus-ring</span><span>--input-focus-ring-invalid</span><span>--control-h-sm · md · lg</span><span>--control-px-sm · md · lg</span><span>--text-xs · --text-sm · --text-lg</span><span>--icon-xs</span><span>--border-width</span><span>--transition-control</span>
    </div>
  </Sec>

  <Sec n="14" title="Developer notes" note="Integration, testing, open items.">
    <pre>{`import { Field, Select } from '@meridian/ds';

// controlled, named by Field, validated by the form
const [region, setRegion] = React.useState('');

<Field label="Region" hint="Where the cluster is created."
  error={submitted && !region ? 'Pick a region before continuing.' : undefined}>
  <Select options={regions} placeholder="Choose a region"
    value={region} onChange={(e) => setRegion(e.target.value)} />
</Field>

// a filter: the placeholder IS the unfiltered option, and change alters
// data, not context — so it is safe to act on immediately
<Select size="sm" aria-label="Environment" placeholder="All environments"
  options={['Production', 'Staging', 'Development']}
  value={env} onChange={(e) => setEnv(e.target.value)} />

// uncontrolled inside a plain form — the browser owns the value
<Field label="Severity">
  <Select name="severity" options={['Critical', 'Warning', 'Info']} value="Warning" />
</Field>`}</pre>
    <ul>
      <li><strong>Options must be stable.</strong> Rebuilding the array inline each render is fine for a fixed list, but a list that arrives async should render a <code>disabled</code> Select with a placeholder that says so — never an empty one, which warns and opens onto nothing.</li>
      <li><strong>Never navigate in <code>onChange</code></strong> (3.2.2, §08). Filtering, refetching and enabling a submit are all fine; changing the page is not.</li>
      <li><strong>Expensive work belongs on <code>blur</code>.</strong> Closed-list arrow keys fire change per option, so a query per change can fire five times in a keystroke.</li>
      <li><strong>Testing.</strong> <code>getByRole('combobox', {'{ name: /region/i }'})</code> — the accessible name comes from <code>Field</code>, so asserting it also asserts the wiring. Use <code>selectOptions</code>, assert <code>onChange</code> receives <code>e.target.value</code>, and assert the placeholder option is still selectable after a choice. For the 1.2.0 fix, assert an uncontrolled Select renders its value in <code>--input-text</code>, not <code>--input-placeholder</code>.</li>
      <li><strong>Lint.</strong> Flag a <code>Select</code> with no <code>Field</code> ancestor and no <code>aria-label</code>; a label matching <code>/^(select|choose)/i</code>; <code>multiple</code>; <code>onChange</code> whose body calls <code>navigate</code>, <code>router.push</code> or <code>location.assign</code>; and more than 15 static <code>options</code>.</li>
      <li><strong>Frozen 4 Sep 2026.</strong> API closed: <code>options</code>, <code>value</code>, <code>onChange</code>, <code>placeholder</code>, <code>size</code>, <code>invalid</code>, <code>disabled</code>, <code>style</code>, plus native select attributes minus <code>size</code> and <code>multiple</code>.</li>
      <li><strong>Breaking, visual:</strong> <code>lg</code> Selects get taller type and wider padding, and an uncontrolled Select's value text goes from tertiary to primary. Both are corrections; both change layout slightly. Pull <code>styles.css</code> and <code>_ds_bundle.js</code> together.</li>
      <li><strong>Closed as decided — no <code>optgroup</code>, no <code>clearable</code>, no borderless variant.</strong> Grouping renders and announces inconsistently across platforms; the placeholder is the clear; a borderless Select is indistinguishable from text (§03, §04).</li>
      <li><strong>Closed as decided — the focus ring is not <code>:focus-visible</code>-gated.</strong> A click on a Select opens the popup, so the ring appearing with it is honest, and gating would diverge from <code>Input</code>. Revisit for both controls together or not at all.</li>
      <li><strong>Closed — <code>Combobox</code> shipped in 1.3.0.</strong> The gap above ~15 options is now filled by a real component rather than a prop on this one: searchable, with hand-written listbox ARIA and an optional description line. It cost everything this spec says the native list gives away, which is the argument for keeping Select the default whenever it fits. Combobox is not clipped by its container either — its list is viewport-anchored — so a table-cell picker is a judgement about option count, not about layout: under ~15 options it stays a Select.</li>
      <li><strong>Open — the native popup ignores our dark theme</strong> on some platforms, painting a light list under a dark surface. Building our own list would fix the paint and break typeahead, mobile pickers and screen-reader dropdown behaviour. Not a trade we are making; documented in §06 so nobody re-litigates it as a bug.</li>
      <li><strong>Closed — <code>tokens.json</code> regeneration.</strong> Rebuilt from the CSS at 1.2.0, closing the debt carried since the Input freeze; <code>npm run tokens:check</code> passes and no token values changed. Select adds no tokens of its own — it consumes the <code>--input-*</code> set (§13), and the rebuild confirms there is no stray <code>--select-*</code> family.</li>
    </ul>
  </Sec>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Spec />);
