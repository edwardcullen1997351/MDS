<script type="text/babel">
const { Avatar, AvatarGroup, Text, Badge, Card, Button, Tag, Icon } = window.MeridianDesignSystem_962c43;
const Sec = ({n,title,note,children}) => (
  <section>
    <div className="sec-head"><span className="num">{n}</span><h2>{title}</h2>{note?<span className="sec-note">{note}</span>:null}</div>
    <div className="body">{children}</div>
  </section>
);
const T = ({cols,rows}) => (
  <table><thead><tr>{cols.map((c,i)=><th key={i}>{c}</th>)}</tr></thead>
  <tbody>{rows.map((r,i)=><tr key={i}>{r.map((c,j)=><td key={j} className={j===0?'k':''}>{c}</td>)}</tr>)}</tbody></table>
);
const Row = ({label,children}) => <div className="staterow"><span className="lbl">{label}</span>{children}</div>;

const SAMPLE1 = "// The supported way — the wrapper owns role, focus, keyboard and name\n<Button variant=\"ghost\" size=\"sm\" aria-label=\"Open Maya Osei's profile\"\n        onClick={openProfile}>\n  <Avatar name=\"Maya Osei\" size=\"sm\" decorative />\n</Button>";
const SAMPLE2 = "import { Avatar, AvatarGroup, deriveInitials } from '@meridian/ds';\n\n// In a table cell — decorative, because the name is right there\n{ key: 'owner', header: 'Owner', render: (r) => (\n    <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>\n      <Avatar name={r.owner} size=\"sm\" decorative />\n      {r.owner}\n    </span>\n  ) }\n\n// Alone in a topbar — announcing, because it IS the only identity present\n<Avatar name=\"Maya Osei\" size=\"md\" status=\"online\" statusLabel=\"online\" />\n\n// Several people on one work order\n<AvatarGroup people={wo.assignees} max={4} />";

function Spec(){
return (
<div className="page">
  <div className="masthead">
    <span className="eyebrow">Core · Component specification</span>
    <h1>Avatar</h1>
    <p className="lede">A person or a machine, identified in the space of a table row. The decision that shapes every other line of this spec is a refusal: <strong>this avatar has no colour identity</strong>, because in a system where every hue already means something, a hashed one would put a Critical-red disc beside one operator and a Success-green disc beside the next.</p>
    <div className="meta">
      <span>components/core/Avatar.jsx · AvatarGroup.jsx</span><span>window.MeridianDesignSystem_962c43.Avatar</span><span style={{color:'var(--text-primary)'}}>status: frozen 5 Sep 2026 · 0 open items</span><span>since: 1.21.0</span>
    </div>
  </div>

  <Sec n="01" title="Purpose" note="Identity at a glance, in 20 to 64 pixels.">
    <p>An Avatar answers <em>who</em> — the operator who acknowledged an alarm, the planner who released a work order, the service account that wrote a row. It is a display element with no behaviour: it holds no state, fires no events and cannot be clicked (§07).</p>
    <p className="warn"><strong>The colour question, first, because it is the whole design.</strong> Every avatar in every other design system hashes the name to a hue. Meridian cannot. Green is Success and Running. Orange is Warning. Red is Critical. The ordered <code>--viz-1…6</code> series means <em>series</em> identity — and its second step <em>is</em> <code>green-600</code>, its sixth <em>is</em> <code>red-600</code>. Hashing names onto any of them puts a red disc beside a name in an alarm list, where red already means something urgent. Design Principles states the law this follows: <em>"a colour used decoratively is a colour that can no longer carry meaning."</em> So the disc is <code>--surface-sunken</code> for everyone, the initials do the identifying, and the only coloured pixel in the component is the presence dot — because presence genuinely <em>is</em> a state, and the state ramps are exactly what state should use.</p>
    <div className="demo">
      <Avatar name="Maya Osei" size="lg" /><Avatar name="Tomas Lind" size="lg" /><Avatar name="Ana Ruiz" size="lg" /><Avatar name="Ken Ito" size="lg" /><Avatar name="PRS-4120" kind="machine" size="lg" />
      <Text size="xs" tone="tertiary">Five identities, one surface. The initials carry it; nothing here competes with a status Badge.</Text>
    </div>
    <T cols={['You want to…','Component','Why']} rows={[
      ['Show who a row belongs to','Avatar','This component.'],
      ['Show several people on one thing','AvatarGroup','Overlap, overflow and ONE announcement instead of six (§04).'],
      ['Show a machine or asset ID','Avatar kind="machine"','Mono type and square corners. PRS-4120 is not a person.'],
      ['Show a state — Running, Down, Acknowledged','Badge','A Badge is a condition the system determined. An avatar is a party.'],
      ['Show a category or a tag','Tag','Identity is not classification.'],
      ['Open a profile when clicked','A Button or Link WRAPPING an Avatar','§07. The avatar itself takes no onClick, ever.'],
      ['Show a count of people','Badge or plain text','A disc reading "+12" with nothing beside it is a number wearing a costume.'],
    ]}/>
  </Sec>

  <Sec n="02" title="Anatomy" note="A disc, initials underneath, and at most one dot.">
    <div className="demo">
      <Avatar name="Maya Osei" size="xl" status="online" statusLabel="online" />
      <Avatar name="PRS-4120" kind="machine" size="xl" />
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      <div className="callout"><span className="cnum">1</span><span><strong>Disc</strong> — <code>--avatar-background</code> (sunken) inside a <code>--avatar-border</code> hairline that must separate from that fill in <em>both</em> theme scopes (§08 — it did not, for one build), at <code>--avatar-radius</code> (full). Both <code>width</code> and <code>min-width</code> are set, because a disc in a flex row is otherwise squashed into an oval — the one way an avatar visibly breaks.</span></div>
      <div className="callout"><span className="cnum">2</span><span><strong>Initials</strong> — derived from <code>name</code> by rules that are not obvious (§10), at 0.4 × the disc. The type size is a <em>ratio</em>, not a token per size: five hand-picked sizes drift the moment a sixth size is added.</span></div>
      <div className="callout"><span className="cnum">3</span><span><strong>Photo</strong> — optional, <code>object-fit: cover</code>, absolutely positioned <em>over</em> the initials rather than instead of them. A 404 reveals the initials with no swap and no flash, which is the whole reason for the ordering.</span></div>
      <div className="callout"><span className="cnum">4</span><span><strong>Presence dot</strong> — 0.3 × the disc, bottom-right, ringed in <code>--avatar-group-ring</code> so it reads as sitting on top rather than being part of the portrait. The only coloured element. It overhangs the disc edge, so the disc must NOT clip its children (§13) — for one build it did, and the dot rendered as a crescent with no ring at all.</span></div>
      <div className="callout"><span className="cnum">5</span><span><strong>Machine treatment</strong> — <code>--avatar-radius-machine</code> (square) and mono type on <code>--avatar-background-machine</code>. This is <code>Tag</code>'s rule applied to identity: mono for identifiers that came out of the data, sans for names a human wrote.</span></div>
      <div className="callout"><span className="cnum">6</span><span><strong>Fallback glyph</strong> — <code>user</code> or <code>cpu</code>, only when there is no name and no initials to render. It is a hole-filler, and it warns.</span></div>
    </div>
  </Sec>

  <Sec n="03" title="Properties" note="Nine, and one conspicuous absence.">
    <T cols={['Prop','Type','Default','Notes']} rows={[
      ['name','string','—','The full name. Initials derive from it; it becomes the accessible name.'],
      ['initials','string','derived','Override for a nickname, or a name the heuristic gets wrong (§10).'],
      ['src','string','—','Optional photo. Initials sit underneath, so a failure needs no handling by the caller.'],
      ['kind','person | machine','person','machine: mono type, square corners, cpu fallback.'],
      ['size','xs | sm | md | lg | xl','md','20 · 24 · 32 · 40 · 64 px (§05).'],
      ['status','online | busy | away | offline','—','Presence. Refused below 24px. Needs statusLabel.'],
      ['statusLabel','string','—','The presence meaning in words. Without it the dot is colour-only (§08).'],
      ['decorative','boolean','false','Hides it from the accessibility tree. CORRECT whenever the name is already beside it.'],
      ['style','CSSProperties','—','On the disc.'],
      ['onClick','—','REFUSED','Not a prop. Warns and is stripped (§07).'],
    ]}/>
    <p><strong>There is no <code>color</code>, <code>tone</code> or <code>hue</code> prop, and no <code>colorFromName</code>.</strong> Not an oversight — adding one would let a product reintroduce exactly the failure §01 describes, and a design system that documents a rule while shipping the prop that breaks it has documented nothing.</p>
  </Sec>

  <Sec n="04" title="Variants" note="Person, machine, and the group.">
    <div className="demo col">
      <Row label="person"><Avatar name="Maya Osei" size="lg" /><Avatar name="Tomas Lind" size="lg" /><Text size="xs" tone="tertiary">Sans, medium weight, round.</Text></Row>
      <Row label="machine"><Avatar name="PRS-4120" kind="machine" size="lg" /><Avatar name="svc-scheduler" kind="machine" size="lg" /><Text size="xs" tone="tertiary">Mono, regular weight, square. An asset ID is not a name.</Text></Row>
      <Row label="photo"><Avatar name="Maya Osei" size="lg" /><Text size="xs" tone="tertiary">With a <code>src</code> the photo covers this disc; the initials stay underneath, so a 404 reveals them with no swap. Not demonstrated live — a deliberately broken image would make this card report a console error on every load, forever.</Text></Row>
      <Row label="group"><AvatarGroup people={['Maya Osei','Tomas Lind','Ana Ruiz','Ken Ito','Jo Park','Sam Vale']} max={4} /><Text size="xs" tone="tertiary">Focus or hover the “+2” to see who the other two are (§08).</Text></Row>
    </div>
    <p><strong><code>AvatarGroup</code> is its own component, for the reason <code>ChipGroup</code> is:</strong> the overlap, the overflow maths and the announcement <em>are</em> the job, and <code>Avatar.jsx</code> is only the disc. Six avatars laid out by hand in a table cell announce six times; the group says the sentence a person actually wants, once. It also owns three things a row of Avatars cannot get right — the overlap expressed as a <em>fraction</em> of the disc so the group’s width stays predictable at every size; the ring that punches each disc out of the one behind it, which must be the <em>surface</em> colour rather than a border colour (a grey border on a grey disc just gets thicker); and <strong>one initial per disc</strong>. That last one is the correction of a real defect: the group defaults to <code>sm</code>, 24px, which is exactly where Avatar’s one-initial rule stops applying — so every disc drew two glyphs and then lost the left one to the neighbour overlapping it, rendering “’L” and “)R”. <strong>The glyph count is a function of the READABLE width, not the disc width</strong>, and in a group every disc but the top one is 32% covered. Precise identification is not the group’s job; the <code>role="img"</code> label and the chip’s tooltip carry the names.</p>
    <p>Paint order is why the group lays out in <code>row-reverse</code>: later DOM siblings paint above earlier ones, so reversing the list puts the <em>first</em> person on top with no <code>z-index</code> bookkeeping at all.</p>
  </Sec>

  <Sec n="05" title="Sizes" note="Five rungs, pinned to the things they sit beside.">
    <div className="demo col">
      {[['xs','20px · 1 initial','a dense table row, an activity line'],['sm','24px · 1 initial','a comfortable table row, a group, a Menu item'],['md','32px · 2 initials','the topbar, a list row, a card header'],['lg','40px · 2 initials','a detail panel, a page header'],['xl','64px · 2 initials','a profile page — the only place this size belongs']].map(([s,px,use])=>(
        <Row key={s} label={s+' · '+px}><Avatar name="Maya Osei" size={s} /><Text size="xs" tone="tertiary">{use}</Text></Row>
      ))}
    </div>
    <p className="warn"><strong>Two initials from <code>md</code> up; <code>xs</code> and <code>sm</code> render one.</strong> The threshold is 32px, not 24, and the reason is a floor rather than a smudge: the type size is a ratio of the disc, so two glyphs at <code>sm</code> land at 10px and at <code>xs</code> at 8px — under <code>--text-2xs</code> (11px), the system’s smallest type. That floor is now enforced in CSS with <code>max()</code> rather than trusted to arithmetic, because this section previously justified the rule by citing the 8px figure while 8px was still exactly what shipped: the glyph count had been fixed and the ratio had not, and a single ratio cannot express a floor. One glyph also takes a larger share of the disc than two (0.55 against 0.42), since it has the room. The component picks the count from a plain-number map of the rungs — not by parsing the size token, which is how this rule shipped dead for one build (§13) — so a product does not have to know it — but it is the reason an <code>xs</code> avatar identifies less precisely, and why a dense table should put the name in a column rather than relying on the disc.</p>
    <p><strong><code>status</code> is refused below 24px</strong> — a separate threshold from the glyph count, with its own reason: 0.3 × a 20px disc is a 6px dot, which no one can see and no one can distinguish by hue. It warns and the dot is still drawn, because silently dropping it would hide the mistake.</p>
  </Sec>

  <Sec n="06" title="States" note="It has almost none. What looks like state is data.">
    <T cols={['Situation','What renders','Note']} rows={[
      ['Name present','Derived initials on a sunken disc.','The normal case.'],
      ['Photo loading','The initials. Nothing else.','No skeleton, no spinner: the initials are already a complete answer, not a placeholder for one.'],
      ['Photo failed','The initials, revealed.','onError flips one flag. The initials never left.'],
      ['No name, no initials, no src','A user or cpu glyph, and a console warning.','A hole-filler. Something upstream did not load.'],
      ['Presence','A coloured dot, bottom-right.','Data about the person, not a state of the component.'],
      ['Disabled / deactivated user','NOTHING in this component.','A deactivated account is a fact for the row to state in words, not a greyed disc — grey already means "no presence" here.'],
      ['Hover / focus / pressed','NOTHING.','It is not a control (§07). If it looks pressable, the wrapper supplies those states.'],
    ]}/>
    <p><strong>There is no <code>disabled</code> and no <code>loading</code>.</strong> Both were considered and both are category errors: an avatar renders a fact about a person, and a person is not disabled. A deactivated user needs a word in the row — the system already has <code>Badge</code> for that — because a dimmed disc is indistinguishable from the <code>offline</code> presence dot and from a low-contrast rendering bug.</p>
  </Sec>

  <Sec n="07" title="Keyboard" note="None, and the refusal is the interesting part.">
    <T cols={['Key','Does','Why']} rows={[
      ['Tab','Skips it entirely.','It is a span with no tabindex. Nothing in it does anything.'],
      ['—','onClick is refused: warned about and stripped.','See below.'],
    ]}/>
    <p className="warn"><strong><code>onClick</code> is not supported, and this is a deliberate refusal rather than a missing feature.</strong> An avatar that opens a profile is the exact defect <code>Card</code> shipped with until 1.15.0: a pointer cursor and a hover treatment on an element with no <code>role</code>, no <code>tabIndex</code> and no key handler — a mouse-only control, invisible to keyboards and screen readers. Passing the handler through the spread would have produced it silently, so the component strips <code>onClick</code> and says why. <code>Icon</code> refuses it for the same reason and with the same wording.</p>
    <pre>{SAMPLE1}</pre>
    <p>Note <code>decorative</code> in that example: the Button already carries the accessible name, so an announcing avatar inside it would say "Maya Osei" twice.</p>
  </Sec>

  <Sec n="08" title="Accessibility" note="Mostly about NOT announcing.">
    <ul>
      <li><strong><code>decorative</code> is the most important prop, and it is under-used.</strong> An avatar in a table cell beside the person's name, or in a list row above it, is a duplicate: a screen reader reads "Maya Osei, image, Maya Osei". Pass <code>decorative</code> and the disc drops out of the tree entirely. The default announces, because an avatar alone in a topbar genuinely is the only identity present — but in a table, <code>decorative</code> is almost always right.</li>
      <li><strong>Announcing avatars are <code>role="img"</code> with an <code>aria-label</code></strong>, not an <code>&lt;img&gt;</code> with alt text: the visible content is text, so a real image element would need an <code>alt</code> duplicating initials that are already rendered.</li>
      <li><strong>The photo is always <code>alt=""</code>.</strong> The disc carries the name; the photograph is a second rendering of the same fact.</li>
      <li><strong>The presence dot is colour-only unless <code>statusLabel</code> is passed,</strong> which is WCAG 1.4.1, so the component warns. The label is appended to the accessible name — "Maya Osei, on a call" — rather than living in a <code>title</code>, which never reaches most screen readers.</li>
      <li><strong>Presence hues are the state ramps</strong> (<code>--status-success-solid</code>, <code>--status-critical-solid</code>, <code>--status-warning-solid</code>), which is legitimate <em>because presence is a state</em>. That is the same law that forbids hashing identity to a hue, applied in the direction it permits.</li>
      <li><strong><code>AvatarGroup</code> announces as TWO things, and the reason is worth reading.</strong> A <code>role="img"</code> names the shown people; the “+N more” chip is a separate, focusable element whose <code>Tooltip</code> names the rest. It shipped as one announcement with a decorative chip, and the open item asking for a tooltip on that chip could not be satisfied as written: a tooltip needs a focusable trigger with an accessible name (Tooltip §01), and a focusable element inside an <code>aria-hidden</code> subtree is a worse defect than the one being fixed — screen-reader focus lands on something that is not in the accessibility tree at all. So the chip left the hidden region. <strong>The general rule: a decorative element may not own a focusable trigger; it stops being decorative instead.</strong> Name and description split exactly as Tooltip requires — “+2 more” is the name, “Jo Park, Sam Vale” the description — so nothing is said twice, and the mouse user, the keyboard user and the screen-reader user all learn who the others are.</li>
      <li><strong>Contrast, all four text elements and both indicators.</strong> Person initials on <code>--surface-sunken</code> measure 6.76:1 and machine initials on <code>--surface-raised</code> 4.74:1. <strong>The “+N” chip is text too</strong> — it carries information, so it owes 4.5:1, and it is the element this section originally omitted while claiming coverage. At 9.6px (a 24px <code>sm</code> disc × the 0.4 ratio) no grey lighter than <code>--text-secondary</code> clears the threshold on that ground: <code>--text-tertiary</code> measures 4.11:1. So the chip <em>recedes by letterform rather than by lightness</em> — a plus sign and a digit among letters is already the odd one out — and retargeting <code>--avatar-overflow-foreground</code> lighter is a 1.4.3 regression rather than a style choice. The presence dot is a non-text indicator owing 3:1 against its own ring; <code>offline</code> shipped as <code>--border-strong</code> and measured 1.60:1 (§13). Both are checked in both theme scopes — and that check earned its keep immediately: <code>--avatar-border</code> shipped as <code>--border-subtle</code>, which in the light scope is <code>--grey-100</code>, the same value as <code>--surface-sunken</code>. A person avatar drew an invisible hairline on its own fill while still spending 1px of the disc under <code>border-box</code>. Retargeted to <code>--border-default</code> in 1.21.1. It is the same collision Skeleton hit in 1.16, in the same token pair, which is why the rule is now written into <code>components.css</code> beside the token rather than left to memory.</li>
    </ul>
  </Sec>

  <Sec n="09" title="Motion" note="None — and this corrects a claim in EmptyState §09.">
    <T cols={['Moment','Motion','Why']} rows={[
      ['Photo arriving','NONE.','A fade per photo is 40 fades in a 40-row table, all firing while the operator scans down the column.'],
      ['Initials revealed after a 404','NONE.','They were always there; nothing changed except an image failing to cover them.'],
      ['Presence changing','NONE. No pulse on "online".','A pulsing dot is a permanent animation in the corner of the eye, and presence is not urgent.'],
      ['Group hover','NONE. The discs do not fan out or spread.','A layout that rearranges under the pointer moves the target the user is aiming at.'],
      ['Appearing in a list','NONE.','Data never animates in — Table §06.'],
    ]}/>
    <p className="warn"><strong>Correction to <code>EmptyState</code> §09.</strong> That spec claimed to be "the only component in Meridian with an empty motion table". It is now one of two, and the claim has been amended there. Both are empty for the same underlying reason, worth stating once: <em>a component that renders in bulk cannot afford motion.</em> An empty state appears once per query, which in a filter-as-you-type field is once per keystroke; an avatar appears once per row. Any animation multiplies by the number of instances, and the system has no transition that survives being multiplied by forty.</p>
  </Sec>

  <Sec n="10" title="Content rules" note="Deriving initials is where every implementation is wrong.">
    <p>The one-liner almost everyone writes — split on spaces, take each first letter — is wrong in four of the six cases below. The rules are exported as <code>deriveInitials</code> — and reachable as <code>Avatar.deriveInitials</code>, which is the form a consumer of the compiled bundle can actually call, since only capital-initial exports reach the window namespace. It shipped for one build as a bare export that was declared in the <code>.d.ts</code>, promised here and callable by nobody, which guaranteed the drift the export exists to prevent. <code>Icon.setBasePath</code> had already solved this and the pattern was not followed.</p>
    <T cols={['Input','Renders','Rule']} rows={[
      ['Maya Osei','MO','First grapheme of the first word + first of the LAST word.'],
      ['María del Carmen Rodríguez','MR','First and last, never the first two — particles and middle names are not what anyone is known by. The naive split gives "MD".'],
      ['李小龙','李','A Han, Hiragana, Katakana or Hangul first glyph returns ALONE: one character is already a whole name element, and taking two slices into the given name to produce something nobody is called. The naive split gives the entire name, because it contains no spaces.'],
      ['Prince','P','One word, one initial. The one case the naive split also gets right.'],
      ['m.osei@meridian.industries','MO','An email is a name that has not loaded yet. The local part is split on dots and underscores; everything after @ is a company. The naive split gives "M".'],
      ['PRS-4120 (kind="machine")','PR','A single token holding a digit or a separator is an IDENTIFIER, not a name, and takes TWO graphemes of its leading run \u2014 PR distinguishes a press from PKG-6014\u2019s PK, where P distinguishes nothing. Splitting on the hyphen would give "P4", a letter paired with an arbitrary digit. Renders in mono because an asset ID is not a person.'],
    ]}/>
    <div className="demo">
      {['Maya Osei','María del Carmen Rodríguez','李小龙','Prince','m.osei@meridian.industries'].map((n)=>(
        <div key={n} style={{display:'flex',alignItems:'center',gap:8}}><Avatar name={n} size="lg" /><Text size="xs" tone="tertiary" style={{maxWidth:140}}>{n}</Text></div>
      ))}
    </div>
    <ul>
      <li><strong>The split is grapheme-aware</strong> via <code>Intl.Segmenter</code>, falling back to code points. A flag or a skin-toned emoji is two to seven code points and slicing it renders a broken glyph — rare in a name field, but the failure is visible mojibake rather than a wrong letter.</li>
      <li><strong>Always pass the full name, never pre-computed initials,</strong> unless the heuristic is wrong for a specific person. Passing <code>initials</code> everywhere moves the rules into product code, which is how they drift.</li>
      <li><strong>Never more than two.</strong> Three initials at 32px is 8px type. The prop accepts any string, so this is a review rule rather than a runtime one.</li>
      <li><strong><code>statusLabel</code> is prose, not a state name:</strong> "on a call" reads better than "busy", and it is what gets announced.</li>
      <li><strong>Machine names keep their real form</strong> — <code>PRS-4120</code>, <code>svc-scheduler</code> — because an operator matches them against a label on the machine.</li>
    </ul>
  </Sec>

  <Sec n="11" title="Responsive" note="A fixed-size element inside fluid layouts. Five rules.">
    <ul>
      <li><strong>The disc is pixel-sized and does not scale with the viewport,</strong> deliberately: it sits beside 13px type in a table row, and an avatar that grew with the page would break the row rhythm it exists to fit. Density scopes do move it, since the size tokens resolve through them.</li>
      <li><strong><code>flex: 0 0 auto</code> plus <code>min-width</code>,</strong> so a narrow flex row squashes the text beside it rather than the disc. Without <code>min-width</code> a circle becomes an oval — the single most common avatar rendering bug, and it only appears at narrow widths, which is why it belongs in this section rather than in Implementation.</li>
      <li><strong>Drop the name, not the avatar, when space runs out.</strong> A 24px disc plus a truncated name is worse than a disc alone with the name in the row's <code>title</code>. In the console's topbar the avatar is what survives the sidebar collapsing.</li>
      <li><strong><code>AvatarGroup</code> does not reflow — it truncates.</strong> The overlap is a fraction of the disc, so the group's width is predictable at every size, and a narrow container should be given a smaller <code>max</code> rather than being allowed to wrap. Overlapping discs that wrap to a second line look like two groups.</li>
      <li><strong>At <code>xs</code> in a dense table, put the name in its own column.</strong> One initial cannot identify a person on its own; the disc is then a visual anchor rather than the identification.</li>
    </ul>
    <div className="demo col">
      <Row label="in a row"><div style={{display:'flex',alignItems:'center',gap:8,width:220,border:'var(--border-hairline)',borderRadius:'var(--radius-sm)',padding:'6px 8px',background:'var(--background-page)'}}>
        <Avatar name="María del Carmen Rodríguez" size="sm" decorative />
        <span style={{minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontSize:'var(--text-sm)'}}>María del Carmen Rodríguez</span>
      </div><Text size="xs" tone="tertiary">The name truncates; the disc does not deform.</Text></Row>
    </div>
  </Sec>

  <Sec n="12" title="Anti-patterns" note="Nine, and the first two are the ones that get shipped.">
    <div className="two">
      <div className="pane dont"><h3>Colour &amp; meaning</h3><ul>
        <li><strong>Hashing the name to a hue.</strong> §01. There is no prop for it, and adding one reintroduces a red disc beside a name in an alarm list.</li>
        <li><strong>Tinting the disc to mean something</strong> — role, team, seniority. Every ramp is spoken for; a "team colour" is a legend the user does not have.</li>
        <li><strong>A pulsing "online" dot.</strong> Permanent motion in the corner of the eye for a fact that is not urgent (§09).</li>
        <li><strong>A greyed avatar for a deactivated user.</strong> Indistinguishable from the offline dot and from a contrast bug. Say it in words (§06).</li>
      </ul></div>
      <div className="pane dont"><h3>Structure &amp; announcement</h3><ul>
        <li><strong><code>onClick</code> on the avatar.</strong> A mouse-only control — Card's 1.15.0 defect. Wrap it (§07).</li>
        <li><strong>Announcing avatars in a table.</strong> "Maya Osei, image, Maya Osei" on every row. Pass <code>decorative</code> (§08).</li>
        <li><strong>Six hand-laid-out avatars instead of an <code>AvatarGroup</code>.</strong> Six announcements, hand-tuned <code>z-index</code>, and an overlap that breaks at the next size.</li>
        <li><strong>An avatar as a status indicator or a chart legend swatch.</strong> Those are <code>Badge</code> and <code>--viz-1…6</code>. An avatar is a party, not a value.</li>
      </ul></div>
    </div>
    <p className="warn"><strong>One more, specific to this system:</strong> do not use an avatar where the console means a <em>machine state</em>. A disc beside "WLD-2207" showing a red presence dot reads, to an operator scanning an alarm list, as a machine that is down. Machine state is a <code>Badge</code>; the avatar only says which asset the row is about.</p>
  </Sec>

  <Sec n="13" title="Implementation notes" note="Seven decisions in the file, and the tokens.">
    <ul>
      <li><strong>Initials render underneath the image, not instead of it.</strong> One <code>failed</code> flag flipped by <code>onError</code>, and the fallback was already painted — so a 404 has no swap, no flash and no layout step. A conditional that renders one or the other cannot achieve that.</li>
      <li><strong>Type size is a ratio of the disc</strong> (0.55 × for one glyph, 0.42 × for more) under a hard <code>max(…, var(--text-2xs))</code> floor, not five hand-picked font sizes. The initials stay optically centred at 20px and at 64px, and adding a size later cannot drift.</li>
      <li><strong>The threshold rules read a plain-number map, never a parsed token.</strong> Three documented behaviours — one initial below 24px, the <code>status</code> warning, the stepped-down fallback glyph — all depend on knowing the rung in pixels, and they shipped dead for one build because the code did <code>parseInt('var(--avatar-size-xs)')</code>: <code>NaN</code>, defaulted to 32, so every size took the <code>md</code> branch and <code>xs</code> rendered two initials at 8px type. The numbers are <em>nominal</em> rather than measured on purpose — a density scope nudging the rendered size should not silently change which initials a component draws — and a new size must be added to both maps. Fixed 1.21.3.</li>
      <li><strong>The single-glyph script test is a Unicode range check, not a language guess.</strong> Han, Hiragana, Katakana and Hangul return one grapheme; everything else takes first-and-last. It is a heuristic and it is documented as one — <code>initials</code> exists for the cases it gets wrong.</li>
      <li><strong>Both <code>width</code> and <code>min-width</code> are set</strong> (§11). A circle deformed into an oval is the classic avatar bug and it only manifests inside a shrinking flex row.</li>
      <li><strong>Two contrast failures, one shared cause: a token used outside the job it was tuned for.</strong> <code>--avatar-status-offline</code> shipped as <code>--border-strong</code> — a <em>hairline</em> value, tuned to sit quietly against a surface at 1px — used as a solid dot fill, where it measured 1.60:1 against its own white ring. That is the identical token at the identical ratio the Governance backlog tracks as a live 1.4.11 failure on Checkbox and Radio, so this component re-entered a known class rather than finding a new one; the warning now sits on the border family in <code>semantic.css</code> so a fourth instance has to ignore a comment. And <code>--avatar-overflow-foreground</code> was <code>--text-tertiary</code>, which passed only while the token was inert — making it live in 1.21.5 exposed it at 4.11:1. Both retargeted in 1.21.6.</li>
      <li><strong>The initials’ ink travels as a custom property</strong>, <code>--avatar-ink</code>, set on the disc and read by the text span. A plain <code>color</code> on the span always beats anything inherited, which is why <code>--avatar-overflow-foreground</code> was declared, documented and <em>inert</em> for one build: <code>AvatarGroup</code> passed it as <code>color</code> on the disc and the span overrode it every time, so the “+N” chip was indistinguishable from a person’s initials. Third instance of the same species in this component — after <code>parseInt</code> on a token and an unreachable <code>deriveInitials</code> — and the species is: <em>declared, documented, does nothing.</em> Fixed 1.21.5.</li>
      <li><strong>The disc does not clip its children; the photo clips itself.</strong> <code>&lt;img&gt;</code> carries <code>border-radius: inherit</code>, because it is the only child that needs the disc’s shape. An <code>overflow: hidden</code> on the disc — which is what shipped for one build — also clipped the presence dot, which deliberately overhangs the edge: it rendered as a crescent with its ring entirely erased, producing exactly the "part of the portrait" reading the ring exists to prevent. Scope the clip to the thing that needs clipping. Fixed 1.21.4.</li>
      <li><strong><code>onClick</code> is stripped after the spread,</strong> not merely undocumented — spreading <code>...rest</code> onto the span would otherwise attach it and produce the mouse-only control the warning describes.</li>
      <li><strong>The overflow chip is the one element with a <code>z-index</code>.</strong> DOM-first in a reversed row puts it at the right end for <em>layout</em> and bottom-most for <em>paint</em> — the same fact the group relies on to put the first person on top — so its neighbour’s negative margin covered the “+” and the chip visibly read “2”, indistinguishable from a one-letter initial in a row of one-letter initials. <code>box-shadow</code> does not raise a stacking context. The chip is deliberately outside the first-person-on-top ordering, so it is the only member that gets one. Fixed 1.21.7.</li>
      <li><strong>The group overlaps with a negative <code>margin-right</code> in a <code>row-reverse</code> flex row.</strong> Reversed, the main axis runs right-to-left, so <code>margin-right</code> is the leading edge and later DOM siblings paint on top — which puts the first person above the second with no <code>z-index</code> at all. The visually right-most disc gets no pull, so the group ends flush.</li>
      <li><strong>Five warnings on Avatar, two on AvatarGroup,</strong> all about identity or announcement rather than styling: nothing to render; no name on an announcing avatar; <code>onClick</code>; <code>status</code> below 24px; <code>status</code> without a label; more than 12 people with no label; <code>max</code> below 1.</li>
    </ul>
    <div className="tokenlist">
      {['--avatar-background','--avatar-background-machine','--avatar-foreground','--avatar-foreground-machine','--avatar-border','--avatar-radius','--avatar-radius-machine','--avatar-size-xs','--avatar-size-sm','--avatar-size-md','--avatar-size-lg','--avatar-size-xl','--avatar-group-ring','--avatar-group-ring-width','--avatar-group-overlap','--avatar-overflow-foreground','--avatar-status-size','--avatar-status-online','--avatar-status-busy','--avatar-status-away','--avatar-status-offline'].map(t=><span key={t}>{t}</span>)}
    </div>
    <p><strong>Twenty-one tokens, and two are unitless ratios</strong> — <code>--avatar-group-overlap</code> (0.32) and <code>--avatar-status-size</code> (0.3). They are ratios rather than pixel values so that one retarget holds across all five sizes; a pixel overlap tuned for <code>sm</code> is wrong at <code>xl</code>. <code>--avatar-group-ring</code> is the only token in the system whose value is a <em>surface</em> used as a stroke, and the comment in <code>components.css</code> says why: the disc must appear to punch a hole in the one behind it.</p>
  </Sec>

  <Sec n="14" title="Developer notes" note="Integration, testing, open items.">
    <pre>{SAMPLE2}</pre>
    <ul>
      <li><strong>Testing.</strong> Unit-test <code>Avatar.deriveInitials</code> first and directly — it is the part with rules: Maya Osei → MO, María del Carmen Rodríguez → MR, 李小龙 → 李, Prince → P, PRS-4120 → PR, m.osei@x.com → MO. The last two are the ones a refactor breaks. Then that <code>decorative</code> yields <code>aria-hidden</code> and no <code>role="img"</code>; that <code>statusLabel</code> reaches the accessible name; that a broken <code>src</code> still shows initials; and that <code>AvatarGroup</code> exposes exactly ONE <code>role="img"</code> however many people it holds.</li>
      <li><strong>Lint.</strong> Flag <code>onClick</code> on an Avatar; an Avatar inside a <code>Table</code> render function without <code>decorative</code>; <code>status</code> with <code>size="xs"</code>; a <code>background</code> or <code>color</code> override in <code>style</code> (the colour-identity rule, §01, and the only way to break it now that no prop exists); more than three characters in <code>initials</code>; and three or more sibling Avatars that are not in an <code>AvatarGroup</code>.</li>
      <li><strong>Frozen 5 Sep 2026.</strong> API closed: <code>name</code>, <code>initials</code>, <code>src</code>, <code>kind</code>, <code>size</code>, <code>status</code>, <code>statusLabel</code>, <code>decorative</code>, <code>style</code>, plus native span attributes. <code>AvatarGroup</code>: <code>people</code>, <code>max</code>, <code>size</code>, <code>label</code>, <code>style</code>.</li>
      <li><strong>Additive, with one replacement:</strong> the console template's topbar and login screen had a hand-rolled 26px disc with hard-coded "MO", a raw <code>--surface-inverse</code> background and no accessible name. Both now use this component. That hand-rolled disc is why the component exists.</li>
      <li><strong>Closed in 1.21.2 — the overflow chip has a tooltip.</strong> The decision the item was waiting for: <em>a decorative element may not own a focusable trigger.</em> The chip therefore stopped being decorative rather than gaining a <code>tabindex</code> inside an <code>aria-hidden</code> subtree, which would have been the worse bug — screen-reader focus landing on something not in the accessibility tree. It now carries the name “+N more” and a <code>Tooltip</code> description listing the hidden names, and the group’s <code>role="img"</code> covers the shown people only, so nothing is double-counted (§08).</li>
      <li><strong>Closed in 1.21.2 — <code>Menu</code>’s <code>icon</code> now takes a node.</strong> It was always a Menu API question rather than an Avatar one, and the answer was the smallest possible: a string still routes to <code>Icon</code>, anything else renders as given, so every existing call site is untouched and a switch-account menu can put an <code>Avatar size="xs"</code> in the indent column. No new prop — a second <code>avatar</code> field would have made the slot ambiguous.</li>
    </ul>
  </Sec>
