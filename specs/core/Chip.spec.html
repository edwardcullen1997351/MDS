<div className="page">
  <div className="masthead">
    <span className="eyebrow">Core · Component specification</span>
    <h1>Chip</h1>
    <p className="lede">The offered option: one of a closed set <em>the design</em> authored, all of them visible at once, chosen by the user. Chip completes the label family by being the only member that is an <strong>input</strong> — <code>Badge</code> states a condition the system determined, <code>Tag</code> carries a value the data supplied, and a chip is picked. It exists as a component because a row of options is not a row of buttons: it holds a value, it needs a question above it, and the platform already has the right semantics for both.</p>
    <div className="meta">
      <span>components/core/Chip.jsx</span><span>window.MeridianDesignSystem_962c43.Chip · ChipGroup</span><span style={{color:'var(--text-primary)'}}>status: frozen 4 Sep 2026 · 0 open items</span><span>since: 1.9.0</span><span>21 tokens · 0 new layers</span><span>shell: core/Fieldset</span>
    </div>
  </div>

  <Sec n="01" title="Purpose" note="Ask a closed question where every answer fits on screen.">
    <p>A chip set answers "which of these?" without hiding the choices. It is the right control when the options are few, short, and worth reading side by side — and the wrong one the moment they stop fitting. This is also the component that closes the system's longest-standing gap: a horizontal one-of-N in a toolbar, which had been faked with selected <code>Tag</code>s.</p>
    <T cols={['You want to…','Component','Why']} rows={[
      ['Offer 2–7 short options, all visible','Chip','This component.'],
      ['Show a value from the data or the user','Tag','Open-ended set, mono, removable. A chip is never removable — the option stays offered after you deselect it.'],
      ['Show a condition the system determined','Badge','Read, not chosen. Colour there means severity; here it only means selected.'],
      ['Ask a compared question in a form','RadioGroup','2–3 alternatives read down one edge, with descriptions. Chips are a row, so long labels and second lines do not work.'],
      ['Offer 8+ options, or long ones','Select · Combobox','Past about seven the row wraps into a block nobody scans (§11).'],
      ['Switch which view is on screen','Tabs','A tab changes the page immediately; a chip sets a value the page reads.'],
      ['Run an action','Button · ButtonGroup','A chip holds state. ButtonGroup deliberately holds none.'],
    ]}/>
    <div className="demo col">
      <ChipGroup label="Shift" value={shift} onChange={setShift} options={SHIFTS} />
      <ChipGroup label="Areas" multiple value={areas} onChange={setAreas} options={AREAS} hint="Counts are the open work orders in each area." />
      <Text size="xs" tone="tertiary">Compare: <Badge tone="critical" dot>Down</Badge> a condition · <Tag label="site:tilburg" onRemove={()=>{}} /> a value.</Text>
    </div>
  </Sec>

  <Sec n="02" title="Anatomy" note="Five parts. The gutter is the one nobody expects.">
    <div className="demo">
      <div style={{display:'flex',flexDirection:'column',gap:10,minWidth:300,flex:1}}>
        {[['1','Container — full control height (--control-h-sm/md), --radius-sm, --chip-border on --chip-background. Control-shaped and control-sized, because it is an input.'],
          ['2','Check gutter — 11px, ALWAYS present, opacity 0 until selected. Reserved so selecting a chip cannot widen it and re-flow the row under the cursor that just clicked it.'],
          ['3','Label — 2–4 words from the system\u2019s own list, sans, --weight-regular; --weight-medium when selected, so selection survives a monochrome print.'],
          ['4','Icon (optional) — a leading glyph for the option\u2019s kind, --chip-icon.'],
          ['5','Count (optional) — a trailing mono tabular number in --chip-count-foreground. Legal here because a chip filters data; illegal inside a Tag\u2019s label.'],
          ['6','Hidden input — a real radio or checkbox, visually hidden inside the <label>. It is the whole keyboard and announcement model.']].map(([n,t])=>(
          <div className="callout" key={n}><span className="cnum">{n}</span><Text size="xs">{t}</Text></div>
        ))}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:12,alignItems:'flex-start'}}>
        <ChipGroup aria-label="Time range" value={range} onChange={setRange} options={[{value:'24h',label:'24 hours'},{value:'7d',label:'7 days',icon:'calendar'},{value:'30d',label:'30 days',count:412}]} />
        <Text size="xs" tone="tertiary">The row does not move as you switch.</Text>
      </div>
    </div>
    <p>The group is the component: a <code>&lt;fieldset&gt;</code> with a <code>&lt;legend&gt;</code>, one generated <code>name</code>, the value, and the optional hint or error underneath. A chip on its own has no question above it and no set to be one of, which is why rendering one outside a group warns.</p>
  </Sec>

  <Sec n="03" title="Properties" note="Chip takes almost nothing. ChipGroup takes everything.">
    <T cols={['ChipGroup','Type','Default','Notes']} rows={[
      ['label','ReactNode','—','The question the chips answer. Required — a set with no legend announces as loose controls.'],
      ['options','ChipOption[]','—','{ value, label, icon?, count?, disabled? }. Or pass Chip children.'],
      ['value','string | string[]','—','A string; an array when multiple. Controlled.'],
      ['onChange','(next, e) => void','—','Emits the NEXT value — a string, or the next array — not an event.'],
      ['multiple','boolean','false','Checkboxes instead of radios. Changes the keyboard model (§07).'],
      ['required','boolean','false','Marks the legend and sets aria-required on the group.'],
      ['hint · error','ReactNode','—','One message for the whole set, wired by aria-describedby. error adds role="alert" and aria-invalid.'],
      ['disabled','boolean','false','Through the fieldset, so every chip is genuinely disabled, not just greyed.'],
      ['size','\u2018sm\u2019 | \u2018md\u2019','md','§05.'],
      ['name','string','generated','Generated per group. Never share one between two sets — see §13.'],
      ['gap','number | string','8','Wrapped flex row.'],
    ]}/>
    <T cols={['Chip','Type','Default','Notes']} rows={[
      ['label · children','ReactNode','—','The option text.'],
      ['value','string','—','What onChange reports.'],
      ['icon · count','string · number','—','Leading glyph, trailing number.'],
      ['disabled','boolean','false','This option only — unavailable, still shown, because removing it silently changes the question.'],
      ['selected','boolean','group','Escape hatch for a chip driven outside the group\u2019s value.'],
      ['size','\u2018sm\u2019 | \u2018md\u2019','group','Inherited. Do not mix sizes in one row.'],
    ]}/>
    <p className="warn">There is no <code>onRemove</code>, no <code>tone</code>, and no <code>variant</code>. A chip cannot be dismissed — deselecting it leaves the option offered, which is the entire difference from a <code>Tag</code> — and its only colour is selection.</p>
  </Sec>

  <Sec n="04" title="Variants" note="Two, and they are a semantic difference, not a visual one.">
    <p>Chip has one appearance. The variant is what the group is: single-select renders same-name <strong>radios</strong>, <code>multiple</code> renders <strong>checkboxes</strong>. Nothing about the chips looks different, because the difference is announced and felt through the keyboard rather than drawn — and inventing a shape difference (pills for one, squares for the other) would be a convention the user has to learn instead of hear.</p>
    <T cols={['Variant','Element','Selection','Keyboard']} rows={[
      ['Single (default)','radios, one name','Exactly one. Choosing another replaces it; a chosen chip cannot be un-chosen by clicking it again.','One tab stop, arrows move and select, wrapping.'],
      ['Multiple','checkboxes','Any number, including none.','A tab stop per chip; Space toggles.'],
    ]}/>
    <div className="demo col">
      <Row label="single"><ChipGroup aria-label="Shift" value={shift} onChange={setShift} options={SHIFTS} /></Row>
      <Row label="multiple"><ChipGroup aria-label="Areas" multiple value={areas} onChange={setAreas} options={AREAS.slice(0,3)} /></Row>
    </div>
    <p>If a single-select group genuinely needs "none", add it as an option — "All shifts", "Any" — rather than making a chosen chip clickable-off. A radio set cannot be cleared, and faking it means the keyboard and the pointer disagree about what a second press does.</p>
  </Sec>

  <Sec n="05" title="Sizes" note="Two, and both are control heights.">
    <T cols={['Size','Height (comfortable)','Compact','Expanded','Label','Use']} rows={[
      ['sm','28px','24px','34px','--text-xs','Inside toolbars and table headers, beside sm controls.'],
      ['md','34px','28px','44px','--text-sm','Default. Filter panels, forms, page-level questions.'],
    ]}/>
    <div className="demo col">
      <Row label="sm"><ChipGroup aria-label="Shift" size="sm" value={shift} onChange={setShift} options={SHIFTS} /></Row>
      <Row label="md"><ChipGroup aria-label="Shift" value={shift} onChange={setShift} options={SHIFTS} /></Row>
    </div>
    <p>Chip heights are <code>--control-h-sm</code> and <code>--control-h-md</code> directly, not private numbers, so a chip row lines up with the <code>Input</code>, <code>Select</code> and <code>Button</code> beside it at every density and grows to 44px at <code>expanded</code>. That is the whole reason a chip is taller than a <code>Tag</code>: a tag is a value sitting in content, a chip is a control sitting in a control row. Compact stays pointer-only, as everywhere else in the system.</p>
  </Sec>

  <Sec n="06" title="States" note="Six, and the selected pair is where the work is.">
    <T cols={['State','Treatment']} rows={[
      ['Rest','--chip-background on --chip-border. The resting border is --border-control (4.74:1), not a hairline: an unselected chip has nothing else identifying it as a control, so the border is load-bearing under 1.4.11.'],
      ['Hover','--chip-background-hover, --chip-border-hover. Real, because pressing does something.'],
      ['Selected','--chip-background-selected, --chip-border-selected (--action-solid), --chip-foreground-selected, the check at full opacity, and --weight-medium. Four cues, so selection never rests on colour alone.'],
      ['Selected + hover','--chip-background-selected-hover — one step up the action ramp, so hovering a chosen chip does not read as un-choosing it.'],
      ['Focus','--chip-focus-ring as a box-shadow on the chip, gated on :focus-visible so a pointer click leaves no ring. The hidden input keeps real focus.'],
      ['Disabled','--chip-background-disabled, --chip-foreground-disabled, --chip-border-disabled, via the fieldset or the option. Still legible and still readable — an option you cannot pick must still be readable, or the question changed.'],
      ['Invalid (group)','error message with role="alert" and aria-invalid on the fieldset. The chips do not turn red: nothing is wrong with any individual option.'],
    ]}/>
    <div className="demo col">
      <Row label="rest / hover / selected"><ChipGroup aria-label="Shift" value={shift} onChange={setShift} options={SHIFTS} /></Row>
      <Row label="disabled option"><ChipGroup aria-label="Areas" multiple value={areas} onChange={setAreas} options={AREAS} /></Row>
      <Row label="whole group"><ChipGroup aria-label="Shift" disabled value="days" options={SHIFTS} /></Row>
      <Row label="invalid"><ChipGroup label="Shift" required value={err} onChange={setErr} options={SHIFTS} error="Pick the shift this order runs on." /></Row>
    </div>
  </Sec>

  <Sec n="07" title="Keyboard" note="All of it is the platform's. None of it is ours.">
    <T cols={['Key','Where','Does']} rows={[
      ['Tab','into a single-select group','Lands on the selected chip, or the first if none is. ONE stop for the whole set — seven chips must not be seven stops before the next control.'],
      ['\u2190 \u2191 \u2192 \u2193','within a single-select group','Moves focus AND selection to the next chip, wrapping, skipping disabled ones. Native radio behaviour.'],
      ['Tab','into a multiple group','A stop per chip — correct here, because each checkbox is an independent yes/no.'],
      ['Space','a chip','Toggles it (multiple) or selects it (single).'],
      ['Enter','a chip inside a form','Submits the form, as any input does. It does not toggle.'],
      ['Tab','out of the group','Moves to the hint/error text\u2019s owner, then the next control. The message is announced through aria-describedby, not as a stop.'],
    ]}/>
    <p>None of the above is implemented in <code>Chip.jsx</code>. There is no roving <code>tabIndex</code>, no key handler, and no <code>aria-checked</code> bookkeeping, because same-name radios already give one tab stop with wrapping arrow selection and checkboxes already give per-control stops. Every hand-rolled segmented control in the wild gets one of those details wrong — usually wrapping, or disabled-skipping — and it is the reason this component is built on inputs rather than buttons.</p>
    <div className="demo col">
      <Text size="xs" tone="tertiary">Tab into the first row: one stop, then <kbd>\u2190</kbd> <kbd>\u2192</kbd>. Tab into the second: one stop per chip, <kbd>Space</kbd> toggles.</Text>
      <ChipGroup aria-label="Shift" value={shift} onChange={setShift} options={SHIFTS} />
      <ChipGroup aria-label="Areas" multiple value={areas} onChange={setAreas} options={AREAS.slice(0,3)} />
    </div>
  </Sec>

  <Sec n="08" title="Accessibility" note="A real fieldset over real inputs, and a name for the question.">
    <ul>
      <li><strong>The set is a <code>&lt;fieldset&gt;</code> with a <code>&lt;legend&gt;</code>.</strong> It is the one grouping every screen reader announces without ARIA, and it means "Nights, radio button, 3 of 3 — Shift" instead of three unattached controls.</li>
      <li><strong><code>label</code> is required and warns when missing.</strong> A chip row with no question is the most common accessibility defect in this pattern: the labels alone ("Days", "Swing") do not say what is being asked.</li>
      <li><strong>Selection is the input's own state,</strong> not <code>aria-pressed</code> or a class. <code>:checked</code> is what is announced, so the visual and the announcement cannot drift.</li>
      <li><strong>Selection carries four non-colour cues</strong> — the check glyph, the medium weight, the darker border, the tint — so it survives greyscale, forced colours and colour blindness. Colour alone would fail 1.4.1.</li>
      <li><strong>The focus ring is on the chip, gated on <code>:focus-visible</code>.</strong> The input is visually hidden but never <code>display: none</code>, so it keeps real focus and real keyboard behaviour.</li>
      <li><strong>Hit area equals the chip.</strong> The <code>&lt;label&gt;</code> IS the control surface at full control height, so it clears 2.5.8 at every density and 44px at <code>expanded</code>.</li>
      <li><strong>One message per group,</strong> wired with <code>aria-describedby</code>; errors get <code>role="alert"</code> and the fieldset gets <code>aria-invalid</code>. Per-chip errors are not a thing — the set is what is unanswered.</li>
      <li><strong>A disabled option stays announced,</strong> not removed. Dropping it silently changes the question between two users.</li>
      <li><strong>Counts are part of the label,</strong> read as "Assembly 42". If that reads badly for a given set, drop the count rather than hiding it from the accessible name.</li>
    </ul>
  </Sec>

  <Sec n="09" title="Motion" note="Colour, and one opacity fade that cannot move anything.">
    <T cols={['Moment','Motion','Tokens']} rows={[
      ['Hover · selected · focus','--transition-control: background, border, colour, box-shadow.','--duration-fast · --ease-out'],
      ['The check','Opacity only, on a gutter that is already there. It never animates width, because that would re-flow the row mid-click.','--duration-fast'],
      ['Selection moving between chips','None. No sliding indicator.','—'],
      ['Appear · remove','None. The set arrives with its question.','—'],
      ['Reduced motion','--duration-* collapse to 1ms; nothing was moving anyway.','prefers-reduced-motion'],
    ]}/>
    <p>The tempting animation here is a sliding pill that travels between chips, the way a segmented control does. It is deliberately absent: the chips wrap onto multiple lines, so the indicator would have to fly diagonally across a row break — and with <code>multiple</code> there can be three selections at once, which no single travelling indicator can express. One component, one behaviour at every width.</p>
  </Sec>

  <Sec n="10" title="Content Rules" note="Short, parallel, and enumerable.">
    <div className="two">
      <div className="pane do"><h3>Do</h3><ul>
        <li><strong>One or two words</strong> per chip: "Nights", "7 days", "Paint".</li>
        <li><strong>Parallel phrasing</strong> across the set — all nouns or all durations, never mixed.</li>
        <li><strong>Sentence case,</strong> and the user\u2019s own vocabulary for the domain.</li>
        <li><strong>A question as the legend:</strong> "Shift", "Areas", "Time range".</li>
        <li><strong>Counts as <code>count</code>,</strong> never inside the label text.</li>
        <li><strong>An explicit "All" option</strong> when "none" is a legitimate answer to a single-select question.</li>
      </ul></div>
      <div className="pane dont"><h3>Don't</h3><ul>
        <li><strong>Sentences or descriptions.</strong> If an option needs a second line, the control is <code>RadioGroup</code>.</li>
        <li><strong>Verbs.</strong> "Export" is a button; "Exported" is a filter value.</li>
        <li><strong>Data values.</strong> "PN-7749", "tilburg" \u2014 <code>Tag</code>.</li>
        <li><strong>Status words in status colours.</strong> A chip that says "Down" in red is a <code>Badge</code> wearing a control.</li>
        <li><strong>Redundant labels.</strong> Under the legend "Shift", the chips say "Nights", not "Night shift".</li>
        <li><strong>An open-ended set.</strong> If you cannot write the full list, it is not a chip set.</li>
      </ul></div>
    </div>
  </Sec>

  <Sec n="11" title="Responsive" note="It wraps, and past seven it stops being the right control.">
    <ul>
      <li><strong>Chips wrap; the row never scrolls horizontally.</strong> A scrolling chip rail hides options off the right edge, and an option the user cannot see is an option they do not have. This is the same rule as <code>TagList</code>, for a stronger reason: a tag row shows what was applied, a chip row shows what is <em>available</em>.</li>
      <li><strong>Seven is the ceiling.</strong> Past that the set wraps into a block nobody scans and the control you want is <code>Select</code> (known list) or <code>Combobox</code> (searchable). There is no <code>limit</code> or overflow count, because hiding an offered option behind "+4 more" is exactly the failure this control exists to avoid.</li>
      <li><strong>Never truncate a chip.</strong> "Assem…" is not an option anyone can choose confidently. Shorten the word or change the control.</li>
      <li><strong>Heights ride density,</strong> so a chip row matches the controls beside it at 24 / 28 / 34px (<code>sm</code>) and 28 / 34 / 44px (<code>md</code>).</li>
      <li><strong>Touch: <code>md</code>, and <code>expanded</code> where hands are gloved.</strong> <code>sm</code> at <code>compact</code> is 24px and pointer-only — the same rule the whole system carries, and unlike <code>Tag</code> a chip gets no special coarse-pointer bump because it is already a full-height control.</li>
      <li><strong>Under ~320px,</strong> a three-chip row is fine and a six-chip row is a stack of five lines. Move to <code>Select</code> at that width rather than shrinking the chips.</li>
    </ul>
    <div className="demo col">
      <div style={{maxWidth:300,border:'var(--border-hairline)',borderRadius:'var(--radius-sm)',padding:12}}>
        <ChipGroup label="Areas" multiple value={areas} onChange={setAreas} options={AREAS} />
      </div>
      <Text size="xs" tone="tertiary">300px: the row wraps, every option stays visible and full-size.</Text>
    </div>
  </Sec>

  <Sec n="12" title="Anti Patterns" note="Three components look like this. Only one is chosen.">
    <div className="two">
      <div className="pane dont"><h3>Chip ≠ Tag ≠ Badge</h3><ul>
        <li><strong>A removable chip.</strong> The × means the user put it there and can take it away — that is a <code>Tag</code>. Deselecting a chip leaves the option on screen.</li>
        <li><strong>A chip carrying data.</strong> A part number in a chip implies the system offered it as a choice.</li>
        <li><strong>A coloured chip.</strong> No tones. Selection is the only colour, or the row stops reading as a set of equals.</li>
        <li><strong>A chip that reports status.</strong> Read-only information in a control shape invites a press that does nothing.</li>
      </ul></div>
      <div className="pane dont"><h3>Also don't</h3><ul>
        <li><strong>Chips as tabs.</strong> If pressing it swaps the page, it is <code>Tabs</code> — and tabs carry <code>aria-controls</code> a chip does not.</li>
        <li><strong>Chips as buttons.</strong> A chip row that runs actions is a <code>ButtonGroup</code>.</li>
        <li><strong>A lone chip.</strong> One chip is a toggle <code>Button</code>; it warns.</li>
        <li><strong>Twelve chips.</strong> §11. This is the most common misuse.</li>
        <li><strong>A dropdown attached to a chip.</strong> A chip with a caret is a <code>Select</code> or a <code>Popover</code> trigger, and it needs <code>aria-expanded</code> that a checkbox cannot carry.</li>
        <li><strong>Mixed sizes in one row,</strong> which reads as mixed importance among equals.</li>
        <li><strong>A sliding indicator.</strong> §09.</li>
      </ul></div>
    </div>
    <p className="warn">The recurring request is a chip that is both a filter and a filter-<em>value</em> display: press to apply, then show an × to clear. That is two components in one target, and the press has two meanings depending on where in the chip the pointer landed. Build it as a chip row for choosing and a <code>TagList</code> for what is applied — which is also the only version that survives a saved view loading five filters at once.</p>
  </Sec>

  <Sec n="13" title="Implementation Notes" note="New in 1.9.0.">
    <ul>
      <li><strong>Native inputs, visually hidden.</strong> Each chip is a <code>&lt;label&gt;</code> wrapping an opacity-0, zero-size <code>&lt;input&gt;</code> — never <code>display: none</code>, which removes it from the tab order and from the form. The label is the whole control surface, so the hit area is the chip.</li>
      <li><strong>The group generates its <code>name</code></strong> with <code>useId()</code>. A shared name across two rendered groups makes them one radio set: choosing in row four clears row one, silently and only sometimes. Same defect class as RadioGroup 1.2.0.</li>
      <li><strong><code>required</code> is set on no more than one radio.</strong> HTML only needs it on one of a set, and some browsers report the group unsatisfied when every input carries it even after a sibling is checked — so the group publishes <code>aria-required</code> and marks the legend instead.</li>
      <li><strong>The check gutter is always rendered</strong> at <code>--chip-check-size</code> with <code>opacity</code> switching. Revealing the glyph on selection widened the chip by 17px in the first draft and re-flowed every chip to its right, under the pointer that had just clicked.</li>
      <li><strong>Heights are <code>--control-h-*</code> directly,</strong> not private numbers, which is what makes a chip row align with the inputs and buttons beside it — and it is why Chip needs no density block of its own.</li>
      <li><strong><code>--chip-border</code> is <code>--border-control</code>,</strong> not a structural hairline: an unselected chip is its border. Same 1.4.11 reasoning as <code>--input-border</code> in 1.2.0.</li>
      <li><strong>Selection weight changes.</strong> <code>--weight-medium</code> when selected is deliberate redundancy: with the tint lost to forced colours and the check to a missing glyph, weight is the cue that survives.</li>
      <li><strong>Multi-select emits in option order,</strong> not click order — <code>options</code> is filtered by the selection set — so a saved value round-trips identically no matter how the user built it.</li>
      <li><strong>The name check accepts ARIA.</strong> The warning fires only when there is no <code>label</code>, <code>aria-label</code> <em>and</em> <code>aria-labelledby</code> — this document's own demos caption their groups from the surrounding row, so they carry <code>aria-label</code> instead of a legend, and a spec page that trips its own accessibility warning is the defect the warning is about.</li>
      <li><strong>Four warnings:</strong> a group with no accessible name, fewer than two options, an array <code>value</code> without <code>multiple</code>, and a chip rendered outside a group.</li>
      <li><strong>The <code>&lt;fieldset&gt;</code> shell is <code>core/Fieldset</code></strong> (1.9.1), shared with <code>RadioGroup</code> and <code>CheckboxGroup</code>. It owns the legend, the required mark, the one message row, and the <code>aria-describedby</code>/<code>aria-invalid</code>/<code>aria-required</code> wiring; <code>ChipGroup</code> contributes the name, the value model and the chips. It lives in <code>core/</code> rather than <code>forms/</code> so both layers can reach it without a forms→core inversion.</li>
      <li><strong>21 tokens, no reference to <code>--tag-*</code> or <code>--badge-*</code>.</strong> The three components share a family resemblance and must never share a variable; the radius agreement between Chip and Tag is a coincidence of the scale, not a link.</li>
    </ul>
    <div className="tokenlist">
      {['--chip-radius','--chip-height-sm','--chip-height-md','--chip-padding-sm','--chip-padding-md','--chip-check-size','--chip-background','--chip-background-hover','--chip-background-selected','--chip-background-selected-hover','--chip-background-disabled','--chip-foreground','--chip-foreground-selected','--chip-foreground-disabled','--chip-icon','--chip-count-foreground','--chip-border','--chip-border-hover','--chip-border-selected','--chip-border-disabled','--chip-focus-ring'].map(t=><span key={t}>{t}</span>)}
    </div>
    <p className="warn"><strong>Resolved in 1.9.1 — one group scaffold, three consumers.</strong> The open item was that <code>ChipGroup</code> rendered its own legend, hint and error rather than sharing <code>Field</code>'s. It could not consume <code>FieldContext</code> — a <code>Field</code>'s <code>&lt;label for&gt;</code> names exactly one control and cannot name a set, which is why grouped controls label themselves at all — so the fix was the other direction: the scaffold is now <code>core/Fieldset</code>, and <code>ChipGroup</code>, <code>RadioGroup</code> and <code>CheckboxGroup</code> all render through it. The duplication was already drifting when it was found: this component's legend shipped at <code>--text-sm</code> on <code>--text-primary</code> while the other two were <code>--text-xs</code> on <code>--field-label-text</code>, so a form holding a chip group and a checkbox group had two different label styles. <code>Fieldset</code> also now publishes <code>aria-required</code> and <code>aria-invalid</code> on the group, which only Chip had been doing. Public APIs are unchanged in all three.</p>
  </Sec>

  <Sec n="14" title="Developer Notes" note="Wiring it into a product.">
    <pre>{`import { ChipGroup } from '@meridian/core';

// Single-select: onChange gives you the next VALUE, not an event.
const [shift, setShift] = React.useState('nights');
<ChipGroup label="Shift" value={shift} onChange={setShift}
  options={[
    { value: 'days',   label: 'Days' },
    { value: 'swing',  label: 'Swing' },
    { value: 'nights', label: 'Nights' },
  ]} />

// Multi-select: the next ARRAY, in option order.
const [areas, setAreas] = React.useState([]);
<ChipGroup label="Areas" multiple value={areas} onChange={setAreas}
  options={areas_from_api.map(a => ({
    value: a.id, label: a.name, count: a.openOrders,
    disabled: !a.permitted,          // shown, not removed
  }))} />

// "None" is an option, never a second click on a chosen chip.
<ChipGroup label="Time range" value={range} onChange={setRange}
  options={[{ value: 'all', label: 'All time' }, ...RANGES]} />

// Validation lives with the form, and the message names the question.
<ChipGroup label="Shift" required value={shift} onChange={setShift}
  options={SHIFTS}
  error={submitted && !shift ? 'Pick the shift this order runs on.' : undefined} />`}</pre>
    <ul>
      <li><strong>Both variants are controlled.</strong> Chip holds no selection state — it lives with the filter or form model, which is the only thing that can also drive the table.</li>
      <li><strong>Do not reuse one <code>name</code></strong> across groups, and do not pass one at all unless a real <code>&lt;form&gt;</code> POST needs the key.</li>
      <li><strong>Disable, do not remove.</strong> A permission-gated option that disappears makes the question different for two users looking at the same screen together.</li>
      <li><strong>Count from the data, not the selection.</strong> A count that changes as you select reads as feedback on your own click.</li>
      <li><strong>Do not put a chip group in a table cell.</strong> Per-row questions belong in <code>Select</code>; a wrapping chip row makes rows different heights.</li>
      <li><strong>Testing hooks:</strong> chips are real inputs — <code>getByRole('radio', {'{ name: \'Nights\' }'})</code> and <code>getByRole('checkbox', …)</code>, the group is <code>getByRole('group', {'{ name: \'Shift\' }'})</code>. Assert the input's <code>checked</code>, never the tint.</li>
    </ul>
  </Sec>
</div>
);}
