const OPS = {
  OP10:{seq:'10',name:'Blank',wc:'PR-02 press'}, OP20:{seq:'20',name:'Pierce',wc:'PR-03 press'},
  OP30:{seq:'30',name:'Deburr',wc:'DB-01 bench'}, OP40:{seq:'40',name:'Wash',wc:'WS-01'},
  OP50:{seq:'50',name:'CNC bore',wc:'CNC-04'}, OP80:{seq:'80',name:'Despatch pack',wc:'PK-01'}
};
const nameOf = id => 'op ' + OPS[id].seq + ' ' + OPS[id].name;
const START = ['OP10','OP20','OP30','OP40','OP50','OP80'];

/* One consumer, used by three demos: it owns the commit, which is the whole
   point of the boundary. */
function Routing({ latency = 500, fails = false, moveControls, disabled, disabledReason, size = 'sm' }){
  const [order,setOrder] = React.useState(START);
  const [pending,setPending] = React.useState(null);
  const [log,setLog] = React.useState('nothing moved yet');
  const commit = (id,from,to) => {
    setPending(id);
    setTimeout(() => {
      setPending(null);
      if (fails) { setLog('MES refused the sequence \u2014 ' + nameOf(id) + ' is back at position ' + (from+1) + '.'); return; }
      setOrder(o => { const a = o.filter(x=>x!==id); a.splice(to,0,id); return a; });
      setLog(nameOf(id) + ' is now ' + (to+1) + ' of ' + order.length + '.');
    }, latency);
  };
  return (
    <div className="demo col">
      <SortableCollection
        label="Routing sequence" items={order} itemName={nameOf} size={size}
        moveControls={moveControls} disabled={disabled} disabledReason={disabledReason}
        canMove={(id)=> id==='OP10' ? 'Pinned first \u2014 the raw blank starts here.' : id==='OP80' ? 'Pinned last \u2014 nothing runs after despatch pack.' : true}
        canDrop={(id,to,next)=>
          next[0]!=='OP10' ? 'Op 10 Blank stays at position 1.' :
          next[next.length-1]!=='OP80' ? 'Op 80 Despatch pack is pinned last.' :
          next.indexOf('OP50') < next.indexOf('OP20') ? 'Op 50 CNC bore is pinned to fixture FX-2210, which requires op 20 Pierce complete.' : true}
        onMove={commit} onAnnounce={setLog}
      >
        {order.map((id) => (
          <div className="rw" key={id}>
            <span className="mt" style={{width:'18px',flex:'none'}}>{OPS[id].seq}</span>
            <span className="nm">Op {OPS[id].seq} {OPS[id].name}</span>
            <span className="mt">{OPS[id].wc}</span>

          </div>
        ))}
      </SortableCollection>
      <span className="log">{log}</span>
    </div>
  );
}

<div className="page">
  <div className="masthead">
    <span className="eyebrow">Composite · Component specification</span>
    <h1>SortableCollection</h1>
    <p className="lede">The mechanics of moving an item to a new position — the grab, the modal keyboard grab, the insertion indicator, per-position legality, bounded auto-scroll and the announcements — with the commit, the optimism and the rollback deliberately left outside.</p>
    <div className="meta">
      <span>Status · unfrozen, API open</span>
      <span>Core · IconButton</span>
      <span>Promoted from · <a href="../patterns/DirectManipulationOfOrder.spec.html">direct manipulation of order</a></span>
      <span>Follows · <a href="../../guidelines/composite-spec-standard.card.html">Composite spec standard</a> §01–§14</span>
      <span>Sections · 11 of 14</span>
    </div>
  </div>

  <Sec n="§01" title="Purpose" note="Why the composition exists, and where it stops">
    <p>Moving an item to a new position is a compound gesture spanning several components, and no component in this system owned it. The <a href="../patterns/DirectManipulationOfOrder.spec.html">direct manipulation of order</a> pattern specified the whole contract and shipped one reference implementation of it; this composite is the half of that contract that could not be rebuilt safely by hand.</p>
    <ul>
      <li><strong>The ownership test.</strong> A grab is aggregate state no row can hold alone: which item is in hand, the index it came from, the index it would land at, and whether that position is legal. The insertion indicator, the position text and every announcement are derived from it. <code>List</code> knows only that it has rows; <code>IconButton</code> knows only that it was pressed.</li>
      <li><strong>The consequence test.</strong> Rebuilt slightly differently, the failure is not cosmetic: the keyboard path gets bolted on as a separate "move up" that skips the legality check, or is left out, and the sequence a plant works to becomes editable only with a working mouse. Both paths here run one <code>canDrop</code> through one state machine.</li>
      <li><strong>What it deliberately does not do.</strong> It never reorders <code>items</code>. A legal drop calls <code>onMove(id, fromIndex, toIndex)</code> and the consumer commits; the optimistic view, the unconfirmed marking, the rollback and the failure message stay with whoever owns the data. A component that mutated its own order prop would be exactly the optimistic mutation the pattern refuses (pattern §04, §10).</li>
      <li><strong>Transfer between two collections stays a pattern,</strong> because its commit spans two collections and this component owns no commit at all.</li>
    </ul>
    <Routing />
    <Text size="xs" tone="tertiary">Grab a handle, or focus one and press <kbd>Space</kbd>. Try op 50 CNC bore above op 20 Pierce for a position refused by rule, and op 10 or op 80 for a pinned item whose handle is disabled with its reason. The 500 ms write is the consumer's, not the component's.</Text>
  </Sec>

  <Sec n="§02" title="Anatomy" note="What the component draws, and what the consumer supplies">
    <T cols={['Part','Owner','Requirement']} rows={[
      ['List root','composite',<span>A <code>ul</code> by default, <code>ol</code> where the number is the information, <code>div</code> where the semantics belong to a wrapper. Carries <code>label</code> as its accessible name and the instructions as its description.</span>],
      ['Row wrapper','composite',<span>One per identity in <code>items</code>, in that order. Holds the drag target, the in-hand treatment and the row's minimum height.</span>],
      ['Grab handle','composite',<span>An <code>IconButton</code> — focusable, named after the item and its position, <code>aria-pressed</code> while in hand, and disabled with its reason where <code>canMove</code> refuses. It <em>arms</em> the drag rather than being the drag source: Safari and Firefox will not initiate a drag from a <code>button</code> at all, so the row is what drags and a pointer press on the handle is what permits it. This is the part that makes the move reachable, and the reason the composite draws it rather than handing out props.</span>],
      ['Move steppers','composite',<span>Earlier / Later <code>IconButton</code>s under <code>moveControls="handle-and-steppers"</code> (the default), each disabled when its adjacent position is refused. The route to a destination off screen.</span>],
      ['Insertion indicator','composite',<span>A 2px rule at the proposed position, shown only while an item is in hand and only where the position is legal. <code>aria-hidden</code> — the announcement carries the same information in words.</span>],
      ['Position text','composite',<span>"Position 3 of 8", visually hidden on every row, so a change of order is perceivable to a user reading one row at a time.</span>],
      ['Live region','composite',<span>A polite region carrying grab, proposal, refusal and result. Suppressed with <code>liveRegion={false}</code> only when <code>onAnnounce</code> feeds a region the consumer owns.</span>],
      ['Row content','consumer',<span>One node per item, as <code>children</code> in <code>items</code> order, or through <code>renderItem</code>. Everything about the item itself — its name, its figures, its own badges and its in-flight marking.</span>],
    ]}/>
    <p className="warn"><strong>The handle is composite-owned on purpose.</strong> Handing the consumer a bag of <code>handleProps</code> to spread on anything would leave the touch-target minimum, the accessible name and the disabled-with-reason state to be rebuilt per consumer — which is the failure the promotion exists to end.</p>
  </Sec>

  <Sec n="§03" title="Properties" note="The public API beyond its children's">
    <T cols={['Property','Type','Contract']} rows={[
      ['items','string[]',<span>The committed order, as stable identities. Never indices and never item objects. The component reads it and never writes it; duplicates warn, because a duplicate makes a grab ambiguous.</span>],
      ['label','string',<span>Required. What the collection is, used as its accessible name and in every announcement. A position announced with no subject is unusable with two sortable collections on one screen.</span>],
      ['itemName','(id) =&gt; string',<span>Required. How an item is named, by what it is. The index is the thing being changed and cannot also be the name.</span>],
      ['onMove','(id, from, to) =&gt; void',<span>A legal drop happened. Fired once, after the component has left grabbed state and announced the move as starting. Nothing is optimistic and nothing is retried here.</span>],
      ['canDrop','(id, to, nextOrder) =&gt; true | string',<span>Declared legality, evaluated locally for every candidate position while the item is in hand — and again immediately before <code>onMove</code>. A string is <em>the reason</em>, announced and suppressing the insertion point; <code>false</code> warns and renders a generic refusal. <code>nextOrder</code> is the order that would result, so rules read over the whole sequence.</span>],
      ['canMove','(id) =&gt; true | string',<span>Whether an item can move at all. The reason disables its handle and becomes the handle's accessible name — never a handle that grabs and refuses everywhere.</span>],
      ['moveControls','handle-and-steppers | handle | none',<span>Default <code>handle-and-steppers</code>. <code>none</code> warns: it leaves the drag as the only route, and a drag is not an input a gloved hand on a tablet has.</span>],
      ['announcementScope','position-and-neighbours | position-only',<span>Default names what the item now follows and precedes; <code>position-only</code> for long collections where that becomes noise.</span>],
      ['onAnnounce / liveRegion','(text) =&gt; void / boolean',<span>Every announcement, also handed out — for a visible status line. Set <code>liveRegion={false}</code> when the consumer renders its own, never both.</span>],
      ['onGrabChange','(grab | null) =&gt; void',<span>The grab as it changes, for a status line or an inspector. Read-only: it is not a way to drive the grab from outside.</span>],
      ['disabled / disabledReason','boolean / string',<span>Reordering unavailable — a foreign sort applied, or a role that may not resequence. The reason is announced and carried on every handle; <code>disabled</code> without it is a dead list with no explanation.</span>],
      ['autoScroll','boolean',<span>Default true. Bounded scrolling of the nearest scrollable ancestor near its edges during a pointer drag, and never the only route to an off-screen destination.</span>],
    ]}/>
  </Sec>

  <Sec n="§05" title="Sizes" note="One control rhythm across the parts the composite draws">
    <p>The handle and both steppers take one <code>size</code>, sized from <code>--control-h-sm|md|lg</code>, which also sets each row's minimum height — so the controls stay square, stay aligned down the column, and follow <code>[data-density]</code>. Only the composite can know all three pieces; a handle left at its own default beside <code>sm</code> steppers is visibly wrong, and a handle that shrinks with the row breaks the touch-target minimum the pattern requires (§11 there).</p>
    <div className="two">
      <div className="pane"><h3>sm — a dense row</h3><Routing size="sm" /></div>
      <div className="pane"><h3>md — the default</h3><Routing size="md" /></div>
    </div>
  </Sec>

  <Sec n="§06" title="States" note="The grab is the state no row holds alone">
    <T cols={['State','What is true','What is shown']} rows={[
      ['at rest','No grab.','The sequence, a named handle per movable row, and the reason on each row that cannot move.'],
      ['grabbed','Identity and origin index recorded; proposed index equals origin.','The row marked in hand, its origin position stated, and the way out named in the instructions.'],
      ['proposing','A proposed index exists and is legal.','The insertion indicator at that position, and a polite announcement of it with its neighbours.'],
      ['refused position','The candidate position breaks a rule. Still grabbed.','No indicator, the rule announced with the blocking reason, and the item still in hand at its last legal proposal.'],
      ['immovable item','canMove refused this identity.','A disabled handle whose accessible name is the reason, and disabled steppers.'],
      ['unavailable','disabled is set.','Every handle disabled carrying disabledReason, which is also the list description.'],
    ]}/>
    <p><strong>There is no "moving" state here.</strong> Once <code>onMove</code> fires the component is back at rest: the write, its progress and its failure belong to the consumer, which is why the demo above marks its own row "writing".</p>
    <div className="two">
      <div className="pane do"><h3>Consumer commits, component rests</h3><Routing latency={1200} /></div>
      <div className="pane dont"><h3>The same, when the write is refused</h3><Routing latency={1200} fails /><Text size="xs" tone="tertiary">The order never changed, because only the consumer's success writes it — no rollback to compute.</Text></div>
    </div>
  </Sec>

  <Sec n="§07" title="Keyboard" note="The same operation, not an alternative">
    <T cols={['Key','On the handle']} rows={[
      [<span><kbd>Space</kbd> / <kbd>Enter</kbd></span>,'Grabs the item; grabs and drops are the same control, so a second press drops it at the proposed position.'],
      [<span><kbd>↑</kbd> <kbd>↓</kbd></span>,'While grabbed, moves the PROPOSAL, not the focus. Arrow keys are modal for the duration of the grab, which is why the instructions are part of the grab announcement.'],
      [<span><kbd>←</kbd> <kbd>→</kbd></span>,'The same, for a collection laid out horizontally.'],
      [<span><kbd>Home</kbd> / <kbd>End</kbd></span>,'Proposes the first or last position — the answer to a destination twenty rows away.'],
      [<span><kbd>Esc</kbd></span>,'Abandons: the item returns to its origin index, nothing is requested, and the announcement says where it was left.'],
      [<span><kbd>Tab</kbd></span>,'Cancels the grab and then moves focus. Focus never leaves a live grab silently, which would leave arrow keys apparently broken elsewhere on the page.'],
    ]}/>
    <p>Both paths call one <code>canDrop</code> and one <code>onMove</code>. A refused position is refused identically whether it was reached by pointer or by arrow key — the divergence between the two is the defect this component was promoted to prevent.</p>
  </Sec>

  <Sec n="§08" title="Accessibility" note="What the composition owes a user who cannot see the list">
    <ul>
      <li><strong>The handle is named by item and position</strong> — "Move op 30 Deburr, position 3 of 8" — and while in hand it names the drop instead: "Drop op 30 Deburr at position 2 of 8". A column of handles called "Reorder" is unusable.</li>
      <li><strong>Grabbed state is <code>aria-pressed</code> on the handle,</strong> so it is perceivable as a toggle rather than only as a tint.</li>
      <li><strong>The modal keys are announced when the mode begins,</strong> and are also the list's description: they are not discoverable, so they are stated rather than documented.</li>
      <li><strong>Every proposal, refusal and abandon is announced politely,</strong> naming the position, the total and — under <code>position-and-neighbours</code> — what the item would follow and precede.</li>
      <li><strong>Every row carries its position in hidden text,</strong> because order alone is not perceivable one row at a time.</li>
      <li><strong>Focus stays on the handle through a move,</strong> so a user making several moves is never returned to the top of the list. The consumer's re-render keeps it there by keying rows on identity (§13).</li>
      <li><strong>One live region only.</strong> <code>onAnnounce</code> plus a consumer region means <code>liveRegion={false}</code>; two regions announce everything twice.</li>
    </ul>
  </Sec>

  <Sec n="§10" title="Content rules" note="Wording the contract depends on">
    <ul>
      <li><strong><code>itemName</code> returns what the item is,</strong> never its index — "op 30 Deburr", not "row 3".</li>
      <li><strong>A <code>canDrop</code> refusal names the rule and the blocking item,</strong> in one sentence that can be read aloud mid-grab: "Op 50 CNC bore is pinned to fixture FX-2210, which requires op 20 Pierce complete." "Invalid position" names neither the rule nor anything the user can move instead.</li>
      <li><strong>A <code>canMove</code> reason is a statement about the item,</strong> because it becomes that handle's accessible name: "Pinned last — nothing runs after despatch pack."</li>
      <li><strong><code>label</code> is the collection's own name</strong> as the user knows it, so an announcement can say which of two lists moved.</li>
      <li><strong><code>disabledReason</code> says what would make reordering available again,</strong> not merely that it is off: "Sorted by work centre — restore the sequence order to reorder."</li>
    </ul>
  </Sec>

  <Sec n="§12" title="Anti-patterns" note="Recurring misuses worth naming">
    <div className="two">
      <div className="pane dont"><h3>Refused</h3><ul>
        <li><strong>Reordering under a foreign sort.</strong> Dragging a row in a list sorted by work centre asks "before which operation?" — a question the view cannot answer. Set <code>disabled</code> with a reason while any sort other than the collection's own sequence is applied.</li>
        <li><strong>Committing inside the component.</strong> Wrapping it in local state that reorders on <code>onMove</code> and calls the service afterwards reinvents the optimistic mutation the pattern refuses, and loses the rollback.</li>
        <li><strong><code>items</code> as indices or objects.</strong> Identity is what a grab holds; anything else breaks the moment the collection refreshes.</li>
        <li><strong><code>canDrop</code> returning a boolean.</strong> Warned, and rendered as a refusal nobody can act on.</li>
        <li><strong>A partial list.</strong> Filtered or paged <code>items</code> makes "position 3 of 8" a lie about a routing of forty — scope it explicitly or disable the move (pattern §18).</li>
      </ul></div>
      <div className="pane do"><h3>Reach for instead</h3><ul>
        <li><strong>A view-only order</strong> — <code>Table</code>'s column sort.</li>
        <li><strong>A typed sequence number</strong> — collection editing, where the destination is off screen or the collection is long.</li>
        <li><strong>Transfer between two collections</strong> — the pattern, whose commit spans both.</li>
        <li><strong>One operation over many chosen items</strong> — bulk selection and action.</li>
      </ul></div>
    </div>
    <div className="pane"><h3>Unavailable, with its reason</h3><Routing disabled disabledReason="Sorted by work centre — restore the sequence order to reorder." /></div>
  </Sec>

  <Sec n="§13" title="Implementation notes" note="Constraints not apparent from the API">
    <ul>
      <li><strong>The grab is one object from the first moment:</strong> <code>{'{ id, originIndex, proposedIndex }'}</code>. An implementation storing only a dragged id cannot implement <kbd>Esc</kbd> and cannot report where to put the item back.</li>
      <li><strong><code>items</code> may change under a live grab.</strong> Identity holds: the origin index is re-derived and announced, and an item that has left the collection ends the grab with an explanation rather than holding an identity that no longer exists.</li>
      <li><strong>Legality is one function called from three places</strong> — the pointer path, the keyboard path, and immediately before <code>onMove</code>. One function is what keeps the paths in agreement.</li>
      <li><strong>Every state is derived from the grab,</strong> the legality result and <code>items</code>. Nothing stores "is dragging", which is what leaves a list grabbed after its item disappears. The effect that re-derives an origin index keys on the order's <em>value</em>, not the array's identity: a consumer computing <code>items</code> in render passes a fresh array every time, and an identity-keyed effect reset live proposals mid-grab.</li>
      <li><strong>Key rows on identity, not index,</strong> in the consumer. Index keys make React reuse the wrong row on a commit and drop focus off the moved handle.</li>
      <li><strong>The pointer path is pointer events bound on the window,</strong> not HTML5 drag-and-drop and not element pointer capture. <code>draggable</code> gives nothing on touch and <code>dragover</code> is too coarse to track a proposal; <code>lostpointercapture</code> fires <em>before</em> <code>pointerup</code> whenever capture ends, which discarded the drag mid-gesture and left a grab that could neither commit nor abandon. Window-bound listeners for the drag's duration give every gesture exactly one ending.</li>
      <li><strong>Auto-scroll is bounded and interruptible:</strong> it clamps at both ends of the scroll container and stops with the drag. It is a convenience layered on the steppers, not a substitute for them.</li>
      <li><strong>Pointer cancellation abandons,</strong> and so does a release away from the list: both resolve to the committed order rather than committing a position the pointer had already left.</li>
    </ul>
  </Sec>

  <Sec n="§14" title="Developer notes" note="Integration contract">
    <ul>
      <li><strong>Uncontrolled grab, controlled order.</strong> The grab is internal by design — that is the mechanics being promoted. The order is entirely yours: <code>items</code> in, <code>onMove</code> out.</li>
      <li><strong>Send the move, not the array.</strong> <code>onMove</code> hands you <code>(id, fromIndex, toIndex)</code> so a service call can be <code>{'{ id, fromIndex, toIndex, baseRevision }'}</code> and the service can detect that the sequence moved underneath the user. Posting a reordered array is a silent last-write-wins over someone else's change.</li>
      <li><strong>Guard the write at your own state transition,</strong> not by disabling handles: the component will happily start a second grab, and two sequence writes racing on one collection is how an item ends up twice.</li>
      <li><strong>Announcements are yours to reuse.</strong> <code>onAnnounce</code> gives you the exact sentence for a visible status line; pair it with <code>liveRegion={false}</code>.</li>
      <li><strong>Status: unfrozen.</strong> The API is open until a consumer outside this design system has used it, per the <a href="../../guidelines/promotion-policy.card.html">promotion policy</a>. Two calls are the ones most likely to move: whether <code>canDrop</code> should also be consulted for a whole proposed order at once, and whether <code>renderItem</code> earns its place beside <code>children</code>.</li>
    </ul>
  </Sec>

  <p className="omitted"><strong>Omitted sections and why.</strong>
  §04 Variants — reorder is one contract; the two forms a reader might expect are a property (<code>moveControls</code>) and a pattern (transfer, whose commit spans two collections).
  §09 Motion — an item may be animated into its new position by the consumer, but no motion here carries information the announcement does not, and none may delay it; a rollback that must be perceivable is a failure rule in the pattern (§10 there), met without motion at all.
  §11 Responsive — the composition does not change with space. Which input is practical does, and the answer is unconditional rather than a breakpoint: the steppers are present at every size.</p>
