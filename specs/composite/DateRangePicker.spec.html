      <li><strong>Disabled and read-only are aggregate.</strong> Half a range is not an editable value.</li>
    </ul>

  <Sec n="§08" title="Accessibility" note="Relationships created by the composition">
    <ul>
      <li><strong>Each endpoint has a distinct accessible identity.</strong> Both labels are real <code>&lt;label for&gt;</code> elements pointing at their own input ids — not <code>aria-label</code> strings, not placeholders, and never position ("the left one"). The group carries the subject; the labels carry the roles.</li>
      <li><strong>The pair is programmatically one thing.</strong> <code>role="group"</code> named by <code>label</code> is what makes "Report window / Start / End" readable as one range instead of two unrelated date fields on a form.</li>
      <li><strong>Range validation is associated, not merely displayed.</strong> The message region is referenced from both endpoints through <code>aria-describedby</code>, and it is a permanently-mounted <code>role="alert"</code>: a live region inserted into the DOM together with its text is announced unreliably. Endpoint-specific hints are described to their own control only.</li>
      <li><strong>Reading and focus order follow temporal order.</strong> Start, then end, in the DOM, at every width and in every arrangement — no <code>order</code>, no <code>row-reverse</code>, no visual-only rearrangement (§11).</li>
      <li><strong>Invalidity reaches assistive technology.</strong> Each implicated endpoint gets <code>aria-invalid</code>, so the failure is not carried by a red border alone.</li>
      <li><strong>Endpoint ids never collide, and never double up.</strong> Each endpoint has its own id from one scope, so it carries exactly one <code>&lt;label&gt;</code>. Inside a <code>Field</code>, the group is named by the Field's label through <code>aria-labelledby</code> and the Field is told to stop aiming its <code>htmlFor</code> at a single control — borrowing the Field's id for the start input made that label a <em>second</em> label on it, announced as "Shift period First shift" beside a partner announced as just "Last shift".</li>
      <li><strong>Each panel keeps <code>DatePicker</code>'s dialog and grid semantics.</strong> The composite re-implements none of it, and does not link the two panels: two independent dialogs, each named for its endpoint.</li>
    </ul>
    <div className="warn"><p>The most common failure of this component is a range whose endpoints are distinguished only by an arrow glyph between two identically named date fields. It looks unambiguous on screen and is unusable by anyone not looking at it.</p></div>

      <div className="pane do"><h3>Do</h3><ul>
        <li>Use one pair of endpoint words across the product — "Start"/"End", or "First shift"/"Last shift".</li>

        <li>Put interval rules in <code>hint</code> ("Both dates are inclusive") and endpoint rules in <code>startHint</code>/<code>endHint</code>.</li>
        <li>Keep both endpoints in the same format — ISO, mono, from <code>DatePicker</code>.</li>
      </ul></div>
      <div className="pane dont"><h3>Don't</h3><ul>
        <li>Mix vocabularies: "From" on one endpoint, "End date" on the other.</li>
        <li>Let a dash or arrow be the only thing saying which end is which.</li>
        <li>Put an endpoint rule in the range hint, where it reads as applying to both.</li>

    <ul>
      <li><strong>Two loose DatePickers for one range.</strong> Nothing orders them, nothing validates the pair, nothing tells assistive technology they are related, and every consumer re-implements the cross-field rule slightly differently.</li>
      <li><strong>Contradictory values with no invalid state.</strong> An end before its start, accepted silently, becomes a report with no rows and a support ticket. Either prevent it (<code>constrain</code>) or report it — never neither.</li>
      <li><strong>Faking an open-ended interval.</strong> Leaving one end empty to mean "and onwards" is not supported: an empty end is <em>missing</em>, and the two cannot be told apart. A control that means "from here on" needs that in its contract.</li>
      <li><strong>Domain rules inside the component.</strong> A 90-day cap, a fiscal-quarter restriction or a blackout window is business logic; it arrives as <code>min</code>/<code>max</code>, <code>isDateDisabled</code> or <code>error</code>. Baking it in makes the next product fork the component.</li>
      <li><strong>Swapping the user's entries.</strong> Correct in <code>DatePicker range</code>'s one-panel interaction, wrong across two named fields (§06).</li>
      <li><strong>Using it to pick a window on a calendar.</strong> If there is no form, no per-endpoint validation and the user wants presets and one panel, this composite is the heavier, worse answer — use <code>DatePicker range</code>.</li>
    </ul>

  <Sec n="§13" title="Implementation notes" note="Constraints not visible from the API">
    <ul>
      <li><strong>One range model, two related values.</strong> The composite holds no copy of either date: <code>value</code> is the pair, and every change emits a whole new pair. Consumers never infer the relationship from two separate states, which is the failure mode two loose pickers guarantee.</li>
      <li><strong>Cross-field validation lives at the composite level</strong>, computed from the current pair on every render — ordering first, then bounds, then partiality. Nothing about it is stored, so there is no stale error to clear.</li>
      <li><strong>Each endpoint gets its own <code>FieldContext</code>.</strong> This is the load-bearing detail: <code>DatePicker</code> reads <code>FieldContext</code> for its id, <code>aria-describedby</code>, <code>aria-invalid</code> and <code>aria-required</code>, so two pickers under ONE Field would take the same id — two controls, one id, and a label pointing at whichever the browser found first. The composite therefore consumes the outer Field itself and republishes a distinct context per endpoint, merging the Field's own <code>describedBy</code> and invalid state into both.</li>
      <li><strong>The composite claims the Field's label as a group name.</strong> Both endpoint ids come from the composite's own scope, and on mount it calls <code>claimGroup()</code> on the Field context; the Field's label keeps its element and styling but drops <code>htmlFor</code>, and the group references it with <code>aria-labelledby</code>. Without that, the Field's label and the start endpoint's label both aimed at the start input — and browsers <em>concatenate</em> multiple <code>&lt;label for&gt;</code>, so one endpoint absorbed the group's name and its partner did not. <code>claimGroup</code> is additive on <code>Field</code>: a Field can no longer tell whether its child is one control or a named group, so the group tells it.</li>
      <li><strong>Each <code>DatePicker</code> keeps its own selection behaviour.</strong> Typed ISO parsing, the panel, the grid keyboard, the clear affordance and the value format are untouched; the composite adds bounds and reads results.</li>
      <li><strong>Derived bounds tighten, never mutate.</strong> The end's <code>min</code> is the later of the outer <code>min</code> and the start; the start's <code>max</code> is the earlier of the outer <code>max</code> and the end. Nothing else about either picker changes, and the derivation is suspended while the pair is inverted (§06).</li>
      <li><strong>The endpoint label is a <code>&lt;label&gt;</code>, not an <code>aria-label</code>.</strong> <code>Text as="label" htmlFor=&#123;endpointId&#125;</code> — so the visible word and the accessible name are the same string and cannot drift apart.</li>
      <li><strong>Development-time warnings</strong> cover a non-array <code>value</code>, a missing <code>label</code> outside a Field, <code>min</code> after <code>max</code>, and <code>presets</code> (which belongs to <code>DatePicker range</code>).</li>
    </ul>
    <div className="tokenlist">
      {['--date-range-gap','--field-label-text','--field-error-text','--field-message-gap','--datepicker-* (via DatePicker)','--control-h-sm / -md / -lg'].map(t=><span key={t}>{t}</span>)}
    </div>
  </Sec>

  <Sec n="§14" title="Developer notes" note="Integration contract">
    <div className="demo col">
      <DateRangePicker label="Export window" value={dev} onChange={setDev} min="2026-01-01" max="2026-12-31" onValidityChange={setGate} />
      <span className="log">[{dev[0]||'—'}, {dev[1]||'—'}] · valid {String(gate.valid)}{gate.reason ? ' · ' + gate.reason : ''}</span>
    </div>
    <pre>{`const [range, setRange] = React.useState([undefined, undefined]);

<DateRangePicker
  label="Export window"
  value={range}
  onChange={setRange}          // (next) => next is always [start, end]
  min="2026-01-01" max="2026-12-31"
  onValidityChange={({ valid, reason }) => setCanSubmit(valid)}
/>

// a filter, where an open interval is a legitimate value
<DateRangePicker label="Created between" value={range} onChange={setRange} allowPartial />`}</pre>
    <ul>
      <li><strong>One range contract.</strong> <code>value</code> in, <code>[start, end]</code> out, always both ends — a consumer never receives a bare date and never has to remember which field emitted it.</li>
      <li><strong>Partial validity is declared, not guessed.</strong> <code>allowPartial</code> states whether a half-filled range is a legal intermediate value. It is <code>false</code> by default because most forms cannot use an open interval, and a range that submits with one end missing silently changes what was asked for; a filter or saved view opts in. Note that the <em>message</em> is deferred until the endpoint is visited and left (§06) while <code>onValidityChange</code> reports the truth immediately — a submit gate should not depend on where the caret has been.</li>
      <li><strong>Changing one endpoint changes only that endpoint.</strong> The other is passed through untouched — no clamping, no clearing, no swapping. If the result is inconsistent it is reported, and the user fixes the field they meant to fix.</li>
      <li><strong>Validity is pushed, not polled.</strong> <code>onValidityChange</code> fires when validity or its reason changes, so a submit button has a gate without the consumer re-deriving the ordering rule.</li>
      <li><strong>No duration limits.</strong> The composite will not cap a range at 30 or 90 days; that is a domain rule, and it belongs in <code>min</code>/<code>max</code>, <code>isDateDisabled</code> or an <code>error</code> the consumer computes.</li>
      <li><strong>The value format is <code>DatePicker</code>'s, unchanged.</strong> ISO <code>'YYYY-MM-DD'</code> strings, never <code>Date</code> objects — a <code>Date</code> is a timestamp with a timezone, and local-midnight → <code>toISOString()</code> files a date against the previous day west of Greenwich. A range picker that introduced its own format would put that bug back twice.</li>
    </ul>
  </Sec>

  <p className="omitted">Omitted, per the composite spec standard: §04 Variants (the arrangement is a property and the endpoints are fixed — there is no second semantically distinct form) · §07 Keyboard (the composition introduces no key: each endpoint keeps <code>DatePicker</code>'s field and grid contract, and the only coordination is tab order, which §08 and §11 own) · §09 Motion (no composite-owned transition; each panel animates itself).</p>
</div>
);}
