const { Alert, Button, Link, Text, Badge } = window.MeridianDesignSystem_962c43;

const Sec = ({n,title,note,children}) => (

  const [dismissed, setDismissed] = React.useState(false);

return (
<div className="page">
  <div className="masthead">
    <span className="eyebrow">Feedback · Component specification</span>
    <h1>Alert</h1>
    <p className="lede">A condition, stated in the page, that stays until the condition does. It is the persistent member of the notice family and the only one that is ordinary layout: no timer, no position, no z-index, no portal. A toast reports that something happened; an alert reports that something <em>is</em> — the historian is unreachable, this order is on hold, two lines have not been serviced since August. It stops being on screen because the product stopped rendering it, not because time passed.</p>
    <div className="meta">
      <span>components/feedback/Alert.jsx</span><span>window.MeridianDesignSystem_962c43.Alert</span><span style={{color:'var(--text-primary)'}}>status: frozen 5 Sep 2026 · 0 open items</span><span>since: 1.11.0</span><span>28 tokens · no z-index</span>
    </div>
  </div>

  <Sec n="01" title="Purpose" note="State, in the flow, next to what it is about.">
    <p>Use an alert when a condition affects what the user is looking at and will still be true in a minute. Because it sits in the layout, its <strong>position is the message's scope</strong>: above the page header it is about the product, above a form it is about the form, inside a card it is about that card. That is something no toast can express, and the main reason this component exists.</p>
    <T cols={['You want to…','Component','Why']} rows={[
      ['State a condition that persists','Alert','This component. It stays as long as the condition.'],
      ['Confirm an event whose result is off-screen','Toast','An event expires; a condition does not.'],
      ['Confirm a reversible change on the surface in view','Snackbar','One line, one action, scoped to that surface.'],
      ['Report a single invalid field','Field error','Errors belong on their input. An alert above the form that repeats it is duplication.'],
      ['Summarise many invalid fields after a submit','Alert, tone="danger", live="on"','The one legitimate form-level alert: a count and links to the fields.'],
      ['Force a decision before continuing','Dialog','An alert does not block, and must never pretend to.'],
      ['Show that a region is empty','An empty state','"No work orders match" is not a warning; it is the content.'],
      ['Explain a field','Field hint','Help text is not an alert, however small the alert.'],
    ]}/>
    <ul>
      <li><strong>The test is duration.</strong> If it is true for as long as the user is on this screen, it is an alert. If it was true for one moment, it is a toast or a snackbar.</li>
      <li><strong>Never more than one per region.</strong> Two stacked alerts is a page telling the user it has lost track of its own state; merge them or rank them.</li>
      <li><strong>Do not use for marketing, tips, or "did you know".</strong> Every alert a user learns to ignore costs the one that matters.</li>
      <li><strong>Do not use as a success receipt.</strong> <code>tone="success"</code> exists for a standing good condition ("All 42 checks passed"), not for "Saved" — that is a toast.</li>
    </ul>
    <div className="demo col">
      <Alert tone="warning" title="Maintenance window in 40 minutes" action={<><Button variant="secondary" size="sm">Reschedule</Button><Button variant="ghost" size="sm">View plan</Button></>}>
        Lines 3 and 4 stop at 18:00 CET. Work orders in progress are held, not cancelled.
      </Alert>
    </div>
  </Sec>

  <Sec n="02" title="Anatomy" note="An icon, a title, a paragraph, up to two actions.">
    <div className="demo col">
      <Alert tone="danger" title="Historian unreachable" action={<><Button variant="secondary" size="sm">Retry connection</Button><Button variant="ghost" size="sm">Open runbook</Button></>} onDismiss={undefined}>
        Trend charts and OEE are showing the last cached values from 09:12. Live counts on this page are unaffected.
      </Alert>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {[['1','Container — in normal flow, tinted with the tone\u2019s --alert-*-background and a hairline in --alert-*-border. No shadow: an alert is not a raised layer, it is part of the page.'],
          ['2','Icon — 16px (14px at sm) in --alert-*-icon, aria-hidden. Decorative by contract: it repeats what the title already says.'],
          ['3','Title — --text-sm --weight-semibold in the tone\u2019s --alert-*-title colour. One line, scannable, names the condition.'],
          ['4','Body — --text-sm in --alert-body-text, NOT the tone colour: a paragraph in red-700 is a headline pretending to be prose. One to three sentences, and the place where the detail lives.'],
          ['5','Actions — up to two Buttons, secondary and ghost. Never a primary: the alert is a statement, and the page\u2019s primary action is elsewhere.'],
          ['6','Dismiss — optional ghost IconButton labelled "Dismiss". Present only when silencing the alert is genuinely the user\u2019s call (§06).'],
          ['7','Accent bar — 3px in the tone\u2019s icon colour, banner variant only, where the border is gone and the tint alone is too quiet at full width.']].map(([n,t])=>(
          <div className="callout" key={n}><span className="cnum">{n}</span><Text size="xs">{t}</Text></div>
        ))}
      </div>
    </div>
    <p>The tone is carried <strong>four ways at once</strong> — tint, border, icon and the word in the title. That redundancy is not decoration: it is what survives a monochrome display, Windows High Contrast, and the ~8% of male operators with a red/green deficiency. An alert whose meaning is only in its colour is a WCAG 1.4.1 failure, which is why the component warns when it is given neither a title nor body content.</p>
  </Sec>

  <Sec n="03" title="Properties" note="Presentational and uncontrolled. The product decides when it exists.">
    <T cols={['Prop','Type','Default','Notes']} rows={[
      ['tone','\u2018info\u2019 | \u2018success\u2019 | \u2018warning\u2019 | \u2018danger\u2019 | \u2018neutral\u2019','info','Sets tint, border, icon and title colour (§04).'],
      ['title','ReactNode','—','One line naming the condition. Strongly recommended; the body alone reads as prose in a coloured box.'],
      ['children','ReactNode','—','The explanation. Without a title it becomes the whole alert, at --alert-title-text strength.'],
      ['icon','string | false','tone\u2019s icon','Override by icon name, or false to remove — for a dense alert inside a card where the tint is already the signal.'],
      ['action','ReactNode','—','Up to two Buttons. Secondary and ghost only.'],
      ['onDismiss','() => void','—','Renders the dismiss button. Omit for anything the user must not hide (§06).'],
      ['size','\u2018sm\u2019 | \u2018md\u2019','md','sm for alerts inside cards, panels and table toolbars.'],
      ['variant','\u2018inline\u2019 | \u2018banner\u2019','inline','banner spans the app frame: no radius, bottom rule, 3px tone accent (§04).'],
      ['live','\u2018off\u2019 | \u2018on\u2019','off','Announce an alert that APPEARS. Leave off for one present at load (§08).'],
    ]}/>
    <p>There is no <code>open</code> prop and no internal visibility state. The product renders an alert when the condition is true and stops when it is not — usually a plain conditional on real state, which is what keeps a stale alert from outliving the thing it describes.</p>
    <p>Two development warnings: <strong>neither title nor children</strong> (a tinted block with no words), and <strong><code>onDismiss</code> on <code>tone="danger"</code></strong> (letting the user hide a condition that is still true).</p>
  </Sec>

  <Sec n="04" title="Variants" note="Five tones, two layouts.">
    <div className="demo col">
      <div className="stack">
        <Alert tone="info" title="Shift handover at 14:00">Days hands over to Swing. Open work orders transfer automatically.</Alert>
        <Alert tone="success" title="All 42 pre-start checks passed">Line 3 is cleared to run. Signed by M. Okonkwo at 05:41.</Alert>
        <Alert tone="warning" title="Two maintenance windows skipped">Lines 3 and 4 have not been serviced since 17 Aug.</Alert>
        <Alert tone="danger" title="Station 4 sensor offline">Cycle counts on this line are estimates until it reconnects.</Alert>
        <Alert tone="neutral" title="This routing is a draft">It will not be offered to the scheduler until it is published.</Alert>
      </div>
    </div>
    <T cols={['Tone','Means','Use']} rows={[
      ['info','A fact the user should know','Scheduled events, transfers, read-only modes. Teal, never blue: blue means action.'],
      ['success','A standing good condition','"All checks passed", "Fully staffed". Not a receipt for a save.'],
      ['warning','Something needs attention, nothing is broken','Overdue service, degraded mode, an approaching deadline.'],
      ['danger','Something is broken or a rule is violated','Failures, blocked submits, unreachable systems. Never dismissible.'],
      ['neutral','A state with no severity','Draft, archived, superseded. The grey tint keeps status vocabulary honest.'],
    ]}/>
    <div className="demo col">
      <div className="frame">
        <Alert tone="danger" variant="banner" title="Historian unreachable" action={<Button variant="secondary" size="sm">Retry</Button>}>
          Trend charts show the last cached values from 09:12.
        </Alert>
        <div className="bar"><span>Meridian Console · Assembly</span><span>Days shift</span></div>
        <div className="content">
          <Alert tone="warning" size="sm" title="Line 3 running below target" icon={false}>OEE 61% against a 78% target for the last two hours.</Alert>
          <span>Table, charts and the rest of the page continue here.</span>
        </div>
      </div>
      <Text size="xs" tone="tertiary">Banner above the app frame (product scope) and an sm inline alert inside a panel (panel scope). Position is the scope — the component does not need a prop for it.</Text>
    </div>
    <ul>
      <li><strong>banner is for the app frame only</strong> — one, at the top, above the header, for a condition affecting the whole product. Two banners is an outage page.</li>
      <li><strong>No solid/filled variant.</strong> A saturated full-width red band collides with the alarm colours in the data and destroys the contrast of anything inside it.</li>
      <li><strong>No "toast-like" floating variant.</strong> If it should float, it is a Toast.</li>
    </ul>
  </Sec>

  <Sec n="05" title="Sizes" note="Two, and the difference is density, not importance.">
    <T cols={['','md (default)','sm']} rows={[
      ['Padding','--alert-padding-md · 16px','--alert-padding-sm · 12px'],
      ['Title','--text-sm · semibold','--text-xs · semibold'],
      ['Body','--text-sm','--text-xs'],
      ['Icon','16px','14px'],
      ['Use','Page and section scope: above a header, above a form, top of a page column.','Inside cards, side panels, table toolbars and dialogs — anywhere the surrounding type is already --text-xs.'],
    ]}/>
    <div className="demo col">
      <Row label="md"><Alert tone="warning" title="Recipe changed since last run">Verify the setpoints before releasing this order.</Alert></Row>
      <Row label="sm"><Alert tone="warning" size="sm" title="Recipe changed since last run">Verify the setpoints before releasing this order.</Alert></Row>
      <Row label="sm · title only"><Alert tone="info" size="sm" title="Read-only until the shift closes at 14:00" /></Row>
      <Text size="xs" tone="tertiary">A title-only alert is legitimate and common. A body-only alert is not: without a heading there is nothing to scan, and the tint has to carry the meaning.</Text>
    </div>
    <p>Neither size changes the alert's importance — a <code>danger</code> alert at <code>sm</code> is exactly as serious as one at <code>md</code>. Size follows the density of what surrounds it, and both sizes stay above the 12px floor for body text.</p>
  </Sec>

  <Sec n="06" title="States" note="It has almost none, and that is the point.">
    <T cols={['State','Treatment']} rows={[
      ['Present','The only resting state. No hover, no focus, no press: the container is not interactive.'],
      ['Appeared','Rendered after load in response to something — the only case that needs live="on" (§08). Optionally --anim-fade-in.'],
      ['Dismissed','Removed by the product when onDismiss is called. The component does not hide itself; there is no internal open flag to get out of sync.'],
      ['Resolved','The condition ends, the product stops rendering it. No animation, no "resolved" style — a green alert where a red one was is a receipt, and receipts are toasts.'],
      ['Actions busy','Own the loading state on the Button, not on the alert.'],
      ['Focus within','Only its actions and dismiss take focus. The alert itself is never a tab stop.'],
    ]}/>
    <div className="demo col">
      {!dismissed && (
        <Alert tone="info" title="You are viewing the Days shift" onDismiss={()=>setDismissed(true)}>
          Switch shifts from the header to see live counts for the current one.
        </Alert>
      )}
      {appeared && (
        <Alert tone="danger" live="on" title="3 fields need attention" action={<Button variant="secondary" size="sm">Go to first</Button>}>
          Quantity, Due date and Routing are invalid. Each field also shows its own error.
        </Alert>
      )}
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
        <Button variant="secondary" onClick={()=>setDismissed(false)} disabled={!dismissed}>Restore dismissed alert</Button>
        <Button variant="secondary" onClick={()=>setAppeared(v=>!v)}>{appeared?'Clear submit summary':'Simulate failed submit'}</Button>
      </div>
      <Text size="xs" tone="tertiary">Dismissal is the product's state, not the component's. The submit summary is the one alert that should announce itself.</Text>
    </div>
    <p><strong>When may an alert be dismissible?</strong> Only when hiding it is the user's legitimate choice and the condition is not blocking: an informational note, a one-off explanation, a promotion of a feature they already know. Never for <code>danger</code> (the component warns), never for anything that blocks a submit, and never when "dismissed" is not persisted — an alert that returns on every navigation is worse than one that cannot be closed.</p>
  </Sec>

  <Sec n="07" title="Keyboard" note="Nothing to operate. Everything reachable.">
    <T cols={['Key','Behaviour']} rows={[
      ['(on appear)','Nothing. Focus does not move — the user may be mid-sentence in a field, and an alert is not a layer to enter.'],
      ['Tab','Reaches the alert\u2019s links, actions and dismiss in DOM order. Because the alert is in flow, that order is exactly its position on the page.'],
      ['Enter · Space','Activates the focused control. Native buttons and links throughout.'],
      ['Escape','Nothing. There is no layer to close; dismiss is a button.'],
      ['(container)','Never focusable. No tabindex, no role that implies interactivity.'],
    ]}/>
    <p>The in-flow position is what makes an alert's actions genuinely reachable: an alert above a form is one <kbd>Tab</kbd> from the first field, and a screen-reader user moving by heading or region encounters it before the thing it describes. It is the accessibility argument for stating a condition here rather than in a corner notice that both sighted and keyboard users have to hunt for.</p>
    <div className="demo col">
      <Alert tone="danger" title="Submit blocked: 2 fields are invalid" action={<><Button variant="secondary" size="sm">Go to first error</Button><Button variant="ghost" size="sm">Dismiss changes</Button></>}>
        See <Link href="#quantity">Quantity</Link> and <Link href="#routing">Routing</Link> — both are also marked in the form.
      </Alert>
      <Text size="xs" tone="tertiary">Tab from here: the two in-body links, then the two actions. A summary alert should link to the fields, and the fields must still carry their own errors.</Text>
    </div>
  </Sec>

  <Sec n="08" title="Accessibility" note="Announce only what appeared.">
    <ul>
      <li><strong>Default is not a live region.</strong> An alert rendered with the page has already been read in document order; wrapping it in <code>role="alert"</code> makes a screen reader interrupt itself to repeat content the user is about to reach anyway.</li>
      <li><strong><code>live="on"</code> is for alerts that appear</strong> after load — a failed submit summary, a connection dropping. <code>danger</code> then becomes <code>role="alert"</code> (assertive); every other tone becomes <code>role="status"</code> (polite), because "two windows skipped" does not justify interrupting a sentence.</li>
      <li><strong>The container is never focusable</strong> and never announces itself as interactive. Moving focus to an alert on appearance would drop the user's caret; the summary pattern instead offers a "Go to first error" button.</li>
      <li><strong>Colour is never the message.</strong> Tint + border + icon + a word in the title, always. The icon is <code>aria-hidden</code>, so the title has to say "failed", "skipped", "offline" in words.</li>
      <li><strong>Contrast:</strong> titles use the tone's <code>-text</code> ramp (700-level, ≥4.5:1 on its own tint) and body copy uses <code>--alert-body-text</code>. Body text never takes the tone colour, which is both a legibility and a contrast decision.</li>
      <li><strong>Forced colours:</strong> the tint and border are replaced by the system palette, so the icon and the words are what remain — the same reason Badge pins its border to <code>CanvasText</code>. Every alert must read correctly with no colour at all.</li>
      <li><strong>Dismiss has a real name</strong> ("Dismiss"). It is a button, not a close glyph on a layer, and its <code>44px</code> target is met at both sizes through IconButton.</li>
      <li><strong>Do not duplicate field errors.</strong> A summary alert plus per-field errors is correct (it is <em>one</em> announcement plus permanent per-input errors); an alert that only repeats a single field's error makes the same problem announce twice.</li>
      <li><strong>Motion:</strong> nothing loops, nothing shifts layout. Alerts may fade in; a page that jumps because an alert pushed the form down is worse than no animation (§09).</li>
    </ul>
  </Sec>

  <Sec n="09" title="Motion" note="Almost none, and never a height animation.">
    <T cols={['Moment','Motion','Tokens']} rows={[
      ['Present at load','None. It is page content.','—'],
      ['Appearing after load','--anim-fade-in, opacity only, at the product\u2019s discretion.','--duration-base · --ease-out'],
      ['Reserving space','Preferred over animating: keep the slot when the alert is likely, so nothing below it moves.','—'],
      ['Dismiss','None. Removal is immediate.','—'],
      ['Height / expand','Never animated. Height transitions on an in-flow block push everything below through several frames of motion.','—'],
      ['Reduced motion','Durations collapse to 1ms; the alert simply appears.','prefers-reduced-motion'],
    ]}/>
    <p>An alert is the one notice that changes the layout by existing, which makes motion actively harmful here: an animated entrance moves the form the user was about to click. Opacity is the only property worth touching, and even that is optional. If a submit failure will place an alert above a form, <strong>reserve its space</strong> — the calm version of this component is one that appears without anything else moving.</p>
  </Sec>

  <Sec n="10" title="Content Rules" note="A title that names the condition; a body that says what it means.">
    <div className="two">
      <div className="pane do"><h3>Do</h3><ul>
        <li><strong>Title names the condition, present tense:</strong> "Station 4 sensor offline", "Two maintenance windows skipped".</li>
        <li><strong>Body says the consequence:</strong> "Cycle counts on this line are estimates until it reconnects."</li>
        <li><strong>Say what to do</strong> when there is something to do, and make it the action button's label.</li>
        <li><strong>Be specific with time and quantity:</strong> "since 17 Aug", "3 of 12", "from 09:12".</li>
        <li><strong>Keep the body to three sentences.</strong> Longer belongs on a page the alert links to.</li>
        <li><strong>Sentence case</strong>, full stops in the body, none in the title, and no exclamation marks (house rule).</li>
      </ul></div>
      <div className="pane dont"><h3>Don't</h3><ul>
        <li><strong>"Warning:" or "Error:" prefixes.</strong> The tone, the icon and the title already say it.</li>
        <li><strong>Apologies or blame:</strong> "Sorry, something went wrong". Name what is wrong.</li>
        <li><strong>Raw errors</strong> — codes, stack traces, service names the operator has never heard.</li>
        <li><strong>A tinted block with no title.</strong> There is nothing to scan, and the tint carries the meaning alone.</li>
        <li><strong>Two actions of equal weight</strong>, or a primary button. The page's primary action is not in the alert.</li>
        <li><strong>Tips, upsells and "did you know".</strong> Every ignorable alert devalues the next real one.</li>
      </ul></div>
    </div>
    <p>House phrasing, in order: <strong>condition → consequence → action</strong>. "Historian unreachable. Trend charts show the last cached values from 09:12. [Retry connection]" — three parts, each in its own slot, none repeating another.</p>
  </Sec>

  <Sec n="11" title="Responsive" note="It is a block. It reflows like one.">
    <ul>
      <li><strong>Full width of its container, always.</strong> No max-width and no centring: an alert narrower than the content it describes reads as an unrelated card.</li>
      <li><strong>Actions wrap below the text</strong> on narrow screens — they are already in a wrapping row under the body, so no breakpoint is needed.</li>
      <li><strong>Prefer <code>size="sm"</code> below about 600px</strong> and inside any panel whose own type is <code>--text-xs</code>.</li>
      <li><strong>Banners stay one line of title plus one of body</strong> on a phone; anything longer pushes the whole app down. Move the detail to the page it links to.</li>
      <li><strong>Never make it sticky.</strong> A pinned alert eats vertical space on every scroll; if it must always be visible, it is a banner at the frame's top.</li>
      <li><strong>Reserve its slot in the layout</strong> where an alert is likely, so appearing does not reflow the page (§09).</li>
      <li><strong>Long bodies wrap with <code>text-wrap: pretty</code></strong> and never truncate — unlike Snackbar, an alert has room to be read.</li>
    </ul>
    <div className="demo col">
      <div style={{display:'grid',gridTemplateColumns:'minmax(0,300px) minmax(0,1fr)',gap:16}}>
        <Alert tone="warning" size="sm" title="Below target" action={<Button variant="secondary" size="sm">Open line</Button>}>OEE 61% against 78% for two hours.</Alert>
        <Alert tone="warning" title="Line 3 running below target" action={<><Button variant="secondary" size="sm">Open line</Button><Button variant="ghost" size="sm">Mute for this shift</Button></>}>OEE is 61% against a 78% target for the last two hours. Scrap is unchanged, so the loss is availability.</Alert>
      </div>
      <Text size="xs" tone="tertiary">Same component at two widths: the icon column holds, the actions wrap, nothing truncates.</Text>
    </div>
  </Sec>

  <Sec n="12" title="Anti Patterns" note="Six, and two of them are how alerts stop working.">
    <div className="two">
      <div className="pane dont"><h3>The two that matter</h3><ul>
        <li><strong>Alert fatigue by stacking.</strong> Three alerts at the top of a page train the operator to skip that region entirely — including the day the top one says a line is down. One alert per region, ranked by severity, merged where possible.</li>
        <li><strong>Using it as a toast.</strong> "Saved" in a green in-flow block that never leaves is the most common misuse: it reflows the page, it outlives the event, and by the third save the user has stopped reading that spot.</li>
      </ul></div>
      <div className="pane dont"><h3>Also don't</h3><ul>
        <li><strong>A dismissible danger alert.</strong> Hiding a condition does not resolve it; the component warns.</li>
        <li><strong>An alert that repeats one field error.</strong> Two announcements, one problem.</li>
        <li><strong>A primary button inside it.</strong> That makes the alert the page's main action; if it is, it should be a Dialog or an empty state.</li>
        <li><strong>Colour-only alerts</strong> — no title, no icon, "the red one means it failed".</li>
        <li><strong>A sticky or auto-dismissing alert.</strong> Both contradict what the component is: in-flow and persistent.</li>
        <li><strong>An alert on every page for a global condition.</strong> Once, as a banner on the frame.</li>
      </ul></div>
    </div>
    <p className="warn">The review test: <strong>read the alert, then ask what the user is supposed to do differently.</strong> If there is no answer, it is decoration with a tint, and it is spending the credibility of every other alert in the product.</p>
  </Sec>

  <Sec n="13" title="Implementation Notes" note="What the code does, and why it does it that way.">
    <ul>
      <li><strong>No state, no timer, no portal, no z-index.</strong> The whole component is one flex container; it is the only member of the notice family that touches nothing outside its own box. That is the implementation of "an alert is page content".</li>
      <li><strong>Role is derived, not passed.</strong> <code>live="off"</code> ⇒ <code>group</code> with no <code>aria-live</code>; <code>live="on"</code> ⇒ <code>alert</code> for danger, <code>status</code> for everything else. Products get one prop instead of three ARIA decisions they will get wrong.</li>
      <li><strong>Body colour depends on whether a title exists.</strong> With a title the body is <code>--alert-body-text</code>; alone it is <code>--alert-title-text</code>, so a title-less alert is still primary-strength text rather than looking like a caption.</li>
      <li><strong>The tone colour never reaches the body.</strong> Titles take the <code>-title</code> ramp; paragraphs stay neutral. This is the single most important styling rule in the component, and the reason it reads as a page block rather than a coloured poster.</li>
      <li><strong>Four tone signals, one lookup.</strong> The <code>TONES</code> map holds background, border, icon colour, icon name and title colour together, so a new tone cannot be half-added.</li>
      <li><strong><code>banner</code> restructures the border rather than restyling it:</strong> radius to 0, border to a bottom rule plus a 3px <code>--alert-accent-width</code> left accent, because at full frame width a hairline all round reads as a mis-sized card and the tint alone is too quiet.</li>
      <li><strong><code>icon={false}</code> exists for density,</strong> not for tone-free alerts: inside an <code>sm</code> alert in a card, the tint and title are already carrying the signal and the glyph costs 24px of the line.</li>
      <li><strong>Actions live in a wrapping row under the body</strong> rather than beside the text: an action column would collapse at narrow widths into exactly the layout it was avoiding, and the alert should be read before it is acted on.</li>
      <li><strong>Two warnings, both about the misuse that breaks accessibility:</strong> no words at all, and a dismissible danger alert.</li>
      <li><strong>28 tokens, 5 tones × 4 roles plus 8 shared.</strong> Nothing is shared with <code>--toast-*</code> or <code>--snackbar-*</code>: the tinted, in-flow surface has no reason to move when an overlay's elevation changes.</li>
      <li><strong>No <code>Alert.Group</code> and no stack helper.</strong> The absence is deliberate — a component that makes stacking easy is a component that ships alert fatigue (§12).</li>
    </ul>
    <div className="tokenlist">
      {['--alert-radius','--alert-padding-sm','--alert-padding-md','--alert-gap','--alert-title-text','--alert-body-text','--alert-dismiss-icon','--alert-accent-width','--alert-info-background','--alert-info-border','--alert-info-icon','--alert-info-title','--alert-success-background','--alert-success-border','--alert-success-icon','--alert-success-title','--alert-warning-background','--alert-warning-border','--alert-warning-icon','--alert-warning-title','--alert-critical-background','--alert-critical-border','--alert-critical-icon','--alert-critical-title','--alert-neutral-background','--alert-neutral-border','--alert-neutral-icon','--alert-neutral-title'].map(t=><span key={t}>{t}</span>)}
    </div>
  </Sec>

  <Sec n="14" title="Developer Notes" note="Rendering it from real state.">
    <pre>{`import { Alert } from '@meridian/feedback';

// An alert is a conditional on real state — never a piece of UI state
// somebody has to remember to clear.
{!historian.reachable && (
  <Alert tone="danger" title="Historian unreachable"
         action={<Button variant="secondary" size="sm" onClick={retry}>Retry connection</Button>}>
    Trend charts show the last cached values from {fmtTime(historian.lastSeen)}.
  </Alert>
)}

// The one form-level alert worth writing: a summary that appeared, with
// links to fields that still carry their own errors.
{submitErrors.length > 0 && (
  <Alert tone="danger" live="on"
         title={\`\${submitErrors.length} fields need attention\`}
         action={<Button variant="secondary" size="sm" onClick={focusFirst}>Go to first</Button>}>
    {submitErrors.map(e => e.label).join(', ')} — each field also shows its own error.
  </Alert>
)}

// Dismissal is the product's state, and it has to be persisted or it
// is not really dismissal.
const [hidden, setHidden] = usePreference('hide-shift-note', false);
{!hidden && (
  <Alert tone="info" title="You are viewing the Days shift" onDismiss={() => setHidden(true)}>
    Switch shifts from the header to see live counts.
  </Alert>
)}`}</pre>
    <ul>
      <li><strong>Derive it from state, don't set it.</strong> The most common bug with this component is an alert whose condition ended and whose flag nobody cleared.</li>
      <li><strong>One per region.</strong> If two conditions are true, show the more severe and link to the rest, or write one alert that covers both.</li>
      <li><strong>Persist dismissal</strong> in a preference or the URL. An alert that reappears every navigation is a broken promise.</li>
      <li><strong>Reserve layout space</strong> where an alert is likely, so the page does not jump when it appears (§09).</li>
      <li><strong>Keep <code>live="on"</code> rare.</strong> Alerts on the page at load must not announce; only what appears should.</li>
      <li><strong>Field errors stay on their fields.</strong> A summary alert is an addition, never a replacement.</li>
      <li><strong>Testing hooks:</strong> the container is <code>[data-alert="info|success|warning|danger|neutral"]</code> with <code>[data-alert-variant]</code>, the dismiss is a button named "Dismiss", and an appearing danger alert is <code>[role="alert"]</code>. Assert that a load-time alert is <em>not</em> a live region — that regression is invisible on screen.</li>
    </ul>
  </Sec>
</div>
);}
