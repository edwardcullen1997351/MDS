<script type="text/babel">
const { Progress, Button, Text, Card, Alert, Badge, Skeleton, Table, Divider } = window.MeridianDesignSystem_962c43;

const Sec = ({n,title,note,children}) => (
  <section>
    <div className="sec-head"><span className="num">{n}</span><h2>{title}</h2>{note?<span className="sec-note">{note}</span>:null}</div>
    <div className="body">{children}</div>
  </section>
);
const T = ({cols,rows}) => (
  <table><thead><tr>{cols.map((c,i)=><th key={i}>{c}</th>)}</tr></thead>
  <tbody>{rows.map((r,i)=><tr key={i}>{r.map((c,j)=><td key={j} className={j===0?'k':''}>{c}</td>)}</tr>)}</tbody></table>
);
const Row = ({label,children}) => <div className="staterow"><span className="lbl">{label}</span><div style={{flex:1,minWidth:0}}>{children}</div></div>;

function Spec(){
if (!Progress) return <div className="page"><div className="masthead"><span className="eyebrow">Feedback · Component specification</span><h1>Progress</h1><p className="lede">The design-system bundle has not been recompiled with <code>components/feedback/Progress.jsx</code> yet — reload once it has.</p></div></div>;
const [pct,setPct] = React.useState(38);
const [running,setRunning] = React.useState(false);
const [done,setDone] = React.useState(false);
React.useEffect(()=>{
  if (!running) return undefined;
  const id = setInterval(()=>setPct(p=>{
    if (p >= 100) { clearInterval(id); setRunning(false); setDone(true); return 100; }
    return p + 4;
  }), 260);
  return ()=>clearInterval(id);
},[running]);
return (
<div className="page">
  <div className="masthead">
    <span className="eyebrow">Feedback · Component specification</span>
    <h1>Progress</h1>
    <p className="lede">Work in flight — a task that started and will end. The component exists to hold one distinction its shape cannot express: <strong>progress reports a task, a gauge reports a level.</strong> An OEE bar at 82 % and an export at 82 % look identical and mean nothing alike — nothing is finishing in the first — and in a plant console, where levels are everywhere, mistaking one for the other is the defect this spec is mostly about. It is also the component two other specs had been deferring to by name since 1.14.0, while <code>--anim-indeterminate</code> sat defined and unconsumed since 1.0.0.</p>
    <div className="meta">
      <span>components/feedback/Progress.jsx</span><span>window.MeridianDesignSystem_962c43.Progress</span><span style={{color:'var(--text-primary)'}}>status: frozen 5 Sep 2026 · 0 open items</span><span>since: 1.20.0</span><span>14 tokens · 0 new keyframes</span><span>role: progressbar</span>
    </div>
  </div>

  <Sec n="01" title="Purpose" note="Say that work is happening, and — only if you truly know — how much is left.">
    <p>Reach for it when a wait is long enough to need acknowledging and the user has to stay on the screen for it. Which of the two forms you use is not a style choice: it is whether the product can honestly measure the work.</p>
    <T cols={['The wait is…','Use','Why']} rows={[
      ['Under ~200ms','Nothing','Any indicator is a flash. Render the result.'],
      ['200ms–3s, the incoming SHAPE is known','Skeleton','It holds the layout, so nothing jumps on arrival. Skeleton §01.'],
      ['Long, and measurable','Progress value={n}','This component, determinate. The number must come from real work (§13).'],
      ['Long, and NOT measurable','Progress (no value)','Indeterminate: "working", never "how long".'],
      ['Short and unmeasurable, inline','Progress variant="spinner"','A ring beside the thing it is about.'],
      ['Owned by the control that started it','Button loading','The wait belongs to the button, and the button already disables itself.'],
      ['A level that is simply true','A chart, or role="meter"','OEE, utilisation, tank level, disk. Nothing is finishing (§12).'],
      ['A background job nobody is watching','Toast on completion','An indicator for a wait no one is waiting on is furniture.'],
    ]}/>
    <div className="demo col">
      <Row label="determinate"><Progress label="Exporting work orders" value={pct} showValue /></Row>
      <Row label="indeterminate"><Progress label="Reconciling with the historian" /></Row>
      <Row label="spinner"><Progress variant="spinner" label="Checking line status" /></Row>
      <Row label="run it"><div style={{display:'flex',gap:8,alignItems:'center'}}>
        <Button size="sm" variant="secondary" onClick={()=>{setPct(0);setDone(false);setRunning(true)}} loading={running}>{running?'Exporting':'Start export'}</Button>
        {done && <Text size="xs" tone="success">Export finished — the bar is gone, a Toast says so.</Text>}
      </div></Row>
    </div>
  </Sec>

  <Sec n="02" title="Anatomy" note="A track, an indicator, and words that outlive the animation.">
    <div className="demo col">
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {[['1','Label — what is running, above the track at --text-xs. Not decoration: reduced motion stops the animation dead, so these words are sometimes the only cue that anything is happening.'],
          ['2','Value (optional, determinate only) — the percentage, mono and tabular, on the opposite end of the label row. OUTSIDE the track, always: text inside a 4px bar is unreadable, and a bar tall enough to hold it is a chart.'],
          ['3','Track — --progress-track (--surface-sunken) at --radius-full, 2px or 4px tall, full width of its container.'],
          ['4','Indicator — --progress-indicator (--action-solid). One colour, no tones (§04).'],
          ['5','Indeterminate segment — the indicator at --progress-indeterminate-width (40%), travelling across the track. Wide enough to read as one object crossing, narrow enough that the track stays visible.'],
          ['6','Spinner — a bordered circle with one coloured arc, 14/16/20px on the icon scale. One element, no SVG.']].map(([n,t])=>(
          <div className="callout" key={n}><span className="cnum">{n}</span><Text size="xs">{t}</Text></div>
        ))}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:16,width:'100%',maxWidth:420}}>
        <Progress label="Rebuilding routing index" value={64} showValue />
        <Progress label="Awaiting PLC handshake" />
        <Progress variant="spinner" size="md" label="Saving" />
      </div>
    </div>
    <p>There is no icon, no title, no percentage-in-the-bar, no step counter and no cancel button. A cancel action beside a progress bar is a <code>Button</code> the product lays out — putting it inside the component would make every progress indicator look cancellable, including the ones that are not.</p>
  </Sec>

  <Sec n="03" title="Properties" note="Six, and the important one is whether value exists at all.">
    <T cols={['Prop','Type','Default','Notes']} rows={[
      ['value','number','—','0–100. OMIT for indeterminate: the duration is unknown, which is not the same as zero. Out-of-range warns and clamps.'],
      ['variant','\u2018bar\u2019 | \u2018spinner\u2019','bar','A spinner is a short unmeasurable wait inline or beside a control; passing value to one warns (§04).'],
      ['size','\u2018sm\u2019 | \u2018md\u2019 | \u2018lg\u2019','md','Bar: 2px (sm) / 4px (md). Spinner: 14 / 16 / 20px, on the icon scale. lg is spinner-only.'],
      ['label','ReactNode','—','What is running. Required in practice; warns when missing.'],
      ['showValue','boolean','false','Determinate bars only. Renders the percentage beside the label, never inside the track.'],
      ['style','CSSProperties','—','Layout only — width comes from the container.'],
    ]}/>
    <p className="warn">There is no <code>tone</code>, no <code>striped</code>, no <code>animated</code>, no <code>buffer</code>, no <code>steps</code> and no <code>indeterminate</code> boolean. The absence of <code>value</code> <em>is</em> the indeterminate flag, so the two cannot contradict each other — a component with both can be handed <code>indeterminate={'{false}'}</code> and no value, and then has to invent an answer.</p>
    <div className="demo col">
      <Row label="value"><div style={{display:'flex',flexDirection:'column',gap:12,width:'100%'}}>
        {[['Queued',0],['Reading rows',12],['Writing CSV',50],['Compressing',88],['Uploading',100]].map(([l,v])=><Progress key={v} label={l} value={v} showValue />)}
      </div></Row>
    </div>
  </Sec>

  <Sec n="04" title="Variants" note="Two shapes, one meaning — and two refusals that matter.">
    <T cols={['Variant','Reports','Use','Never']} rows={[
      ['bar, determinate','How far through a measurable task.','Exports, imports, batch reconciliation, file upload — anything with a countable denominator.','With a number the product cannot actually compute (§12).'],
      ['bar, indeterminate','That work is in flight, duration unknown.','A request with no progress events; a job queued behind others.','As a permanent decoration on a page that is not loading.'],
      ['spinner','The same as an indeterminate bar, in a space too small for one.','Inline beside a row, a field, a status; in a panel header.','With a value — a ring reporting a percentage is a chart. It warns.'],
    ]}/>
    <div className="demo col">
      <Row label="bar sizes"><div style={{display:'flex',flexDirection:'column',gap:12,width:'100%'}}>
        <Progress label="sm · 2px" size="sm" value={46} />
        <Progress label="md · 4px" size="md" value={46} />
      </div></Row>
      <Row label="spinners"><div style={{display:'flex',gap:20,alignItems:'center'}}>
        <Progress variant="spinner" size="sm" label="sm" />
        <Progress variant="spinner" size="md" label="md" />
        <Progress variant="spinner" size="lg" label="lg" />
      </div></Row>
    </div>
    <p><strong>No tones, and this is the load-bearing refusal.</strong> A progress bar has one indicator colour because a coloured bar is how a <em>level</em> disguises itself as a task: green-at-90 %, red-at-20 % is a gauge's vocabulary, and the moment the component offers it, every OEE and utilisation figure in the console arrives wearing a progress bar. Severity belongs to an <code>Alert</code> beside the work, or to a <code>Badge</code> on the record — never to the indicator, which is only reporting how far along something is.</p>
    <p><strong>No circular determinate ring either.</strong> A ring that shows 64 % needs a number in its middle to be read at all, which means a diameter no console row has, and it competes with the charts around it. The bar reads at 2px; the ring does not read at 20px.</p>
  </Sec>

  <Sec n="05" title="Sizes" note="Two bar heights and three spinner sizes, all borrowed scales.">
    <T cols={['Size','Bar','Spinner','Use']} rows={[
      ['sm','2px','14px','Page-level: a hairline bar under the topbar; inline in a table row or a --text-xs status line.'],
      ['md','4px','16px','Default. Inside a card, a drawer or a dialog, where the bar is the subject of the region.'],
      ['lg','—','20px','Spinner only: an empty panel or a dialog body waiting on its content.'],
    ]}/>
    <div className="demo col">
      <div className="frame">
        <div className="top"><span>Meridian · Tilburg</span><span style={{fontFamily:'var(--font-mono)',fontSize:'var(--text-2xs)'}}>06:00–14:00</span></div>
        <div style={{padding:0}}><Progress size="sm" aria-label="Loading the plant overview" /></div>
        <div style={{padding:'16px 14px',display:'flex',flexDirection:'column',gap:10}}>
          <Skeleton width="40%" /><Skeleton lines={2} />
        </div>
      </div>
      <Text size="xs" tone="tertiary">The 2px page-level bar sits flush under the frame's own hairline — no radius visible at that height, and no label, because the region it names is the whole page (§08 covers when that is legitimate).</Text>
    </div>
    <p>The bar has no <code>lg</code>. A 6 or 8px bar is a chart bar: at that weight it stops reading as a system indicator and starts inviting comparison with the data around it, which is exactly the confusion §04 refuses tones to avoid. Width always comes from the container — there is no <code>width</code> prop, because a progress bar that is narrower than the thing it describes reads as belonging to something else.</p>
  </Sec>

  <Sec n="06" title="States" note="Three, and two of them are the product's job, not the component's.">
    <T cols={['State','What renders','Whose job']} rows={[
      ['In flight, measurable','A determinate bar, advancing as real values arrive.','The product owns value.'],
      ['In flight, unmeasurable','An indeterminate bar or spinner, plus words.','—'],
      ['Complete','NOTHING. The indicator unmounts and the result takes its place — the table, the file, a Toast.','The product. A bar sitting at 100 % is the most common way a finished job looks unfinished.'],
      ['Failed','An Alert with what failed and a retry. The bar does not turn red and does not stay.','The product. §04 — the indicator has no failure vocabulary, deliberately.'],
      ['Paused / queued','An indeterminate bar with a label that says so ("Queued behind 2 jobs"), or no indicator and a status line.','The product. There is no paused state: a frozen determinate bar is indistinguishable from a hung one.'],
      ['Value unknown mid-task','Switch to indeterminate by dropping value.','The product. Better an honest "working" than a number that stops moving.'],
    ]}/>
    <div className="demo col">
      <Row label="complete"><div style={{display:'flex',flexDirection:'column',gap:10,width:'100%'}}>
        {done ? <Alert tone="success" title="Export ready" body="1,284 work orders · CSV" /> : <Progress label="Exporting work orders" value={pct} showValue />}
        <Text size="xs" tone="tertiary">{done ? 'The indicator is gone, not parked at 100 %.' : 'Run the export in §01 to watch it resolve.'}</Text>
      </div></Row>
      <Row label="failed"><Alert tone="danger" title="Export failed" body="The historian did not respond. Nothing was written." /></Row>
    </div>
  </Sec>

  <Sec n="07" title="Keyboard" note="Not applicable — it is output, and the reason is worth stating.">
    <p>A progress indicator is not focusable, not tabbable and answers no key. It reports; it takes nothing. A focusable bar would put a tab stop in the path of a keyboard user for the duration of the work and then remove it, changing the tab order under their hands mid-task.</p>
    <ul>
      <li><strong>The affordances around it are the controls.</strong> Cancel, Retry and Dismiss are real <code>Button</code>s beside the indicator — reachable, named, and present only when they do something.</li>
      <li><strong>A control that <em>looks</em> like a progress bar and takes input is a <code>Slider</code></strong>, which shipped at 1.23.0: a real <code>role="slider"</code> with arrow keys, and it does <em>not</em> borrow these tokens — it carries its own <code>--slider-*</code> group, because identical geometry with opposite semantics is how a report becomes a control by accident.</li>
      <li><strong>Focus is not moved on completion.</strong> The result is announced (§08) and the user's focus stays where they put it — moving it is the failed-submit anti-pattern <code>Alert</code> §08 already refuses.</li>
      <li><strong>Do not disable the page while it runs.</strong> If the work blocks everything, that is a <code>Dialog</code> with the indicator inside it; a bar does not earn a scrim.</li>
    </ul>
  </Sec>

  <Sec n="08" title="Accessibility" note="role=progressbar, a real name, and no aria-valuenow when the value is unknown.">
    <ul>
      <li><strong><code>role="progressbar"</code>,</strong> with <code>aria-valuemin</code>/<code>max</code>/<code>now</code> and a <code>aria-valuetext</code> of "n %" <em>only</em> when determinate.</li>
      <li><strong>Indeterminate omits <code>aria-valuenow</code> entirely</strong> — that omission is precisely what tells assistive technology the duration is unknown. Passing 0 there announces "0 percent" for the whole job, which reads as stuck.</li>
      <li><strong>A name is required and warns when missing.</strong> An unnamed progressbar announces as "progress bar, busy" with no subject; on a page with two of them, the user cannot tell which is which.</li>
      <li><strong>The name is <code>aria-labelledby</code> pointing at the rendered label</strong> — never an <code>aria-label</code> copied from it when it happens to be a string. A formatted label would then display correctly and name nothing, <em>and</em> suppress the missing-name warning, because a label was in fact passed. That is the exact defect <code>Dialog</code> shipped until 1.12.0 (§13).</li>
      <li><strong>The words are not optional in the design sense either.</strong> Reduced motion stops both loops dead (§09), so an indeterminate indicator can be visually static — the label is then the only remaining signal. This is the rule <code>motion.css</code> has carried since 1.0.0: a spinner may never be the only sign that work is happening.</li>
      <li><strong>Put <code>aria-busy</code> on the region,</strong> not on the bar. The bar says how far; the region says it is working — the same split <code>Skeleton</code> §08 documents.</li>
      <li><strong>Never <code>role="alert"</code>, and never an assertive live region.</strong> Progress is not an error, and a bar that announces every increment is unusable — <code>aria-valuenow</code> updates are polled by the screen reader, not shouted.</li>
      <li><strong>Announce the outcome once,</strong> through the region's own <code>role="status"</code> or a <code>Toast</code>: "Export ready". Silence on completion is the other half of the "parked at 100 %" defect.</li>
      <li><strong>The indicator is decorative</strong> (<code>aria-hidden</code>) — the value is on the element with the role, so the two cannot drift.</li>
      <li><strong>Contrast:</strong> the indicator carries no text and no meaning beyond position, so it is exempt from 1.4.3 — but it must remain visible, which is why the track is <code>--surface-sunken</code> and the indicator <code>--action-solid</code> rather than a tint of it.</li>
    </ul>
  </Sec>

  <Sec n="09" title="Motion" note="Two loops, both pre-existing, both stoppable — which is why words are mandatory.">
    <T cols={['Moment','Motion','Tokens']} rows={[
      ['Determinate advancing','width transition over --duration-base, eased out. Never a transform: a scaled bar with a radius distorts its own end caps.','--duration-base · --ease-out'],
      ['Indeterminate','A 40% segment crossing the track, 1.1s, in-out, looping. Defined at 1.0.0 and unconsumed until now.','--anim-indeterminate'],
      ['Spinner','800ms linear rotation. Linear, never eased — an eased spinner reads as struggling.','--anim-spin'],
      ['Completion','No fill-to-100 flourish. The indicator unmounts when the work ends (§06).','—'],
      ['Reduced motion','Both loops stop dead: durations collapse to 1ms and iteration-count to 1. A determinate bar still jumps to its true value.','prefers-reduced-motion'],
    ]}/>
    <p>These are two of the system's three permitted loops — the third is <code>Skeleton</code>'s sweep — and they carry the same condition: they run only while work is genuinely in flight. A spinner left mounted after a fetch resolves is a page that looks broken while being complete.</p>
    <p className="warn"><strong>Nothing pulses, nothing stripes, nothing shimmers.</strong> A striped bar that animates while the value is static is the single most common dishonest progress pattern: the motion says "moving" while the number says "stopped", and the user believes the motion. If the work has stalled, the honest rendering is a stalled bar plus words that say so — or an <code>Alert</code>.</p>
  </Sec>

  <Sec n="10" title="Content Rules" note="Name the work in the present participle, and never promise a time.">
    <div className="two">
      <div className="pane do"><h3>Do</h3><ul>
        <li><strong>"Exporting work orders"</strong> — present participle, the object named.</li>
        <li><strong>Say what is queued</strong> when it is: "Queued behind 2 jobs".</li>
        <li><strong>Percentages as integers,</strong> mono and tabular. No decimals — 41.7 % implies a precision the work does not have.</li>
        <li><strong>Counts where they are more honest than a percentage:</strong> "1,284 of 3,000 rows" as the label, with the bar carrying the ratio.</li>
        <li><strong>One sentence on completion,</strong> in the result, not in the bar.</li>
      </ul></div>
      <div className="pane dont"><h3>Don't</h3><ul>
        <li><strong>"Loading…"</strong> alone. Loading what? It is the label equivalent of an unnamed bar.</li>
        <li><strong>Time estimates</strong> — "about 30 seconds left". They are almost always wrong, and a wrong estimate costs more trust than no estimate.</li>
        <li><strong>"Please wait".</strong> The indicator already says that; the words should say what is happening.</li>
        <li><strong>Exclamation marks or reassurance.</strong> "Almost there!" is not a fact.</li>
        <li><strong>A percentage in the label AND showValue.</strong> One number, one place.</li>
        <li><strong>Step counters as the label</strong> ("Step 3 of 7") on a bar that measures bytes. Two denominators, one indicator.</li>
      </ul></div>
    </div>
  </Sec>

  <Sec n="11" title="Responsive" note="It is a percentage of its container. That is the whole story.">
    <ul>
      <li><strong>The bar fills its container</strong> — no <code>width</code> prop, no breakpoints. A bar narrower than the thing it describes reads as belonging to something else.</li>
      <li><strong>The label row wraps before it truncates:</strong> label and value sit at opposite ends of a flex row with the value <code>flex: none</code>, so at narrow widths the label wraps and the percentage stays whole. A truncated "Exporti…" with an intact "38 %" is the wrong thing to keep.</li>
      <li><strong>Under ~200px, drop <code>showValue</code></strong> and let the label carry the number, or use a spinner. Two numbers in a 180px row is a row nobody reads.</li>
      <li><strong>The page-level bar is 2px at every breakpoint,</strong> flush under the topbar. It does not thicken on touch — it is not a target.</li>
      <li><strong>Density does not apply.</strong> Heights are fixed at 2 and 4px because they are hairline system indicators, not control geometry; a 2px bar at <code>expanded</code> is still the right 2px.</li>
      <li><strong>Spinners ride the icon scale,</strong> so they match the 14/16/20px glyphs beside them at any density.</li>
    </ul>
    <div className="demo col">
      <div style={{maxWidth:220,border:'var(--border-hairline)',borderRadius:'var(--radius-sm)',padding:12}}>
        <Progress label="Rebuilding routing index" value={38} showValue />
      </div>
      <Text size="xs" tone="tertiary">220px: the label wraps to two lines, the value stays intact.</Text>
    </div>
  </Sec>

  <Sec n="12" title="Anti Patterns" note="Every serious one is a lie about what the number means.">
    <div className="two">
      <div className="pane dont"><h3>Dishonest</h3><ul>
        <li><strong>Fake progress.</strong> A bar eased toward 90 % on a timer, waiting for the real answer. It is a lie with a progress indicator's authority, and it is why users distrust the ones that are real.</li>
        <li><strong>A gauge wearing a progress bar.</strong> OEE 82 %, tank 60 %, disk 91 % — nothing is finishing. Those are charts or <code>role="meter"</code>; this component's tokens must not be borrowed for them (§13).</li>
        <li><strong>A bar parked at 100 %.</strong> The most common way a finished job looks unfinished. Unmount it.</li>
        <li><strong>A striped animation over a static value.</strong> §09. The motion says moving, the number says stopped, and the user believes the motion.</li>
        <li><strong>Time remaining.</strong> §10.</li>
      </ul></div>
      <div className="pane dont"><h3>Misapplied</h3><ul>
        <li><strong>On a sub-200ms wait.</strong> A flash of indicator is worse than the wait.</li>
        <li><strong>Two indicators for one wait</strong> — a page bar and a card spinner for the same fetch. One wait, one indicator.</li>
        <li><strong>Inside a Button.</strong> <code>Button loading</code> owns that, spinner included.</li>
        <li><strong>Instead of a Skeleton.</strong> If the incoming shape is known, holding the layout is worth more than reporting the wait.</li>
        <li><strong>As a step indicator</strong> for a wizard. Steps are navigation with state, not work in flight.</li>
        <li><strong>Unnamed.</strong> §08 — it warns.</li>
      </ul></div>
    </div>
    <p className="warn"><strong>The boundary to police hardest in this product: a plant console is mostly levels.</strong> OEE, utilisation, scrap rate, tank level, shift attainment — all percentages, all begging for a bar, none of them progress. The test is one question: <em>will this reach 100 % and then stop existing?</em> An export will. A line's OEE will not; it will sit at 82 % all shift, and a progress bar tells the operator to wait for something that is never going to arrive. Levels are chart geometry (<code>--viz-*</code>) with their own axis and their own thresholds — and where a threshold matters, colour is theirs to use, because they have a target to be measured against. Progress has only a finish line.</p>
  </Sec>

  <Sec n="13" title="Implementation Notes" note="New in 1.20.0 — and one two-year-old defect it uncovered.">
    <ul>
      <li><strong>Shipped on evidence, in the house pattern.</strong> Two specs had deferred to it by name — <code>Skeleton</code> §01 ("long, or of unknown duration → a progress bar") and <code>Table</code>'s loading treatment — and <code>--anim-indeterminate</code> had been defined in <code>motion.css</code> since 1.0.0 with <em>nothing consuming it</em>: the same signature as <code>mer-slide-in-right</code> before <code>Drawer</code>. A keyframe with no consumer is a component the system already decided it wanted.</li>
      <li><strong>One component, two shapes, deliberately.</strong> A separate <code>Spinner</code> would duplicate the <code>progressbar</code> role, the naming warning and the reduced-motion rule, and products would choose between them by feel — the reasoning that resolved "Modal" into <code>Dialog</code> at 1.12.0. The shapes differ; the semantics do not.</li>
      <li><strong>The absence of <code>value</code> IS the indeterminate flag.</strong> No boolean, so the two can never contradict each other. A component carrying both can be handed <code>indeterminate={'{false}'}</code> with no value and has to invent an answer.</li>
      <li><strong>Determinate animates <code>width</code>, not <code>transform</code>.</strong> A transform-scaled bar with <code>--radius-full</code> distorts its own end caps as it grows, and the system's "never animate layout" rule is about <em>large</em> layout: a 4px bar's width is one line of the compositor's work, and the alternative is visibly wrong.</li>
      <li><strong>The spinner is a bordered circle, not an SVG.</strong> One element, one border, one <code>borderTopColor</code>: no viewBox, no stroke-dasharray, nothing to re-measure, and it inherits size from a token rather than from a coordinate space.</li>
      <li><strong><code>aria-valuenow</code> is omitted, not zeroed, when indeterminate</strong> (§08) — the single most common ARIA error in this component class.</li>
      <li><strong>Two warnings:</strong> no accessible name, and a <code>value</code> outside 0–100 (clamped, because rendering a 140 % bar is worse than reporting the bug). Plus one for <code>variant="spinner"</code> with a <code>value</code>, which is the "ring reporting a percentage" case from §04.</li>
      <li><strong>The accessible name comes from the label ELEMENT.</strong> The first draft did what <code>Dialog</code> did until 1.12.0 — <code>aria-label</code> taken from <code>label</code> only when it was a plain string — so a formatted label rendered on screen, named nothing, and <em>silenced the missing-name warning</em>, because a label had been passed. Now the label span carries a <code>useId</code> id and the bar points <code>aria-labelledby</code> at it, with <code>aria-label</code> only as the no-visible-label route. The general lesson, twice learned in this system: <strong>a name derived from a prop's type is a name that works until someone formats it.</strong></li>
      <li><strong>14 tokens, no new keyframes.</strong> Both animations already existed; this component is the first consumer of one of them.</li>
      <li><strong>No tones, no <code>lg</code> bar, no ring, no buffer, no steps, no stripes.</strong> Each refusal is in §04, §05 or §09 with its reason — and all but one exist to stop a level from borrowing a task's vocabulary.</li>
    </ul>
    <div className="tokenlist">
      {['--progress-track','--progress-indicator','--progress-radius','--progress-height-sm','--progress-height-md','--progress-indeterminate-width','--progress-label-text','--progress-value-text','--progress-spinner-track','--progress-spinner-indicator','--progress-spinner-width','--progress-spinner-size-sm','--progress-spinner-size-md','--progress-spinner-size-lg'].map(t=><span key={t}>{t}</span>)}
    </div>
    <p className="warn"><strong>Found on the way in: <code>Button</code>'s loading spinner never span.</strong> It rendered <code>loader-circle</code> with a hard-coded <code>animation: 'none'</code>, so every loading button in the system since 1.0.0 showed a <em>static</em> glyph — which reads as a decorative icon, leaving a pressed, disabled button with no indication that anything was happening. It is the exact defect this component's §08 is about (a loading state whose only cue is silent), shipped by the system's most-used control for twenty minor versions, and invisible in review because a still screenshot of a spinner and a still screenshot of a stuck spinner are the same image. Now <code>var(--anim-spin)</code>.</p>
  </Sec>

  <Sec n="14" title="Developer Notes" note="Wiring it to real work.">
    <pre>{`import { Progress } from '@meridian/feedback';

// Determinate: the number comes from the work, never from a timer.
const { done, total, error } = useExport();

if (error) return <Alert tone="danger" title="Export failed" body={error.message} />;
if (done === total) return <Alert tone="success" title="Export ready" />;

<Progress label={\`Exporting \${done.toLocaleString()} of \${total.toLocaleString()} rows\`}
          value={(done / total) * 100} showValue />

// Indeterminate: drop value. Do not pass 0.
<Progress label="Reconciling with the historian" />

// If the value stops being knowable mid-task, drop it — an honest
// "working" beats a number that has stopped moving.
<Progress label="Uploading" value={bytesKnown ? pct : undefined} />

// Page level: 2px, flush under the topbar, named for the region.
{routeLoading && <Progress size="sm" aria-label="Loading the page" />}

// The region says it is busy; the bar says how far.
<section aria-busy={running || undefined}>
  {running && <Progress label="Rebuilding routing index" value={pct} />}
  …
</section>`}</pre>
    <ul>
      <li><strong>Unmount it when the work ends.</strong> Do not leave it at 100 %; render the result and announce it once (a <code>Toast</code> if the surface has gone).</li>
      <li><strong>Do not gate the indicator on a delay</strong> the way you would a <code>Skeleton</code>. If a wait is long enough for a progress bar, it is long enough to show one immediately — but if it might resolve in 200ms, show nothing at all.</li>
      <li><strong>Throttle updates to ~10/s.</strong> A bar re-rendering on every byte event costs frames and announces nothing extra; the screen reader polls the value, it does not receive each one.</li>
      <li><strong>Never animate the value backwards.</strong> If a total is revised upward mid-task, hold the bar and change the label — a bar going back reads as work being undone.</li>
      <li><strong>One indicator per wait,</strong> and put it where the result will appear.</li>
      <li><strong>Do not reuse these tokens for a gauge.</strong> An OEE bar built from <code>--progress-*</code> inherits the semantics with the styling, and the next person to touch it will wire a <code>progressbar</code> role to a number that never finishes (§12).</li>
      <li><strong>Testing hooks:</strong> <code>getByRole('progressbar', {'{ name: \'Exporting work orders\' }'})</code>; assert <code>aria-valuenow</code> for determinate and its <em>absence</em> for indeterminate. <code>[data-progress="bar|indeterminate|spinner"]</code> identifies the form.</li>
    </ul>
  </Sec>
</div>
);}
