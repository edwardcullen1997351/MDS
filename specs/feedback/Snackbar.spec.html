<script type="text/babel">
const { Snackbar, Toast, Button, IconButton, Text, Table } = window.MeridianDesignSystem_962c43;

const Sec = ({n,title,note,children}) => (
  <section>
    <div className="sec-head"><span className="num">{n}</span><h2>{title}</h2>{note?<span className="sec-note">{note}</span>:null}</div>
    <div className="body">{children}</div>
  </section>
);
const T = ({cols,rows}) => (
  <table><thead><tr>{cols.map((c,i)=><th key={i}>{c}</th>)}</tr></thead>
  <tbody>{rows.map((r,i)=><tr key={i}>{r.map((c,j)=><td key={j} className={j===0?'k':''}>{c}</td>)}</tr>)}</tbody></table>
);

/* A stand-in for the surface a snackbar belongs to: a table of lines, with
   the bar anchored inside it rather than in the corner of the window. */
function LineStage({children,height=200}){
  return (
    <div className="stage" style={{minHeight:height}}>
      <div className="fakehead">Lines · Assembly</div>
      {[['L1 · Frame weld','Running'],['L2 · Paint','Running'],['L3 · Trim','Changeover'],['L4 · Final','Held']].map(([a,b])=>(
        <div className="fakerow" key={a}><span>{a}</span><span className="mono" style={{color:'var(--text-tertiary)'}}>{b}</span></div>
      ))}
      {children}
    </div>
  );
}

function Spec(){
  const [held, setHeld] = React.useState(null);
  const [sizeDemo, setSizeDemo] = React.useState(true);
  const [attached, setAttached] = React.useState(true);
  const [persist, setPersist] = React.useState(false);
  const [pageBar, setPageBar] = React.useState(false);
  const [seq, setSeq] = React.useState(0);

return (
<div className="page">
  <div className="masthead">
    <span className="eyebrow">Feedback · Component specification</span>
    <h1>Snackbar</h1>
    <p className="lede">One line of text and one action, anchored to the bottom of the surface that raised it. Where a toast is global, queued and raised imperatively from code with no component in scope, a snackbar belongs to a panel, a table or an editor — that surface owns its open state, only one exists at a time, and a new message replaces the old one. It carries no tone, no icon and no title: it is the shortest possible confirmation with the shortest possible way back.</p>
    <div className="meta">
      <span>components/feedback/Snackbar.jsx</span><span>window.MeridianDesignSystem_962c43.Snackbar</span><span style={{color:'var(--text-primary)'}}>status: frozen 5 Sep 2026 · 0 open items</span><span>since: 1.10.0</span><span>14 tokens · --z-snackbar (690)</span>
    </div>
  </div>

  <Sec n="01" title="Purpose" note="Confirmation where the work happened — with the way back attached.">
    <p>Use a snackbar when the user changes something <strong>inside a surface they are still looking at</strong> and the change is reversible. The bar appears at the bottom of that surface, says what happened in one clause, and offers the single action that undoes or completes it. Because it is scoped, it never has to explain where it came from — proximity does that.</p>
    <T cols={['You want to…','Component','Why']} rows={[
      ['Confirm a reversible change inside a panel or table','Snackbar','This component. The surface is in view; the bar sits on it.'],
      ['Confirm something whose result is off-screen','Toast','A corner notice with a tone, a title and a queue.'],
      ['Report a failure the user must not miss','Toast, tone="danger"','Persistent, tone-carrying, and never scoped to a surface that may unmount.'],
      ['Show a field is invalid','Field error','Errors live beside their input, permanently.'],
      ['Take a decision before continuing','Dialog','A snackbar has one action and no way to take an answer.'],
      ['Announce a standing condition','An inline banner','"Two lines are down" is state. State does not expire.'],
      ['Offer bulk actions for a selection','A selection toolbar','Several actions, held as long as the selection exists — not a snackbar.'],
    ]}/>
    <ul>
      <li><strong>Undo is the canonical use.</strong> Delete a row, hold a line, archive a work order: the bar is where the reversal lives for the few seconds it is cheap.</li>
      <li><strong>One per scope, always.</strong> The component does not stack, and the surface that owns it should not try to.</li>
      <li><strong>Do not use it for anything the user must read.</strong> One truncating line and six seconds is not a place to explain.</li>
      <li><strong>Do not use it in a surface that disappears.</strong> If the panel closes on save, the confirmation belongs to whatever remains — a toast.</li>
    </ul>
    <div className="demo col">
      <LineStage>
        <Snackbar open={!!held} message={held ? `${held} held` : ''} onDismiss={()=>setHeld(null)}
          action={<Button variant="link" size="sm" onClick={()=>setHeld(null)}>Undo</Button>} />
      </LineStage>
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
        <Button variant="secondary" onClick={()=>setHeld('L4 · Final')}>Hold L4</Button>
        <Button variant="secondary" onClick={()=>setHeld('L3 · Trim')}>Hold L3 (replaces)</Button>
        <Button variant="ghost" onClick={()=>setHeld(null)}>Clear</Button>
      </div>
      <Text size="xs" tone="tertiary">Holding a second line replaces the message in place and restarts the timer. There is never a second bar.</Text>
    </div>
  </Sec>

  <Sec n="02" title="Anatomy" note="A line of text, one action, one dismiss. Nothing else.">
    <div className="demo col">
      <LineStage height={170}>
        <Snackbar open message="Work order WO-88431 archived" onDismiss={()=>{}}
          action={<Button variant="link" size="sm">Undo</Button>} />
      </LineStage>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {[['1','Region — a persistent role="status" aria-live="polite" element, mounted whether or not the bar is open, positioned against the nearest positioned ancestor (scope="container") or the viewport (scope="page"). pointer-events: none, so the surface underneath stays fully usable.'],
          ['2','Bar — --snackbar-background on --elevation-2, --radius-sm, --border-strong hairline. Lower and tighter than a toast on purpose: it is furniture on a surface, not a floating card.'],
          ['3','Message — one clause, --text-sm, --snackbar-text at full strength. Truncates with an ellipsis; it never wraps.'],
          ['4','Action — at most one Button variant="link", size sm. Undo, Retry, View. Two actions means it is a Dialog.'],
          ['5','Dismiss — a ghost IconButton labelled "Dismiss", present unless the bar cannot be dismissed by hand (§03).'],
          ['6','Width — content width up to --snackbar-max-width (560px); full width when attached. Wider than a toast because the text is one line and must fit.'],
          ['7','Inset — --snackbar-inset (16px) from the surface\u2019s bottom and side edges when floating; zero when attached.']].map(([n,t])=>(
          <div className="callout" key={n}><span className="cnum">{n}</span><Text size="xs">{t}</Text></div>
        ))}
      </div>
    </div>
    <p>There is <strong>no icon and no tone tint</strong>. A bar whose entire content is "…archived" plus "Undo" gains nothing from a green tick, and a red bar across the bottom of a plant console collides with the alarm colours in the data above it. It is also <strong>not inverted</strong>: <code>--surface-inverse</code> belongs to Tooltip, and two inverted surfaces near the same edge read as one layer.</p>
  </Sec>

  <Sec n="03" title="Properties" note="Declarative and singular. No store, no queue, no imperative API.">
    <T cols={['Prop','Type','Default','Notes']} rows={[
      ['open','boolean','false','The owning surface holds this. There is no internal open state.'],
      ['message','ReactNode','—','One clause. Truncates rather than wrapping (§10).'],
      ['action','ReactNode','—','One link Button. Its handler normally also closes the bar.'],
      ['onDismiss','() => void','—','Called by the timer and the dismiss button. Without it there is no auto-dismiss and no dismiss control.'],
      ['duration','number | null','6000','Milliseconds, or null to persist. Restarts whenever message changes.'],
      ['size','\u2018sm\u2019 | \u2018md\u2019','md','sm (36px) for dense panels and drawers; md (44px) everywhere else.'],
      ['scope','\u2018container\u2019 | \u2018page\u2019','container','container ⇒ absolute against the nearest positioned ancestor. page ⇒ fixed at --z-snackbar.'],
      ['placement','\u2018floating\u2019 | \u2018attached\u2019','floating','attached is flush on the bottom edge: no radius, no shadow, a single top hairline.'],
      ['align','\u2018center\u2019 | \u2018start\u2019','center','start for wide surfaces where centre lands far from the control that was pressed.'],
      ['dismissible','boolean','true','false removes the dismiss button — legal only when the bar expires on its own.'],
    ]}/>
    <p>The absence of a <code>Snackbar.show()</code> is the design. A toast is raised by code that has no component in scope, which is why it needs a module-level store; a snackbar is raised by the surface the user is standing on, and that surface already has state. Giving it a global API would immediately produce two bars in two panels racing for the same edge.</p>
    <p>Mount it inside a container with <code>position: relative</code>. In <code>container</code> scope the bar is positioned, not in flow, so it never changes the height of the panel it sits in — and it clips to the panel's <code>overflow</code>.</p>
  </Sec>

  <Sec n="04" title="Variants" note="Two placements, two scopes. No tones.">
    <div className="demo col">
      <LineStage height={190}>
        <Snackbar open={attached} placement="attached" message="3 rows imported, 1 skipped" onDismiss={()=>setAttached(false)}
          action={<Button variant="link" size="sm">View skipped</Button>} duration={null} />
      </LineStage>
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
        <Button variant="secondary" onClick={()=>setAttached(v=>!v)}>Toggle attached bar</Button>
        <Button variant="secondary" onClick={()=>setPageBar(true)}>Show page-scope bar</Button>
      </div>
      <Snackbar open={pageBar} scope="page" message="Shift handover recorded" onDismiss={()=>setPageBar(false)}
        action={<Button variant="link" size="sm" onClick={()=>setPageBar(false)}>View log</Button>} />
    </div>
    <T cols={['Variant','Geometry','Use']} rows={[
      ['floating (default)','Inset 16px from the surface edges, radius, --elevation-2','A bar over content: tables, canvases, lists. It reads as temporary because it is detached.'],
      ['attached','Flush, full width, square, one top hairline, no shadow','Drawers, side panels, editors — anywhere the surface has a real bottom edge to sit on. It reads as part of the panel, which is right when the message is about that panel\u2019s work.'],
      ['scope="container"','Absolute inside the nearest positioned ancestor','The default and the honest case: the message is about that surface.'],
      ['scope="page"','Fixed, bottom-centre of the viewport, --z-snackbar (690)','Page-level reversals — "Layout reset", "Filters cleared". Below --z-toast so a toast stays legible over it.'],
      ['align="start"','Left edge instead of centre','Wide tables, where a centred bar can be a metre from the row the user just changed.'],
    ]}/>
    <ul>
      <li><strong>No tone variants, at all.</strong> Tone means a colour, a colour means an icon, and an icon means a title — at which point you have rebuilt Toast at the wrong end of the screen.</li>
      <li><strong>No loading variant.</strong> A bar that says "Saving…" with no way out is a progress indicator; put that on the control that started the work.</li>
      <li><strong>Never both a page-scope and a container-scope bar at once.</strong> Two bars on one bottom edge is the single most common review rejection for this component.</li>
    </ul>
  </Sec>

  <Sec n="05" title="Sizes" note="Two heights, one line of text each.">
    <T cols={['Token','sm','md','Notes']} rows={[
      ['Min height','--snackbar-height-sm · 36px','--snackbar-height-md · 44px','md meets the 44px target minimum; sm is for dense panels where the dismiss button is not the only way out.'],
      ['Text','--text-xs','--text-sm','Both at full-strength --snackbar-text. Never secondary: this is the only text in the component.'],
      ['Leading padding','--snackbar-padding-sm · 12px','--snackbar-padding-md · 16px','Trailing padding is tighter, because the dismiss IconButton carries its own.'],
      ['Gap','--snackbar-gap · 16px','--snackbar-gap · 16px','Between message and action. Wide enough that Undo does not read as part of the sentence.'],
      ['Max width','--snackbar-max-width · 560px','--snackbar-max-width · 560px','Floating only. Attached bars take the container width.'],
      ['Inset','--snackbar-inset · 16px','--snackbar-inset · 16px','Floating only.'],
    ]}/>
    <div className="demo col">
      <LineStage height={150}>
        <Snackbar open={sizeDemo} size="sm" message="Filter cleared" onDismiss={()=>setSizeDemo(false)}
          action={<Button variant="link" size="sm" onClick={()=>setSizeDemo(false)}>Undo</Button>} duration={null} />
      </LineStage>
      <div style={{display:'flex',gap:10}}>
        <Button variant="ghost" size="sm" onClick={()=>setSizeDemo(v=>!v)}>Toggle sm bar</Button>
      </div>
      <Text size="xs" tone="tertiary">There is no lg. A taller bar needs a second line, and a second line is a Toast.</Text>
    </div>
  </Sec>

  <Sec n="06" title="States" note="About time and replacement, not interaction.">
    <T cols={['State','Treatment']} rows={[
      ['Closed','The region stays mounted and empty. Only the bar is conditional — a live region added at the same moment as its text announces unreliably.'],
      ['Entering','mer-rise-in over --duration-base: 8px up from the edge it belongs to, with opacity.'],
      ['Resting','Full opacity, no countdown, no shrinking bar. The timer is invisible on purpose (§09).'],
      ['Paused','Pointer inside the bar, or focus inside it, clears the timer. It is re-created on leave, so a paused bar gets a fresh full duration.'],
      ['Replaced','New message, same bar, in place. The timer restarts; the surface does not re-enter.'],
      ['Persistent','duration: null. For a reversal that must stay offered — an import summary, a destructive delete with a long window.'],
      ['Dismissed','Removed with no exit animation. The press should be the last thing that happens (§09).'],
      ['Truncated','A message longer than the bar ends in an ellipsis. It is not a tooltip target: shorten the copy instead (§10).'],
    ]}/>
    <div className="demo col">
      <LineStage height={170}>
        <Snackbar open={seq>0} message={`Row ${seq} deleted`} onDismiss={()=>setSeq(0)} duration={persist?null:6000}
          action={<Button variant="link" size="sm" onClick={()=>setSeq(0)}>Undo</Button>} />
      </LineStage>
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
        <Button variant="secondary" onClick={()=>setSeq(s=>s+1)}>Delete another row (replaces)</Button>
        <Button variant={persist?'primary':'ghost'} onClick={()=>setPersist(v=>!v)}>{persist?'Persistent: on':'Persistent: off'}</Button>
      </div>
      <Text size="xs" tone="tertiary">Hover the bar to hold its timer. Deleting again swaps the message without a second bar appearing.</Text>
    </div>
  </Sec>

  <Sec n="07" title="Keyboard" note="It does not take focus. Its action is reachable.">
    <T cols={['Key','Behaviour']} rows={[
      ['(on open)','Nothing. Focus stays where the user put it — usually the control that caused the change.'],
      ['Tab','Reaches the action then the dismiss button, in DOM order. Because the bar is mounted inside its surface, that order is local: the action is a few tabs from the row that raised it, not at the end of the document.'],
      ['Enter · Space','Activates the focused action or dismiss. Native buttons.'],
      ['Escape','Nothing. Escape belongs to the layer the user is working in; a bar that ate it would close the wrong thing. Dismiss is a button, deliberately.'],
      ['Focus inside','Clears the timer, so a keyboard user cannot lose the action they are tabbing towards.'],
    ]}/>
    <p>Container scope is what makes a snackbar's action genuinely reachable, and it is the main reason this component exists alongside Toast: an Undo three tabs from the row you just changed is usable; the same Undo in a fixed viewport at the end of the document is not. <strong>The rule still holds, though — never put an action in a snackbar that exists nowhere else.</strong> Undo must also be available from the record's history; Retry must also be on the panel that failed.</p>
    <div className="demo col">
      <LineStage height={160}>
        <Snackbar open duration={null} message="L2 · Paint held" onDismiss={()=>{}}
          action={<Button variant="link" size="sm">Undo</Button>} />
      </LineStage>
      <Text size="xs" tone="tertiary">Tab into the stage: the bar's Undo and Dismiss follow the surface's own content, and focusing either holds the timer.</Text>
    </div>
  </Sec>

  <Sec n="08" title="Accessibility" note="One polite region per scope, mounted for good.">
    <ul>
      <li><strong>The region is permanent, the bar is not.</strong> <code>role="status" aria-live="polite" aria-atomic="true"</code> is on a wrapper that renders whether or not the bar is open. A live region inserted into the DOM together with its text is announced inconsistently across screen readers; a standing region reads every replacement reliably.</li>
      <li><strong><code>aria-atomic</code> is on</strong> because the whole message is one clause — reading only the changed word out of "Row 3 deleted" is worse than reading it again.</li>
      <li><strong>Never assertive.</strong> A snackbar confirms something the user just did; interrupting their own screen reader to tell them so is noise. Anything that warrants interruption is a <code>danger</code> Toast, which is <code>role="alert"</code>.</li>
      <li><strong>Focus is never moved</strong> and there is no scrim, no trap, no <code>aria-modal</code>. The bar is not a layer the user is in.</li>
      <li><strong>The dismiss button has a real name</strong> ("Dismiss") and its icon is decorative. Since there is no tone icon at all, the words carry the entire message — which is also why the copy must name the object (§10).</li>
      <li><strong>Timing is WCAG 2.2.1.</strong> Pause-on-hover and pause-on-focus, the "no action that exists only here" rule, and <code>duration: null</code> for anything consequential are what make a six-second bar defensible. Raise <code>duration</code> rather than inventing a shortcut.</li>
      <li><strong>It must not cover the control that raised it.</strong> A bar over the row's own action buttons puts a 44px obstacle exactly where the user is pointing — use <code>attached</code>, or pad the container's bottom.</li>
      <li><strong>Contrast:</strong> message text is <code>--text-primary</code> on <code>--surface-overlay</code>, and the action is a link Button at full strength. Nothing in this component is muted, because everything in it is load-bearing.</li>
      <li><strong>Reduced motion</strong> removes the rise: the bar simply appears.</li>
    </ul>
  </Sec>

  <Sec n="09" title="Motion" note="Eight pixels up. Nothing out.">
    <T cols={['Moment','Motion','Tokens']} rows={[
      ['Enter','mer-rise-in — --motion-rise (8px) up from the edge it is anchored to, with opacity.','--duration-base · --ease-out'],
      ['Replace','None. The text changes in place; the bar does not re-enter or resize with a transition.','—'],
      ['Exit','None. The bar is removed.','—'],
      ['Timer','No countdown, no ring, no shrinking rule.','—'],
      ['Reduced motion','--motion-rise collapses to 0 and durations to 1ms: it appears in place.','prefers-reduced-motion'],
    ]}/>
    <p>The rise is short because the travel only has to explain where the bar came from — it grew out of the surface's bottom edge, which is also where the user's change happened. A slide from the side would be a lie about its origin, and it is the reason page-scope bars rise rather than sliding like a toast.</p>
    <p>Nothing animates on the way out. An exit transition means the dismiss press is followed by 140ms of the bar still being there, over the content the user is trying to get back to. And there is deliberately <strong>no countdown indicator</strong>: a shrinking rule turns a passive confirmation into a deadline and pulls the eye back to the bottom edge repeatedly. If the window matters that much, set <code>duration: null</code>.</p>
  </Sec>

  <Sec n="10" title="Content Rules" note="One clause, past tense, names the object.">
    <div className="two">
      <div className="pane do"><h3>Do</h3><ul>
        <li><strong>One clause, past tense:</strong> "WO-88431 archived", "L4 held", "Filter cleared".</li>
        <li><strong>Name the object</strong> — the bar has no title to do it: "3 rows deleted", not "Deleted".</li>
        <li><strong>Keep it under about 45 characters</strong> so it fits 560px without truncating.</li>
        <li><strong>Label the action with the verb it performs:</strong> "Undo", "Retry", "View skipped".</li>
        <li><strong>Count, don\u2019t enumerate:</strong> "12 work orders closed" for a bulk change.</li>
        <li><strong>Sentence case</strong>, no full stop, no exclamation marks (house rule).</li>
      </ul></div>
      <div className="pane dont"><h3>Don't</h3><ul>
        <li><strong>Two sentences.</strong> There is no message slot; the second sentence means you wanted a Toast.</li>
        <li><strong>"Success!"</strong>, "Done!", "Oops" — no cheer and no apology.</li>
        <li><strong>Raw errors</strong> or status codes. Operator language, or nothing.</li>
        <li><strong>Instructions to follow later.</strong> Six seconds and one line is not documentation.</li>
        <li><strong>Two actions</strong>, or an action that is a question ("Keep / Discard"). That is a Dialog.</li>
        <li><strong>"Click here", "Please wait", or a link into another screen</strong> that abandons the surface the bar belongs to.</li>
      </ul></div>
    </div>
    <p>The console-specific rule from Toast applies here too: <strong>a snackbar must not be the only record of an operational event.</strong> "L4 held" belongs in the line's history whether anyone saw the bar or not. The bar is a courtesy to the operator who pressed the button; the audit trail is the record.</p>
  </Sec>

  <Sec n="11" title="Responsive" note="It inherits its surface, and it must not sit on the thumb.">
    <ul>
      <li><strong>Container scope is already responsive.</strong> The bar spans its surface minus two insets, so a narrow panel gets a narrow bar with no breakpoint — the 560px cap only ever applies on wide surfaces.</li>
      <li><strong>Prefer <code>attached</code> below about 600px.</strong> A floating bar with a shadow inside a phone-width panel is 90% of the width pretending to be detached; flush is more honest and gives the text more room.</li>
      <li><strong>Never over a fixed bottom bar.</strong> If the product has a bottom action bar or tab bar on mobile, use <code>attached</code> above it or raise the container's padding. A snackbar covering Save is a bug the user cannot dismiss quickly enough.</li>
      <li><strong>Keep it clear of the toast viewport.</strong> A page-scope snackbar is bottom-centre and the default toaster is bottom-right; on a phone both go full width, so a product using both should move the toaster to the top.</li>
      <li><strong>The message truncates, it does not wrap</strong> — so review copy at the narrowest surface it will appear in, not the widest.</li>
      <li><strong>Touch keeps <code>size="md"</code>.</strong> 44px is the target minimum, and the dismiss button is often the only way out before the timer.</li>
    </ul>
    <div className="demo col">
      <div style={{display:'grid',gridTemplateColumns:'minmax(0,260px) minmax(0,1fr)',gap:16}}>
        <div className="stage" style={{minHeight:150,padding:'14px 10px'}}>
          <div className="fakehead">Narrow panel</div>
          <div className="fakerow"><span>Station 4</span><span className="mono" style={{color:'var(--text-tertiary)'}}>offline</span></div>
          <Snackbar open placement="attached" size="sm" message="Station muted" onDismiss={()=>{}}
            action={<Button variant="link" size="sm">Undo</Button>} duration={null} />
        </div>
        <LineStage height={150}>
          <Snackbar open align="start" message="L1 · Frame weld cleared" onDismiss={()=>{}}
            action={<Button variant="link" size="sm">Undo</Button>} duration={null} />
        </LineStage>
      </div>
      <Text size="xs" tone="tertiary">Left: attached, sm, in a narrow panel. Right: align="start" on a wide surface, so Undo lands near the rows it applies to.</Text>
    </div>
  </Sec>

  <Sec n="12" title="Anti Patterns" note="Six, and two of them are how snackbars turn into toasts.">
    <div className="two">
      <div className="pane dont"><h3>The two that matter</h3><ul>
        <li><strong>A snackbar in a surface that unmounts.</strong> Save-and-close a drawer, and the bar confirming the save dies with the drawer — often before the animation finishes. If the surface is going away, the notice belongs to what remains: a Toast.</li>
        <li><strong>A snackbar growing into a toast.</strong> A tone, then an icon, then a second line, then a queue. Each addition looks small; the result is a second notification system at the bottom of the screen with none of Toast's timing or live-region rules.</li>
      </ul></div>
      <div className="pane dont"><h3>Also don't</h3><ul>
        <li><strong>Two bars at once</strong> — page scope plus container scope, or two panels each with their own. One bottom edge, one bar.</li>
        <li><strong>Use it as a selection action bar.</strong> Several actions that persist as long as a selection is a toolbar, and it should not auto-dismiss.</li>
        <li><strong>Confirm the obvious.</strong> No bar for a row the user watched disappear with no way back.</li>
        <li><strong>Auto-dismiss a consequential reversal.</strong> If losing the Undo costs real work, set <code>duration: null</code>.</li>
        <li><strong>Put a form, a select or a progress bar in one.</strong> One line, one action.</li>
        <li><strong>Open one on page load.</strong> A confirmation of something the user did not just do has no context — that is a banner.</li>
      </ul></div>
    </div>
    <p className="warn">The rejection to make in review is a snackbar used because Toast felt "too heavy". The correct test is ownership: if the surface that raised the message is still on screen and still the thing the user is working in, it is a snackbar. If not, it is a toast — regardless of how short the copy is.</p>
  </Sec>

  <Sec n="13" title="Implementation Notes" note="What the code does, and why it does it that way.">
    <ul>
      <li><strong>No store, no queue, no imperative API.</strong> <code>open</code> is a prop. This is the deliberate inverse of <code>Toaster</code>: the code that raises a snackbar is the component that owns the surface, so it already has the state, and a global API would let two surfaces fight for one edge.</li>
      <li><strong>The region is always mounted; only the bar is conditional.</strong> The single most important accessibility detail in the file — <code>aria-live</code> on an element that appears with its content is announced unreliably.</li>
      <li><strong>The timer effect depends on <code>message</code>.</strong> That is what makes a replacement restart the clock instead of inheriting the previous remainder, and it is why the component needs no id-matching logic like Toast's.</li>
      <li><strong>Pausing clears the handle rather than tracking elapsed time.</strong> Same rule as Toast: a bar the user has hovered gets a full duration when they leave, not the leftovers.</li>
      <li><strong>Auto-dismiss requires <code>onDismiss</code>.</strong> Without it there is nothing to call, so the bar simply persists — which is the safe failure, not a bar that vanishes with no way to bring it back.</li>
      <li><strong><code>pointer-events: none</code> on the region, <code>auto</code> on the bar.</strong> The region spans the surface's whole width; without this it would swallow presses on the rows beneath it.</li>
      <li><strong>Positioned, never in flow.</strong> Container scope is <code>position: absolute</code>, so opening a bar never changes the surface's height and never reflows a table mid-read. It does mean the parent needs <code>position: relative</code> and enough bottom padding not to hide its own last row.</li>
      <li><strong><code>attached</code> drops the shadow and radius rather than restyling them.</strong> A flush bar with a shadow is a card that failed to detach; the single top hairline is <code>--snackbar-attached-border</code>, one step lighter than the floating border because it is structural rather than an outline.</li>
      <li><strong>The message truncates in one line</strong> (<code>nowrap</code> + ellipsis) rather than clamping to two. A hard limit is what keeps the copy rules enforceable — a two-line bar invites the second sentence that turns it into a toast.</li>
      <li><strong>Layered at <code>--z-snackbar</code> (690)</strong>, below <code>--z-toast</code> (700) and <code>--z-tooltip</code> (800), above <code>--z-dialog</code> — a page-scope bar must not cover a toast, and must be visible over page content and drawers.</li>
      <li><strong>14 tokens, none shared with <code>--toast-*</code>.</strong> The two components are intentionally separate in the token layer so that changing the toast's elevation never quietly changes a bar sitting inside a table.</li>
    </ul>
    <div className="tokenlist">
      {['--snackbar-background','--snackbar-border','--snackbar-radius','--snackbar-shadow','--snackbar-text','--snackbar-dismiss-icon','--snackbar-attached-border','--snackbar-height-sm','--snackbar-height-md','--snackbar-padding-sm','--snackbar-padding-md','--snackbar-gap','--snackbar-max-width','--snackbar-inset'].map(t=><span key={t}>{t}</span>)}
    </div>
  </Sec>

  <Sec n="14" title="Developer Notes" note="Wiring it into a surface.">
    <pre>{`import { Snackbar } from '@meridian/feedback';

function LineTable({ lines }) {
  // The surface owns the bar. One piece of state, cleared by both paths out.
  const [undo, setUndo] = React.useState(null);   // { message, revert }

  async function hold(line) {
    await api.hold(line.id);                       // also written to line history
    setUndo({ message: \`\${line.name} held\`, revert: () => api.release(line.id) });
  }

  return (
    <div style={{ position: 'relative', paddingBottom: 'var(--space-10)' }}>
      <Table rows={lines} onHold={hold} />
      <Snackbar
        open={!!undo}
        message={undo?.message}
        onDismiss={() => setUndo(null)}
        action={
          <Button variant="link" size="sm"
            onClick={() => { undo.revert(); setUndo(null); }}>Undo</Button>
        }
      />
    </div>
  );
}`}</pre>
    <ul>
      <li><strong>One bar per surface, and one surface responsible for it.</strong> Lift the state to the container that owns the bottom edge — not to each row.</li>
      <li><strong>Give the container <code>position: relative</code> and bottom padding.</strong> Otherwise the bar covers its own last row.</li>
      <li><strong>Clear the state in every exit path</strong> — action, dismiss, timer, and route change. A stale <code>undo</code> object whose revert no longer applies is the one real bug this component can cause.</li>
      <li><strong>If the surface can unmount, use a Toast instead</strong> (§12). A drawer that closes on save cannot confirm the save.</li>
      <li><strong>Set <code>duration: null</code> when losing the Undo costs work</strong> — deletes with side effects, imports, anything a shift lead will be asked about later.</li>
      <li><strong>Every action here must exist elsewhere too</strong> — in the record's history or on the panel. The bar is the fast path (§07).</li>
      <li><strong>Testing hooks:</strong> the region is <code>[data-snackbar-region="container|page"]</code> and is present even when closed; the bar is <code>[data-snackbar="floating|attached"]</code>; dismiss is a button named "Dismiss". Assert on the region's text content to test announcements.</li>
    </ul>
  </Sec>
</div>
);}
ReactDOM.createRoot(document.getElementById('root')).render(<Spec />);
