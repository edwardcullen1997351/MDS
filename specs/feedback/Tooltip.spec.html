<div className="page">
  <div className="masthead">
    <span className="eyebrow">Feedback · Component specification</span>
    <h1>Tooltip</h1>
    <p className="lede">The smallest surface in the system, and the one whose difficulty is entirely behavioural. Visually it is eight words on an inverted chip; what makes it right or wrong is <em>when</em> it appears, whether the keyboard can reach it, whether it can be got rid of, and whether it holds anything the user cannot afford to miss. A tooltip is a description of a control that is already named — never the name itself, and never information the task depends on.</p>
    <div className="meta">
      <span>components/feedback/Tooltip.jsx</span><span>components/core/anchor.js</span><span>window.MeridianDesignSystem_962c43.Tooltip</span><span style={{color:'var(--text-primary)'}}>status: frozen 4 Sep 2026 · 0 open items</span><span>since: 1.1.0 · hardened 1.8.0</span><span>8 tokens · 0 new layers</span>
    </div>
  </div>

  <Sec n="01" title="Purpose" note="Name what an icon means. Nothing more.">
    <p>A tooltip exists because dense interfaces compress controls to glyphs. It restores the word that was removed — and does so on demand, so the density survives. Everything beyond that word belongs somewhere else: if the user must read it to proceed, a surface that vanishes on pointer-out is the wrong place to put it.</p>
    <T cols={['You want to…','Component','Why']} rows={[
      ['Name an icon-only control','Tooltip','This component — as a description on top of the control’s own label.'],
      ['Explain a field’s format or constraint','Field hint','Persistent, in reading order, present while the user types. A tooltip is gone by then.'],
      ['Explain a term or a metric','Popover','If it takes a sentence and the user must read it, it needs to stay open and be selectable.'],
      ['Show why a control is disabled','Tooltip','Legitimate, and the one case where the tooltip is load-bearing — so the component makes the wrapper focusable itself (§13).'],
      ['Show the full text of something truncated','Tooltip · title','A tooltip is fine here; keep the untruncated value in the accessible name too.'],
      ['Report the result of an action','Toast','A tooltip is attached to a control, not to an event.'],
      ['Offer commands','Menu','Nothing in a tooltip can be clicked (§12).'],
    ]}/>
    <ul>
      <li><strong>Use</strong> on icon-only buttons, on a truncated cell, on a metric abbreviation, to surface a keyboard shortcut, to say why a control is unavailable.</li>
      <li><strong>Do not use</strong> for anything required. A tooltip is invisible to a user who never hovers, unreachable on touch, and gone the moment the pointer moves.</li>
      <li><strong>Do not use</strong> where the label is already visible. A tooltip repeating the button text is noise on every pass of the cursor — pass <code>disabled</code> rather than deleting the wrapper conditionally.</li>
    </ul>
    <div className="demo tall">
      <div className="bar">
        {[['refresh-cw','Refresh','Reload the run list','⌘R'],['filter','Filter','Filter by line and shift','⌘F'],['columns','Columns','Choose visible columns',null],['download','Export','Export current view','⌘E'],['panel-left','Sidebar','Hide the sidebar','⌘\\']].map(([icon,label,tip,sc])=>(
          <Tooltip key={icon} content={tip} shortcut={sc}><IconButton icon={icon} label={label} variant="ghost" /></Tooltip>
        ))}
      </div>
      <Text size="xs" tone="tertiary">Hover the first — it waits. Then move along the row: the rest open instantly (§09).</Text>
    </div>
  </Sec>

  <Sec n="02" title="Anatomy" note="Three parts, one of them absent on purpose.">
    <div className="demo">
      <div style={{display:'flex',flexDirection:'column',gap:10,minWidth:300,flex:1}}>
        {[['1','Surface — the system’s only inverted panel: --tooltip-background on --tooltip-foreground, --radius-xs, --elevation-3. Inverted so it reads as a layer above the page at a size too small to establish itself any other way.'],
          ['2','Label — --text-xs, wrapping at --tooltip-max-width (260px). Wraps rather than truncates; a truncated tooltip has failed at its one job.'],
          ['3','Shortcut (optional) — mono 2xs in --tooltip-shortcut-text, baseline-aligned after the label. Display only.'],
          ['4','Offset — 8px from the trigger on the chosen side. Enough that the tip never sits under the cursor that summoned it.'],
          ['5','No arrow — by decision. At this size a tail is three more pixels of geometry to get wrong on every flip, and the 8px offset already reads as attachment.']].map(([n,t])=>(
          <div className="callout" key={n}><span className="cnum">{n}</span><Text size="xs">{t}</Text></div>
        ))}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:12,alignItems:'flex-start'}}>
        <span className="tipstatic">Reload the run list <span className="sc">⌘R</span></span>
        <span className="tipstatic">Only orders whose line has reported scrap in the last hour</span>
      </div>
    </div>
    <p>The surface is <code>position: fixed</code> and carries no interactive children, so it needs no focus management of its own — it is announced through the trigger, not entered.</p>
  </Sec>

  <Sec n="03" title="Properties" note="Ten props, and most pages use two.">
    <T cols={['Prop','Type','Default','Notes']} rows={[
      ['content','ReactNode','—','The description. A few words, no terminal period. Nothing renders when null.'],
      ['children','ReactNode','—','The trigger. A single element receives aria-describedby while the tip is open.'],
      ['shortcut','ReactNode','—','Keyboard hint in mono after the label. Display only — you own the binding.'],
      ['side','\u2018top’|\u2018bottom’|\u2018left’|\u2018right’','top','Preferred side; flips when there is no room.'],
      ['align','\u2018start’|\u2018center’|\u2018end’','center','Cross-axis alignment against the trigger.'],
      ['delay','number','400','Open delay in ms — and 0 while the group is warm (§09).'],
      ['maxWidth','number | string','--tooltip-max-width','Wrapping ceiling, 260px by default.'],
      ['disabled','boolean','false','Suppress entirely. Use this rather than conditionally unwrapping the trigger.'],
      ['open','boolean','—','Controlled visibility. Hover, focus and Escape stop driving it — for demos, tours and tests only.'],
      ['style','CSSProperties','—','Applies to the inline wrapper, not the tip.'],
    ]}/>
    <p>There is no <code>closeDelay</code>, no <code>interactive</code>, no <code>arrow</code> and no <code>trigger="click"</code>. Each of those turns a tooltip into a popover with worse semantics; the component that does those things is <code>Popover</code>.</p>
  </Sec>

  <Sec n="04" title="Variants" note="One surface. What varies is the content and the side.">
    <T cols={['Shape','Set by','Use']} rows={[
      ['Label','content','The default. Two to five words naming a glyph.'],
      ['Label + shortcut','shortcut','Icon-only toolbar controls that also have an accelerator.'],
      ['Sentence','content, wrapping','Why a control is disabled; what a filter actually matches. Two lines at most.'],
      ['Placed','side · align','When the default top would cover something that matters — a value being read, a row above.'],
      ['Suppressed','disabled','The label is already visible, or the control is in a mode where the tip would be wrong.'],
    ]}/>
    <div className="demo tall">
      <Row label="label"><Tooltip content="Reload the run list"><IconButton icon="refresh-cw" label="Refresh" /></Tooltip></Row>
      <Row label="+ shortcut"><Tooltip content="Export current view" shortcut="⌘E"><IconButton icon="download" label="Export" /></Tooltip></Row>
      <Row label="sentence"><Tooltip content="Scheduled reports need an owner before they can run"><Button variant="secondary" disabled>Schedule</Button></Tooltip></Row>
      <Row label="sides">
        {['top','right','bottom','left'].map(s=>(
          <Tooltip key={s} side={s} content={`side="${s}"`}><Button variant="ghost" size="sm">{s}</Button></Tooltip>
        ))}
      </Row>
    </div>
  </Sec>

  <Sec n="05" title="Sizes" note="One, and that is the specification.">
    <T cols={['Property','Value','Why']} rows={[
      ['Padding','--tooltip-padding (5px 8px)','Tight enough that the chip reads as a label, not a panel.'],
      ['Label','--text-xs','One step below body. Smaller stops being readable at a glance; larger competes with the page.'],
      ['Shortcut','--text-2xs mono','Metadata beside the label, never equal to it.'],
      ['Max width','--tooltip-max-width (260px)','About eight words per line — two lines is the practical ceiling.'],
      ['Offset','8px','Fixed. Clears the cursor on every side.'],
    ]}/>
    <p>Tooltip has no <code>size</code> prop, and the omission is the decision. A tooltip is calibrated against the <em>page</em>, not against the control it describes — a small one on a dense toolbar and a large one in a page header would make the same sentence look like two different kinds of information. It is the same chip everywhere, on a 28px icon button and on a page title alike.</p>
    <div className="demo">
      <Row label="on sm"><Tooltip content="Reload the run list" shortcut="⌘R"><IconButton size="sm" icon="refresh-cw" label="Refresh" /></Tooltip></Row>
      <Row label="on lg"><Tooltip content="Reload the run list" shortcut="⌘R"><Button size="lg" variant="secondary" iconLeft="refresh-cw">Refresh</Button></Tooltip></Row>
    </div>
  </Sec>

  <Sec n="06" title="States" note="Open, closed, warm.">
    <T cols={['State','Trigger','Behaviour']} rows={[
      ['Closed','—','Nothing is rendered. No hidden DOM, so a table of 200 tooltips costs 200 spans and zero surfaces.'],
      ['Pending','pointer enters','The delay is running. Nothing is shown yet, and leaving cancels it.'],
      ['Open','delay elapsed, or focus-visible','The tip is rendered, positioned and wired to the trigger via aria-describedby.'],
      ['Warm','a tip closed under 200ms ago','The next tooltip anywhere opens with no delay. Warmth is shared across the page, not per trigger.'],
      ['Grace','pointer leaves','120ms before closing, so the pointer may cross the 8px gap onto the tip without it vanishing (1.4.13 hoverable).'],
      ['Dismissed','Escape','Closed immediately, wherever focus is, without moving focus.'],
      ['Suppressed','disabled, or content == null','Never opens. The trigger behaves as though unwrapped.'],
      ['Disabled trigger','a disabled child','The child stops taking pointer events and the wrapper becomes a focusable aria-disabled stop — hover and Tab both reach the tip (§13).'],
      ['Never','coarse pointer','No tooltip. A tap is a press, and there is no hover to represent (§11).'],
    ]}/>
    <div className="demo col">
      <Row label="pending → open"><Tooltip content="Waited 400ms"><Button variant="secondary">Hover and wait</Button></Tooltip></Row>
      <Row label="warm"><Tooltip content="First"><Button variant="ghost" size="sm">one</Button></Tooltip><Tooltip content="Instant, because the group is warm"><Button variant="ghost" size="sm">two</Button></Tooltip><Tooltip content="Also instant"><Button variant="ghost" size="sm">three</Button></Tooltip></Row>
      <Row label="dismissible"><Tooltip content="Press Escape to dismiss me"><Button variant="secondary">Focus me</Button></Tooltip><Text size="xs" tone="tertiary">Tab to it, then <kbd>Esc</kbd>.</Text></Row>
      <Row label="controlled"><Tooltip content="Held open by the product" open={pinned}><Button variant="secondary" onClick={()=>setPinned(p=>!p)}>{pinned?'Release':'Pin open'}</Button></Tooltip></Row>
    </div>
  </Sec>

  <Sec n="07" title="Keyboard" note="Focus opens it. Escape closes it. That is the whole contract.">
    <T cols={['Key','Does','Why']} rows={[
      ['Tab to the trigger','Opens immediately, no delay.','A keyboard user cannot "hover slowly" — the delay exists to filter accidental pointer travel, which has no keyboard equivalent.'],
      ['Tab to a disabled trigger','Opens — the wrapper is the focus stop.','The reason a control is unavailable is the one thing a keyboard user most needs from a tooltip; a disabled button cannot provide it, so the wrapper does.'],
      ['Escape','Closes it, focus unmoved.','WCAG 1.4.13 dismissible. Bound at the document while open, so it works wherever focus went.'],
      ['Tab away','Closes it.','—'],
      ['Enter · Space','Nothing. The trigger handles them.','The tooltip is never in the tab order and never takes focus.'],
      ['Click the trigger','Closes it.','The user has committed; the description has served its purpose and would otherwise sit over the result.'],
    ]}/>
    <p>Focus opens the tip only on <code>:focus-visible</code>. Opening on any focus means every click on an icon button also raises its tooltip, directly over whatever the click just changed — the most common tooltip defect in dense products, and it looks like a flicker rather than a bug.</p>
    <div className="demo">
      <div className="bar">
        {[['refresh-cw','Refresh','Reload the run list','⌘R'],['filter','Filter','Filter by line and shift','⌘F'],['download','Export','Export current view','⌘E']].map(([icon,label,tip,sc])=>(
          <Tooltip key={icon} content={tip} shortcut={sc}><IconButton icon={icon} label={label} variant="ghost" /></Tooltip>
        ))}
      </div>
      <Text size="xs" tone="tertiary">Tab through — tips open on focus. Click one — it does not.</Text>
    </div>
  </Sec>

  <Sec n="08" title="Accessibility" note="A description, never a name.">
    <ul>
      <li><strong><code>aria-describedby</code>, not <code>aria-labelledby</code>.</strong> The tip is wired to the trigger as a description while open. A control whose <em>only</em> name comes from its tooltip is unnamed to anything that does not fire hover — pass <code>label</code> on the <code>IconButton</code> and let the tooltip add to it.</li>
      <li><strong>The trigger must be focusable.</strong> A tooltip on a plain <code>&lt;span&gt;</code> is keyboard-unreachable. If the thing being described is not a control, either give it <code>tabIndex={0}</code> and a role, or put the text on the page.</li>
      <li><strong>Dismissible</strong> (1.4.13): Escape closes it from anywhere, without moving focus.</li>
      <li><strong>Hoverable</strong> (1.4.13): the 120ms grace lets the pointer enter the tip — so a tip that covers something can be read rather than chased away. It has <code>pointer-events</code> and no children to click.</li>
      <li><strong>Persistent</strong> (1.4.13): it closes on Escape, blur, click or pointer-out, and on nothing else. No timeout auto-hides a tooltip mid-read.</li>
      <li><strong>Contrast.</strong> The inverted pair is the darkest surface in the system against <code>--text-inverse</code>; the shortcut is <code>--tooltip-shortcut-text</code>, which stays above 4.5:1 on that background. Do not restyle a tooltip's foreground — there is no second combination that passes.</li>
      <li><strong>Not announced twice.</strong> <code>aria-describedby</code> is attached only while the tip is open, so a screen reader does not read a description for a surface that is not there.</li>
      <li><strong>Shortcuts are display only.</strong> Where the accelerator matters to assistive tech, put <code>aria-keyshortcuts</code> on the control itself — <code>Menu</code> does this for its rows.</li>
    </ul>
    <p className="warn">The single most common accessibility failure with this component is using it as the label of an icon button. It reads correctly to a sighted mouse user and is silent to everyone else.</p>
  </Sec>

  <Sec n="09" title="Motion" note="The timing IS the design.">
    <T cols={['Moment','Behaviour','Value']} rows={[
      ['First open','Waits, then fades in.','400ms delay · mer-fade-in over --duration-instant'],
      ['Subsequent opens (warm)','No delay at all.','0ms while within 200ms of the last close'],
      ['Keyboard focus','No delay.','0ms'],
      ['Close','Immediate. No fade out.','—'],
      ['Pointer-out grace','120ms before closing.','so the gap to the tip can be crossed'],
      ['Movement','None. No slide, no scale, no travel between triggers.','—'],
      ['Reduced motion','--duration-instant collapses to 1ms; the delays are unchanged.','prefers-reduced-motion'],
    ]}/>
    <p>The 400ms delay is the component's most important number. Without it a tooltip fires on a pointer merely travelling across a toolbar to somewhere else, and the page appears to twitch. The 200ms warm window is the counterpart: once the user has demonstrated they want tooltips, making them wait again at each neighbour is its own kind of hostile — so warmth is shared across the whole page rather than held per trigger, and a row of eight icon buttons reads as one surface being explored.</p>
    <p>Nothing fades out, because a description whose control the user has already left is stale immediately. And nothing animates <em>between</em> triggers: a tooltip that slides from one button to the next is a single object following the cursor, which invites the user to chase it.</p>
  </Sec>

  <Sec n="10" title="Content Rules" note="Two to five words, no period.">
    <div className="two">
      <div className="pane do"><h3>Do</h3><ul>
        <li><strong>Name the action.</strong> "Reload the run list", "Hide the sidebar".</li>
        <li><strong>Sentence case</strong>, no terminal period — it is a label, not prose.</li>
        <li><strong>Say more than the icon does.</strong> "Refresh" on a refresh glyph adds nothing; "Reload the run list" says what gets reloaded.</li>
        <li><strong>State the reason</strong> for a disabled control: "Needs an owner before it can run".</li>
        <li><strong>Put the accelerator in <code>shortcut</code></strong>, not in the sentence.</li>
      </ul></div>
      <div className="pane dont"><h3>Don't</h3><ul>
        <li><strong>Repeat the visible label.</strong> "Save" on a button reading Save.</li>
        <li><strong>Write two sentences.</strong> If it needs a full stop mid-thought, it needs a Popover.</li>
        <li><strong>Put anything essential in one.</strong> Required content cannot live behind hover.</li>
        <li><strong>Truncate.</strong> Wrapping is the answer; a tooltip with an ellipsis has failed twice.</li>
        <li><strong>"Click to…".</strong> The user knows it is a button; describe the outcome.</li>
        <li><strong>Markup, links, or a second colour.</strong> The tip has one text style, and nothing in it is clickable.</li>
      </ul></div>
    </div>
  </Sec>

  <Sec n="11" title="Responsive" note="Flips, wraps, and refuses to exist on touch.">
    <ul>
      <li><strong>Never on a coarse pointer.</strong> The component checks <code>(pointer: coarse)</code> and the pointer type of the event, and does not open for either. Touch has no hover state; the alternatives that exist elsewhere — open on tap, open on long-press — either steal the press or hide behind a gesture nobody performs.</li>
      <li><strong>So the tooltip is never the only source.</strong> On any screen that must work on a tablet, the icon-only control needs a visible label at that breakpoint, or the information belongs on the page. This is the constraint the component cannot solve for you.</li>
      <li><strong>Flips at the edge.</strong> The shared engine picks the side at open from the room that exists, keeps an 8px viewport gutter, and re-flips only if the side becomes genuinely unusable — a tip on the top row of a table opens downward without being told.</li>
      <li><strong>Wraps, never scrolls.</strong> Height is unclamped (<code>clampHeight: false</code>): a tooltip is short enough to always fit, and a scrolling tooltip would be a panel.</li>
      <li><strong>Not clipped.</strong> Being fixed-position it escapes an ancestor's <code>overflow: hidden</code>, so it works inside a table cell or a scrolling toolbar with no portal.</li>
      <li><strong>Narrow viewports</strong> keep the 260px ceiling but shift within the gutter, so a tip on a right-edge control does not run off-screen.</li>
    </ul>
    <div className="demo tall" style={{justifyContent:'space-between'}}>
      <Tooltip side="right" content="Flips to the left when there is no room on the right"><Button variant="secondary" size="sm">near the left edge</Button></Tooltip>
      <Tooltip side="right" content="Flips to the left when there is no room on the right"><Button variant="secondary" size="sm">near the right edge</Button></Tooltip>
    </div>
  </Sec>

  <Sec n="12" title="Anti Patterns" note="Everything that turns a tooltip into a bad popover.">
    <div className="two">
      <div className="pane dont"><h3>Content that cannot live there</h3><ul>
        <li><strong>Interactive content.</strong> No links, no buttons, no copyable ids. Reaching them means crossing a gap that closes the surface, and none of it is keyboard-reachable. Use <code>Popover</code>.</li>
        <li><strong>Required information.</strong> Format rules, validation constraints, terms the task depends on — a <code>Field</code> hint or a <code>Popover</code>, in reading order.</li>
        <li><strong>The control’s only name.</strong> §08. Silent to everyone who does not hover.</li>
        <li><strong>Long text.</strong> Past two lines the user is reading, and reading requires a surface that stays.</li>
      </ul></div>
      <div className="pane dont"><h3>Behaviour that breaks it</h3><ul>
        <li><strong>Zero delay.</strong> Fires on a pointer passing through. The page twitches.</li>
        <li><strong>Opening on click-focus.</strong> Every press raises a tip over the thing just changed.</li>
        <li><strong>A tooltip on a <code>disabled</code> button.</strong> Disabled controls dispatch no pointer events, and those events do not reach ancestors either — so a bare wrapper never sees the pointer and the control cannot be focused. This component handles it (§13): pass the disabled child through and the wrapper becomes the focus stop. Never hand-roll it.</li>
        <li><strong>Tooltips on everything.</strong> A page where every control explains itself on hover cannot be scanned; the ones that matter are lost among the ones that repeat a visible word.</li>
        <li><strong>A tooltip inside a tooltip,</strong> or on a Toast, or on anything already transient.</li>
        <li><strong>An arrow, a close button, a pinned mode.</strong> Each one is a request for <code>Popover</code>.</li>
      </ul></div>
    </div>
    <div className="demo">
      <Tooltip content="Needs an owner before it can run"><Button variant="secondary" disabled>Disabled, still explains itself</Button></Tooltip>
      <Popover trigger={<Button variant="ghost">What is OEE?</Button>} title="OEE"><Text size="sm">Availability × performance × quality. Content the user must read belongs here, not in a tooltip.</Text></Popover>
    </div>
  </Sec>

  <Sec n="13" title="Implementation Notes" note="What hardened in 1.8.0.">
    <ul>
      <li><strong>Disabled triggers are handled, not documented around.</strong> A disabled child dispatches no pointer events and cannot take focus — and those events do not bubble to a wrapper either, so wrapping alone silently fails. The component detects <code>disabled</code>, sets <code>pointerEvents: none</code> on the child so the pointer lands on the wrapper's box, and promotes the wrapper to a focusable <code>role="button" aria-disabled="true"</code> stop carrying the <code>aria-describedby</code>. This is the one case where a tooltip is load-bearing, so it is the one case that may not depend on the trigger cooperating.</li>
      <li><strong>It is now wired to its trigger.</strong> The tip had <code>role="tooltip"</code> but no association at all: it was announced to nobody. It now carries a <code>useId</code> id and clones <code>aria-describedby</code> onto a single-element child while open, merging with any the child already had.</li>
      <li><strong>Delay and shared warmth</strong> replaced instant-open. <code>warmUntil</code> is module-level on purpose — warmth belongs to the session, not to a component instance, and there is no other way for the second tooltip in a toolbar to know the first one already opened.</li>
      <li><strong>Escape is bound at the document, capture phase, only while open.</strong> Bound per-mounted-tooltip it would install hundreds of idle listeners on a dense page.</li>
      <li><strong><code>pointer-events: none</code> was removed</strong> and replaced with a 120ms close grace, which is what 1.4.13 hoverable actually requires: a tip that covers something must be readable, not swiped away.</li>
      <li><strong>Focus opens on <code>:focus-visible</code> only,</strong> tested with <code>matches()</code> on the focus target rather than tracked as input modality — the browser already knows, and its answer is the correct one.</li>
      <li><strong>Touch is refused twice:</strong> once on the media query at render, once on <code>event.pointerType</code>. A hybrid device that reports fine-pointer capability but is being touched still gets no tooltip.</li>
      <li><strong>Fifth consumer of <code>useAnchor</code></strong>, with <code>clampHeight: false</code> — the only surface that opts out, because a tooltip that scrolls is a panel. Side selection, the flip and the gutter are the engine's.</li>
      <li><strong>The label wraps, the shortcut does not:</strong> <code>whiteSpace: nowrap</code> is scoped to the shortcut span and the row is baseline-aligned, so "⌘⇧E" never breaks across lines beside a two-line description.</li>
      <li><strong>Nothing renders while closed,</strong> and the timer is cleared on unmount — a table that re-renders 200 rows leaves no pending timeouts behind.</li>
    </ul>
    <div className="tokenlist">
      {['--tooltip-background','--tooltip-foreground','--tooltip-border','--tooltip-radius','--tooltip-shadow','--tooltip-shortcut-text','--tooltip-padding','--tooltip-max-width'].map(t=><span key={t}>{t}</span>)}
    </div>
  </Sec>

  <Sec n="14" title="Developer Notes" note="Wiring it into a product.">
    <pre>{`import { Tooltip } from '@meridian/feedback';

// The common case: a described icon button. The LABEL is the name,
// the tooltip is the description — both, always.
<Tooltip content="Reload the run list" shortcut="⌘R">
  <IconButton icon="refresh-cw" label="Refresh" variant="ghost" />
</Tooltip>

// Explaining a disabled control. Pass the disabled child through: the
// component neutralises its pointer events and promotes the wrapper to
// the focus stop, so the reason is reachable by hover AND by Tab.
<Tooltip content={reason}>
  <Button variant="secondary" disabled={!!reason}>Schedule</Button>
</Tooltip>

// Suppress rather than unwrap, so the tree does not change shape.
<Tooltip content="Reload the run list" disabled={labelIsVisible}>
  <Button iconLeft="refresh-cw">{labelIsVisible ? 'Refresh' : null}</Button>
</Tooltip>

// A truncated cell: the tooltip carries the full value, and so does
// the accessible name.
<Tooltip content={row.note}>
  <span tabIndex={0} title={row.note}
        style={{ overflow: 'hidden', textOverflow: 'ellipsis',
                 whiteSpace: 'nowrap', maxWidth: 220 }}>
    {row.note}
  </span>
</Tooltip>`}</pre>
    <ul>
      <li><strong>Always give the trigger its own name.</strong> <code>IconButton label</code>, or <code>aria-label</code>. The tooltip describes; it does not name.</li>
      <li><strong>Wrap the disabled control and pass it through unchanged.</strong> The component detects <code>disabled</code>, neutralises the child's pointer events and makes the wrapper a focusable <code>aria-disabled</code> stop. Do not add <code>tabIndex</code> or <code>pointerEvents</code> yourself.</li>
      <li><strong>Pass a single element child.</strong> <code>aria-describedby</code> is cloned onto it; a fragment or a text node gets the surface but no association.</li>
      <li><strong>Use <code>disabled</code>, not conditional wrapping.</strong> Unwrapping remounts the trigger and drops focus if the user is on it.</li>
      <li><strong>Do not put state in <code>content</code> that changes while open</strong> — a description that rewrites itself under the cursor cannot be read. Close it, or use a <code>Popover</code>.</li>
      <li><strong><code>open</code> is for tours, demos and tests.</strong> Controlled mode disables hover, focus and Escape; do not use it to keep a tooltip visible in production.</li>
      <li><strong>Testing hooks:</strong> assert on <code>[role="tooltip"]</code> and, more importantly, that the trigger's <code>aria-describedby</code> resolves to it. Remember the delay — fake timers, or pass <code>delay={0}</code>. Nothing exists in the DOM before it opens.</li>
    </ul>
  </Sec>
</div>
);}
ReactDOM.createRoot(document.getElementById('root')).render(<Spec />);
</script></body></html>
