const T = ({cols,rows}) => (
  <table><thead><tr>{cols.map((c,i)=><th key={i}>{c}</th>)}</tr></thead>
  <tbody>{rows.map((r,i)=><tr key={i}>{r.map((c,j)=><td key={j} className={j===0?'k':''}>{c}</td>)}</tr>)}</tbody></table>

const Row = ({label,children}) => <div className="staterow"><span className="lbl">{label}</span>{children}</div>;

function PaginationSystemDemo(){
  const [page, setPage] = React.useState(3);
  const totalPages = 14;
  const totalItems = 342;
  const pageSize = 25;

  const startItem = (page - 1) * pageSize + 1;
  const endItem = Math.min(page * pageSize, totalItems);

  return (
    <div className="demo">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
        <Text size="xs" weight="medium">Interactive Demonstration — Plant Work Order Ledger Pagination</Text>
      </div>

      <nav aria-label="Work Orders Pagination" className="mock-pagination-bar">
        <div style={{fontSize:'var(--text-xs)',color:'var(--text-secondary)'}}>
          Showing <strong>{startItem}–{endItem}</strong> of <strong>{totalItems}</strong> work orders (PL-04 Chakan)
        </div>

        <div className="mock-page-controls">
          <button
            type="button"
            className="mock-page-btn"
            disabled={page === 1}
            aria-label="Go to previous page"
            onClick={() => setPage(p => Math.max(1, p - 1))}
          >
            ‹ Prev
          </button>

          <button
            type="button"
            className={`mock-page-btn ${page === 1 ? 'current' : ''}`}
            aria-current={page === 1 ? 'page' : undefined}
            onClick={() => setPage(1)}
          >
            1
          </button>

          {page > 3 && <span className="mock-page-ellipsis" aria-hidden="true">…</span>}

          {page > 2 && (
            <button type="button" className="mock-page-btn" onClick={() => setPage(page - 1)}>
              {page - 1}
            </button>
          )}

          {page !== 1 && page !== totalPages && (
            <button
              type="button"
              className="mock-page-btn current"
              aria-current="page"
            >
              {page}
            </button>
          )}

          {page < totalPages - 1 && (
            <button type="button" className="mock-page-btn" onClick={() => setPage(page + 1)}>
              {page + 1}
            </button>
          )}

          {page < totalPages - 2 && <span className="mock-page-ellipsis" aria-hidden="true">…</span>}

          <button
            type="button"
            className={`mock-page-btn ${page === totalPages ? 'current' : ''}`}
            aria-current={page === totalPages ? 'page' : undefined}
            onClick={() => setPage(totalPages)}
          >
            {totalPages}
          </button>

          <button
            type="button"
            className="mock-page-btn"
            disabled={page === totalPages}
            aria-label="Go to next page"
            onClick={() => setPage(p => Math.min(totalPages, p + 1))}
          >
            Next ›
          </button>
        </div>
      </nav>

      <div style={{background:'var(--surface-sunken)',padding:14,borderRadius:'var(--radius-md)',border:'var(--border-hairline)',fontSize:'var(--text-xs)'}}>
        <div style={{fontFamily:'var(--font-mono)',marginBottom:4}}>Active Query State: <strong>?page={page}&pageSize={pageSize}</strong></div>
        <div style={{color:'var(--text-secondary)'}}>
          Pagination Navigation splits large data sets into manageable, bookmarkable chunks while preserving the collection context and providing direct boundary and jump controls.
        </div>
      </div>
    </div>
  );
}

function Spec(){

        <h1>Pagination Navigation</h1>
        <p className="lede">Moves among discrete pages within a larger ordered collection while maintaining the collection context. It divides large tables, ledgers, and catalog queues into deterministic indexed segments with boundary and jump controls.</p>
        <div className="meta">
          <span>specs/navigation/PaginationNavigation.spec.html</span>
          <span className="badge-tier">Tier: Collection Page Navigation</span>
          <span style={{color:'var(--text-primary)'}}>status: frozen 8 Sep 2026 · 0 open items</span>
          <span>setting: Suryodaya Autocomp Ltd (PL-04, Chakan)</span>
        </div>
      </div>

      <Sec n="01" title="Purpose" note="Discrete page traversal across large collections.">
        <p>Pagination Navigation provides structured traversal across large data collections (e.g. 340+ work orders, 1,200+ inventory parts, 85+ calibration certificates). It establishes 1-indexed page boundaries, prevents memory overload on data-heavy tables, communicates total item count, and enables shareable URL deep-linking to specific page subsets.</p>
        <T cols={['You need to…','Use this system','Instead of…','Why']} rows={[
          ['Navigate pages of a large data table (100+ rows)','Pagination Navigation','Infinite Scroll / Local Nav','Pagination provides deterministic locations, stable footers, and bookmarkable URLs.'],
          ['Step sequentially through a multi-step form','Process Stepper','Pagination Navigation','Steppers represent sequential validated stages; pagination represents indexed data chunks.'],
          ['Browse next/previous record inside a detail view','Sequential Navigation','Pagination Navigation','Item-by-item next/prev record browsing moves between entities, not pages of a list.'],
          ['Switch views inside a single record','Tabs','Pagination Navigation','Tabs switch perspectives in-place; pagination slices a uniform collection.']
        ]} />
        <div className="two" style={{marginTop:8}}>
          <div className="pane do">
            <h3>Do</h3>
            <ul>
              <li>Use 1-based indexing for all user-facing page numbers (Page 1 of N).</li>
              <li>Always identify the active page with <code>aria-current="page"</code>.</li>
              <li>Reset to Page 1 when table filters, search queries, or sort orders change.</li>
            </ul>
          </div>
          <div className="pane dont">
            <h3>Don't</h3>
            <ul>
              <li>Don't use pagination for wizard steps or slide carousels.</li>
              <li>Don't leave Previous enabled on Page 1 or Next enabled on the last page.</li>
              <li>Don't display 0-indexed page numbers (e.g. "Page 0").</li>
            </ul>
          </div>
        </div>
      </Sec>

      <Sec n="02" title="Anatomy" note="Boundary buttons, page numbers, ellipsis, and counters.">
        <p>The Pagination Navigation system consists of an enclosing labelled landmark, item summary count, boundary buttons (Prev/Next), page number items, and ellipsis condensation markers.</p>
        <PaginationSystemDemo />
        <div style={{marginTop:12}}>
          <T cols={['Structural Slot','Element','Role','Requirement']} rows={[
            ['Pagination Container','<nav> landmark','Encloses pagination controls with aria-label="Pagination Navigation".','Mandatory'],
            ['Collection Summary','<span> / <div>','Displays "Showing X–Y of Z items" in tabular figures.','Mandatory'],
            ['Previous Page Button','<button>','Navigates to page - 1; disabled on Page 1.','Mandatory'],
            ['Page Number Item','<button> / <li>','Direct jump button to a specific page index.','Mandatory'],
            ['Active Page Indicator','Solid blue fill','Highlights current page with aria-current="page".','Mandatory'],
            ['Ellipsis Marker','<span> (aria-hidden)','Indicates condensed hidden page ranges (`…`).','Conditional'],
            ['Next Page Button','<button>','Navigates to page + 1; disabled on last page.','Mandatory'],
            ['Page Size Selector','<Select>','Dropdown selecting rows per page (10, 25, 50, 100).','Optional']
          ]} />
        </div>
      </Sec>

      <Sec n="03" title="Properties" note="Public API, range condensation, and boundary props.">
        <p>Configured via current page, total items, page size, and change delegates:</p>
        <pre>{`interface PaginationNavigationProps {
  page: number;                   // Current 1-based active page index
  totalItems: number;             // Total number of records in collection
  pageSize: number;               // Items per page (default: 25)
  onPageChange: (page: number) => void;
  onPageSizeChange?: (size: number) => void;
  siblingCount?: number;          // Number of sibling pages around current (default: 1)

}`}</pre>
        <div className="warn" style={{marginTop:8}}>
          <p><strong>Refused Properties:</strong> No 0-indexed page number configuration; no infinite scroll mixing inside pagination controls.</p>
        </div>
      </Sec>

      <Sec n="04" title="Variants" note="Standard, Compact, and Minimal presentation models.">
        <p>Pagination Navigation supports three standardized presentation variants:</p>
        <T cols={['Variant','Structure','Optimal Context']} rows={[
          ['Standard Full (Default)','Summary + Prev + 1 … 4 [5] 6 … 14 + Next + Page Size picker.','Primary data table footers and full-width work ledgers.'],
          ['Compact Stepped','Summary + ‹ Page 5 of 14 › with Prev/Next buttons.','Medium-width panes, master-detail side lists, and tablet viewports.'],
          ['Minimal Icon Stepper','Simple `‹ 5 / 14 ›` stepper without text labels.','Compact card headers and narrow sidebar widget queues.']

      <Sec n="05" title="Sizes" note="Heights, button geometry, and spacing tokens.">

        <p>Standard keyboard navigation across pagination controls:</p>

      <Sec n="08" title="Accessibility" note="Landmark mapping, accessible labels, and live regions.">
        <p>Accessibility requirements per W3C pagination standards:</p>
        <ul>
          <li><strong>Landmark Label:</strong> Must use <code>&lt;nav aria-label="Pagination Navigation"&gt;</code> (or specific label like <code>"Work Orders Pagination"</code>).</li>
          <li><strong>Current Page Identification:</strong> The active page button must carry <code>aria-current="page"</code>.</li>
          <li><strong>Directional Labels:</strong> Boundary buttons must have explicit accessible names: <code>aria-label="Go to previous page"</code> and <code>aria-label="Go to next page"</code>.</li>

        <p>Router query synchronization recipe and test assertions:</p>
        <pre>{`// Example: Data Table Pagination with React Router Query Params
import { PaginationNavigation } from '@meridian/design-system';
import { useSearchParams } from 'react-router-dom';

export function WorkOrdersTableFooter({ totalCount }) {
  const [params, setParams] = useSearchParams();
  const page = parseInt(params.get('page') || '1', 10);
  const pageSize = parseInt(params.get('pageSize') || '25', 10);

  const handlePageChange = (newPage) => {
    params.set('page', String(newPage));
