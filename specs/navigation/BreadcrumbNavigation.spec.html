function Spec(){
  return (
    <div className="page">
      <div className="masthead">
        <span className="eyebrow">Navigation System · System specification</span>
        <h1>Breadcrumb Navigation</h1>
        <p className="lede">Communicates the user's current position within a multi-level information architecture or physical asset hierarchy, providing direct, single-click navigation back to any ancestor destination. It enforces strict ancestry wayfinding rather than session history.</p>
        <div className="meta">
          <span>specs/navigation/BreadcrumbNavigation.spec.html</span>
          <span className="badge-tier">Tier: Ancestor Trail Navigation</span>
          <span style={{color:'var(--text-primary)'}}>status: frozen 8 Sep 2026 · 0 open items</span>
          <span>setting: Suryodaya Autocomp Ltd (PL-04, Chakan)</span>
        </div>
      </div>

      <Sec n="01" title="Purpose" note="Hierarchy lineage and ancestor back-tracking.">
        <p>Breadcrumb Navigation provides immediate spatial orientation within deeply nested product, plant, or entity structures ($\ge 3$ levels deep). It displays the strict structural lineage from the root domain down to the current active entity, allowing operators to ascend directly to any parent tier without repeatedly clicking the browser Back button.</p>
        <T cols={['You need to…','Use this system','Instead of…','Why']} rows={[
          ['Navigate back up an ancestor tree (3+ levels)','Breadcrumb Navigation','Back button / History bar','Breadcrumbs reflect persistent structural containment, not transient session history.'],
          ['Switch between sibling views of the same record','Tabs','Breadcrumb Navigation','Tabs switch views in-place; breadcrumbs represent parent-child depth.'],
          ['Navigate between major operational modules','Global / Local Nav','Breadcrumb Navigation','Global and Local navigation provide peer domain wayfinding.'],
          ['Step through a sequential multi-stage wizard','Process Stepper','Breadcrumb Navigation','Steppers communicate temporal sequence and validation gates; breadcrumbs communicate spatial depth.']
        ]} />
        <div className="two" style={{marginTop:8}}>
          <div className="pane do">
            <h3>Do</h3>
            <ul>
              <li>Use breadcrumbs for hierarchies that are at least 3 levels deep.</li>
              <li>Always render the final current-page crumb as plain text with <code>aria-current="page"</code>.</li>
              <li>Derive the ancestor trail deterministically from the object hierarchy, not browser history.</li>
            </ul>
          </div>
          <div className="pane dont">
            <h3>Don't</h3>
            <ul>
              <li>Don't use breadcrumbs in flat 1- or 2-level apps (use a simple Back link instead).</li>
              <li>Don't make the last crumb an active clickable link (linking to the current page is a no-op).</li>
              <li>Don't record temporal navigation history (e.g. Page A $\to$ Page B $\to$ Page A).</li>
            </ul>
          </div>
        </div>
      </Sec>

      <Sec n="02" title="Anatomy" note="Structural trail elements, separators, and collapse slots.">
        <p>The Breadcrumb Navigation system consists of an enclosing labelled landmark, ordered list container, ancestor link crumbs, directional separators, optional collapsed middle dropdown menu, and the terminal current-location crumb.</p>
        <BreadcrumbSystemDemo />
        <div style={{marginTop:12}}>
          <T cols={['Structural Slot','Element','Role','Requirement']} rows={[
            ['Trail Container','<nav> landmark','Encloses the breadcrumb region with aria-label="Breadcrumbs".','Mandatory'],
            ['Ordered List','<ol>','Semantic ordered hierarchy of ancestor items.','Mandatory'],
            ['Root Crumb','<li> > <a>','Anchors the trail at the highest structural origin (with optional icon).','Mandatory'],
            ['Intermediate Ancestor Crumb','<li> > <a>','Clickable link navigating directly to an intermediate parent tier.','Mandatory'],
            ['Separator Glyph','<span> (aria-hidden)','Visual divider between crumbs (chevron-right or slash).','Mandatory'],
            ['Collapsed Middle Menu','<Menu> trigger (`…`)','Dropdown housing intermediate crumbs when trail exceeds maximum width.','Conditional'],
            ['Current Destination Crumb','<li> > <span>','Non-interactive text node with aria-current="page" in weight-medium.','Mandatory']
          ]} />
        </div>
      </Sec>

      <Sec n="03" title="Properties" note="Public API, collapse thresholds, and configuration.">
        <p>The Breadcrumb Navigation system is configured via an ordered items array, collapse thresholds, separator variants, and routing delegates:</p>
        <pre>{`interface BreadcrumbItem {
  label: string;                  // Destination name (1–3 words, max 24 chars)
  href?: string;                  // Destination URL (required on all except last crumb)
  icon?: string;                  // Lucide icon name (typically root crumb only)
}

interface BreadcrumbNavigationProps {
  items: Array<string | BreadcrumbItem>; // Root first, current entity last
  maxItems?: number;              // Collapse middle into '…' menu past N items (default: 4, 0 disables)
  variant?: 'chevron' | 'slash';  // Separator glyph style
  size?: 'sm' | 'md';             // Density sizing (sm: 11px trail, md: 12px default)
  label?: string;                 // Accessible landmark label (default: "Breadcrumbs")
  onNavigate?: (item: BreadcrumbItem) => void; // Router push delegate for SPA routing
}`}</pre>
        <div className="warn" style={{marginTop:8}}>
          <p><strong>Refused Properties:</strong> No <code>interactiveCurrent</code> prop (current page must never be an active link); no arbitrary button or action injection into the trail (actions belong in page headers); no dynamic history-based trail generation.</p>
        </div>
      </Sec>

      <Sec n="04" title="Variants" note="Separator styles and density sizing.">
        <p>Breadcrumb Navigation supports two separator styles and two density sizes:</p>
        <T cols={['Variant / Size','Description','Optimal Placement']} rows={[
          ['Variant: Chevron (`chevron`)','Subtle right-pointing chevron divider (`›` / `chevron-right`).','Standard enterprise console default; clearly conveys spatial nesting.'],
          ['Variant: Slash (`slash`)','Clean forward-slash divider (`/`).','Dense code, file path, or technical asset registry hierarchies.'],
          ['Size: md (12px / 14px icon)','Standard readable trail above page headers.','Default enterprise record views and plant inspection dashboards.'],
          ['Size: sm (11px / 12px icon)','Compact micro-trail for high-density sidebars or multi-pane headers.','Dense engineering schematics and telemetry monitor panels.']
        ]} />
      </Sec>

      <Sec n="05" title="Sizes" note="Typography, icon geometry, and spacing tokens.">
        <p>Geometry is calibrated for horizontal rhythm above page header typography:</p>
        <T cols={['Metric','Size sm','Size md (Default)','Application']} rows={[
          ['Font Size','11px (var(--text-2xs))','12px (var(--text-xs))','Text size for ancestor links and current crumb.'],
          ['Icon Bounding Box','12px × 12px','14px × 14px','Root crumb entity icon and separator glyphs.'],
          ['Separator Gap','5px (--space-1)','6px (--space-1.5)','Horizontal spacing around separator.'],
          ['Max Crumb Width','180px','220px','Individual item label truncation threshold with ellipsis.']
        ]} />
      </Sec>

      <Sec n="06" title="States" note="Link hover, focus rings, and non-interactive current state.">
        <p>States maintain high contrast and strict non-link current-page semantics:</p>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <Row label="Ancestor Link: Rest">
            <span style={{fontSize:'var(--text-xs)',color:'var(--text-secondary)'}}>Secondary text color without underline; indicates navigability.</span>
          </Row>
          <Row label="Ancestor Link: Hover">
            <span style={{fontSize:'var(--text-xs)',color:'var(--text-primary)',textDecoration:'underline'}}>Underline appears; text shifts to primary contrast.</span>

          <Row label="Ancestor Link: Focus">
            <span style={{fontSize:'var(--text-xs)',outline:'2px solid var(--action-solid)',outlineOffset:1,padding:'1px 4px',borderRadius:'var(--radius-xs)'}}>High-visibility blue outline around link bounding box.</span>

            <span style={{fontSize:'var(--text-xs)',fontWeight:'var(--weight-semibold)',color:'var(--text-primary)'}}>Plain text in weight-medium with aria-current="page"; non-interactive.</span>
          </Row>
          <Row label="Collapsed Trigger (`…`)">
            <span style={{fontSize:'var(--text-xs)',background:'var(--surface-sunken)',padding:'2px 6px',borderRadius:'var(--radius-xs)',fontFamily:'var(--font-mono)'}}>Subtle button pill opening intermediate ancestor dropdown on click/Enter.</span>
          </Row>
        </div>
      </Sec>

      <Sec n="07" title="Keyboard" note="Tab navigation and dropdown keyboard control.">
        <p>Breadcrumb trails are fully navigable via standard keyboard conventions:</p>
        <T cols={['Key / Shortcut','Action','Behavior']} rows={[
          ['Tab / Shift+Tab','Sequential Focus','Focuses sequentially across ancestor links and collapsed menu trigger.'],
          ['Enter / Space','Activate Ancestor','Navigates directly to the selected parent tier; opens menu if on `…` trigger.'],
          ['Arrow Up / Down (in menu)','Menu Traversal','Moves focus through collapsed intermediate ancestors inside the dropdown.'],
          ['Escape (in menu)','Close Menu','Dismisses the collapsed dropdown and returns focus to the `…` trigger.']
        ]} />
      </Sec>

      <Sec n="08" title="Accessibility" note="Landmark labeling, list semantics, and aria-current.">
        <p>Accessibility requirements per W3C breadcrumb design patterns:</p>
        <ul>
          <li><strong>Landmark Label:</strong> Must use <code>&lt;nav aria-label="Breadcrumbs"&gt;</code> (or specific label such as <code>"Plant Hierarchy Trail"</code>).</li>
          <li><strong>Ordered List Structure:</strong> Must wrap crumbs in an <code>&lt;ol&gt;</code> to communicate hierarchy order and total crumb count to screen readers.</li>
          <li><strong>Current Entity Marker:</strong> The terminal crumb must carry <code>aria-current="page"</code>.</li>
          <li><strong>Hidden Separators:</strong> Separator glyphs must carry <code>aria-hidden="true"</code> so screen readers do not announce "slash" or "greater than" between every item.</li>
        </ul>
      </Sec>

      <Sec n="09" title="Motion" note="Menu reveal and hover transitions.">
        <p>Transitions are lightweight and instantaneous where motion would delay navigation:</p>
        <T cols={['Transition','Property','Duration Token','Easing']} rows={[
          ['Link Hover Color Fade','color','100ms (--duration-instant)','ease-out'],
          ['Collapsed Dropdown Reveal','opacity, transform','120ms (--duration-quick)','cubic-bezier(0, 0, 0.2, 1)'],
          ['Reduced Motion Override','all transitions','0ms (Instant)','prefers-reduced-motion: reduce']
        ]} />
      </Sec>

      <Sec n="10" title="Content Rules" note="Label length, entity naming, and capitalisation.">
        <p>Crumb labels must match official entity names exactly and remain concise:</p>
        <T cols={['Correct Crumb Label','Incorrect Phrasing','Rationale']} rows={[
          ['Tandem Line 03','View Line 03 Schematics','Crumbs are places/entities, never actions.'],
          ['Station 04 (Deep Draw)','Station 04 Deep Draw Operation Workspace','Avoid repetitive filler words; keep breadcrumbs compact.'],
          ['NC-4810','Nonconformance Defect Record #4810','Use standard technical identifiers for terminal entities.']
        ]} />
        <ul style={{marginTop:8}}>
          <li><strong>Length Limit:</strong> 1–3 words, max 24 characters per crumb before truncation.</li>
          <li><strong>Single Line Rule:</strong> Breadcrumb trails should never wrap onto multiple lines; use middle collapse (`maxItems`) instead.</li>
        </ul>
      </Sec>

      <Sec n="11" title="Responsive" note="Ellipsis collapse and viewport adaptation.">
        <p>When horizontal viewport space is constrained, intermediate ancestors collapse into a dropdown:</p>
        <T cols={['Viewport Width','Strategy','Behavior']} rows={[
          ['Desktop (≥1024px)','Full Trail or maxItems={5}','Displays full ancestor lineage (Root $\to$ L1 $\to$ L2 $\to$ Parent $\to$ Current).'],
          ['Tablet (768px–1023px)','maxItems={3}','Root, ellipsis dropdown (`…`), immediate parent, and current page.'],
          ['Mobile (<768px)','Immediate Parent Back-Link','Collapses trail into a single "‹ [Parent Name]" back link above page title.']
        ]} />
      </Sec>

      <Sec n="12" title="Anti-patterns" note="Common architectural misuses to avoid.">
        <div className="two">
          <div className="pane dont">
            <h3>Anti-Patterns (Never Do)</h3>
            <ul>
              <li><strong>Session History Replay:</strong> Recording the user's sequential click history.</li>
              <li><strong>Clickable Terminal Crumb:</strong> Making the current page a link that reloads itself.</li>
              <li><strong>Multi-Line Trail Wrapping:</strong> Letting deep trails wrap across 3+ lines.</li>
              <li><strong>Flat Hierarchy Clutter:</strong> Putting breadcrumbs on 2-level screens.</li>
            </ul>
          </div>
          <div className="pane do">
            <h3>Standard Corrections</h3>
            <ul>
              <li>Derive trails strictly from static IA entity containment.</li>
              <li>Render the last item as plain text with <code>aria-current="page"</code>.</li>
              <li>Collapse intermediate crumbs into a <code>…</code> dropdown menu.</li>
              <li>Use a single back link for 2-level screens (e.g. "‹ Back to Work Orders").</li>
            </ul>
          </div>
        </div>
      </Sec>

      <Sec n="13" title="Implementation Notes" note="DOM architecture, router delegation, and tokens.">
        <p>Implementation rules for robust enterprise application integration:</p>
        <ul>
          <li><strong>Deterministic Lineage:</strong> Ancestor trails are built by traversing the entity parent graph, never reading <code>document.referrer</code>.</li>
          <li><strong>Router Push Delegation:</strong> In Single Page Applications (SPAs), pass <code>onNavigate</code> so intermediate and dropdown link activations stay inside the client-side router without full page reloads.</li>
        </ul>
        <div style={{marginTop:8}}>
          <Text size="xs" weight="medium" style={{textTransform:'uppercase',letterSpacing:'var(--tracking-caps)',color:'var(--text-tertiary)'}}>Tokens Consumed</Text>
          <div className="tokenlist" style={{marginTop:6}}>
            <code>--text-primary</code>
            <code>--text-secondary</code>
            <code>--text-tertiary</code>
            <code>--action-solid</code>
            <code>--surface-sunken</code>
            <code>--border-hairline</code>
            <code>--font-sans</code>
            <code>--text-xs</code>
            <code>--text-2xs</code>
            <code>--space-1</code>
            <code>--space-1.5</code>
            <code>--radius-xs</code>
          </div>
        </div>
      </Sec>

      <Sec n="14" title="Developer Notes" note="Router integration, hook recipes, and test assertions.">
        <p>Client router integration recipe and test assertions:</p>
        <pre>{`// Example: React Router / Dynamic Ancestor Trail Integration

import { useNavigate } from 'react-router-dom';

export function PlantEntityBreadcrumbs({ entity }) {

    { label: 'Suryodaya PL-04', href: '/plant-04', icon: 'factory' },

    { label: entity.lineName, href: \`/plant-04/line/\${entity.lineId}\` },
