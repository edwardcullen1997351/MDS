<div className="page">
  <div className="masthead">
    <span className="eyebrow">Navigation · Component specification</span>
    <h1>Breadcrumb</h1>
    <p className="lede">Where this page sits in the hierarchy, and one press back up it. The quietest navigation in the system and the only one that describes the <em>page you are already on</em> — which is why the last crumb is not a link, why the whole trail is 12px, and why a product with two levels of depth should not have one at all. A breadcrumb earns its line of vertical space only when users arrive deep, from search or a link, and need to know what they are looking at.</p>
    <div className="meta">

  <Sec n="01" title="Purpose" note="Orientation in a hierarchy, not history.">
    <p>A breadcrumb answers two questions and no others: <strong>where am I</strong>, and <strong>what contains this</strong>. It is a static path through a tree the product actually has — site → area → line → work order — not a record of how the user got here. If the trail would differ depending on which link the user followed, it is history, and history belongs to the browser's back button.</p>

      <li><strong>Do not use</strong> as the only way up. The trail is 12px text; a page whose primary escape is a breadcrumb has no primary escape.</li>

    <div className="demo col">

      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {[['1','Landmark — <nav aria-label="Breadcrumb"> wrapping an <ol>. The list is ordered because the order is the meaning.'],
          ['2','Root crumb — the top of the hierarchy, optionally with one icon. Usually the tenant, site or workspace.'],

    </div>

    <p>There is no visited state. A trail is not a set of results to work through, and a differently-coloured ancestor would imply the hierarchy had changed rather than that the user had been there.</p>

  <Sec n="07" title="Keyboard" note="It is a list of links. That is the whole story.">

    <p>Three or four extra tab stops at the top of a page is the honest cost of a breadcrumb, and part of why it is not for shallow hierarchies. It is also why the trail is early in the DOM and inside a <code>nav</code> landmark: a keyboard or screen-reader user who does not want the trail can skip the landmark in one move.</p>
    <div className="demo"><Breadcrumb items={DEEP} maxItems={4} /><Text size="xs" tone="tertiary">Tab through: two links, the <kbd>…</kbd> menu, one more link, then the current crumb is skipped.</Text></div>

  <Sec n="08" title="Accessibility" note="A landmark, an ordered list, and aria-current.">
    <ul>
      <li><strong>Landmark.</strong> <code>&lt;nav aria-label="Breadcrumb"&gt;</code> — named, because a page with an unnamed second nav landmark gives a screen-reader user two identical entries in the landmark list.</li>
      <li><strong>Ordered list.</strong> <code>&lt;ol&gt;</code>/<code>&lt;li&gt;</code>, so the sequence is structural. "List, 4 items, item 3 of 4" is orientation that no amount of styling conveys.</li>
      <li><strong><code>aria-current="page"</code></strong> on the last crumb, which is a <code>span</code>, not a link and not an <code>aria-disabled</code> link. This is the single most important line in the component.</li>
      <li><strong>Separators are <code>aria-hidden</code>.</strong> The chevron is decoration; the slash variant is a text node hidden the same way, so a trail is never read as "Tilburg slash Assembly slash Line 4".</li>
      <li><strong>Icons carry no meaning.</strong> The root icon is decorative and hidden — the label beside it is the name.</li>
      <li><strong>The overflow trigger has a real name</strong> — "Show 3 skipped levels" — because "…" announces as nothing. Its Menu is labelled "Skipped levels".</li>
      <li><strong>Colour is never the only cue.</strong> Ancestors underline on hover and carry a focus ring; the current crumb is distinguished by weight and by <code>aria-current</code>, not by tint alone.</li>
      <li><strong>Truncated labels keep their full text</strong> in the accessible name — an ellipsis is a visual measure, not an abbreviation of the page's identity.</li>
    </ul>

  <Sec n="09" title="Motion" note="Almost none, and that is the specification.">
    <T cols={['Moment','Motion','Tokens']} rows={[

    <p>An animated underline that grows from the left, a trail that slides in on navigation, crumbs that fade in sequence — all of these have been shipped by someone, and all of them animate furniture the user reads in a quarter of a second and then ignores. The trail is the first thing on the page; anything moving there delays the page's actual content and draws the eye upward, away from it.</p>

        <li><strong>"Home".</strong> Name the root: the tenant, the site, the workspace.</li>

        <li><strong>Counts, badges or states</strong> in a crumb. The trail says where, not how it is doing.</li>
        <li><strong>Invented levels</strong> to make the trail look complete. A crumb with no page is not a crumb.</li>
      </ul></div>
    </div>
    <p>Labels are also the one place a hierarchy's inconsistencies show up publicly. If the sidebar calls it "Areas", the table header calls it "Area" and the crumb calls it "Assembly line group", the product has three names for one thing — and the breadcrumb is where a user finally notices.</p>

      <li><strong>The overflow menu inherits Menu's placement</strong> — it flips and shifts to stay in the viewport, so a collapsed trail works in a narrow drawer with no configuration.</li>

      <div className="narrow"><Breadcrumb items={DEEP} maxItems={3} /></div>
      <div className="narrow"><Breadcrumb items={[{label:'Torque head assembly, station 3',href:'#a'},{label:'WO-88431'}]} /></div>
      <Text size="xs" tone="tertiary">280px: collapsed to root · … · parent · current, and a long ancestor label truncated at its cap.</Text>
    </div>
  </Sec>

  <Sec n="12" title="Anti Patterns" note="Six, and the first two are the common ones.">
    <div className="two">
      <div className="pane dont"><h3>The two that matter</h3><ul>
        <li><strong>A linked current crumb.</strong> A link to this page is a dead control, and it removes the one signal that says which crumb you are on. Text plus <code>aria-current</code>, always.</li>
        <li><strong>A breadcrumb as history.</strong> If the trail depends on the route the user took, it is a back stack. Users read a trail as structure and will be misled the first time it differs between two arrivals at the same page.</li>
      </ul></div>
      <div className="pane dont"><h3>Also don't</h3><ul>
        <li><strong>A trail in a two-level app.</strong> "Alarms › Alarm 3" is a back link with extra chrome.</li>
        <li><strong>A breadcrumb as the primary way up.</strong> 12px text is not a navigation system; the sidebar is.</li>
        <li><strong>Dropdowns on every crumb</strong> to switch siblings. That is a tree, or a Select next to the title — a trail that is eight menus is no longer telling you where you are.</li>
        <li><strong>Trails inside dialogs, drawers or wizards.</strong> The layer is not a place in the hierarchy.</li>
        <li><strong>Truncating the current crumb to "…"</strong> so the trail fits. Collapse the middle; the ends are the point.</li>
        <li><strong>Two trails on one page.</strong> A page has one position in one hierarchy.</li>
      </ul></div>
    </div>
    <p className="warn">The failure to watch for in review is a trail assembled from the router's history rather than from the resource's ancestors. It passes every click-through demo — the demo always arrives the same way — and breaks for the first user who lands from a deep link, which is precisely the user the breadcrumb exists for.</p>
  </Sec>

  <Sec n="13" title="Implementation Notes" note="What the code does, and why it does it that way.">
    <ul>
      <li><strong>The last item is the current page by position</strong>, not by a flag. There is no way to render two current crumbs or none, and no prop for a product to get it wrong.</li>
      <li><strong>It draws its own anchors instead of wrapping <code>Link</code>.</strong> Link's contract is a resting underline, action colour and an <code>href</code> requirement; a trail needs no resting underline, secondary colour, per-size type and a last item with no anchor at all. Wrapping Link would mean fighting four of its defaults, and would tie the trail's colours to the link palette (§ token note below).</li>
      <li><strong>Missing <code>href</code>s warn once per trail change.</strong> A silently non-clickable ancestor is the failure users report as "the breadcrumb is broken", and it is invisible in a screenshot review.</li>
      <li><strong>Collapse takes the first crumb and the last two</strong>, hiding the rest, and only when <code>items.length &gt; maxItems</code> and <code>maxItems &gt;= 3</code>. Below three there is nothing left to collapse into, so the guard refuses rather than producing a trail of ellipses.</li>
      <li><strong>The overflow is a <code>Menu</code>, not bespoke.</strong> Placement, flipping, the viewport gutter, typeahead, Escape and focus return are all Menu's, already reviewed. The rows are commands (Menu has no <code>href</code> support), which is why <code>onNavigate</code> exists — without it the rows fall back to <code>window.location.assign</code>, correct for an MPA and wrong inside a router.</li>
      <li><strong>Separators are outside the crumb's box</strong> and <code>aria-hidden</code>, so a hover underline never runs under the chevron and a copied trail does not carry glyphs.</li>
      <li><strong>Focus-visible is read before drawing the ring</strong>, matching Tabs and Accordion: a mouse press on a crumb navigates without leaving a ring behind.</li>
      <li><strong>Each crumb caps at <code>max-width: 220px</code></strong> with <code>text-overflow: ellipsis</code>. A fixed cap rather than a share of the container, because a trail whose crumbs resize as siblings are added is unreadable at every intermediate width.</li>
      <li><strong>7 tokens, no reference to <code>--link-*</code>.</strong> The trail is quieter than a link by intent; retargeting the link palette for prose must not brighten every page header in the product.</li>
    </ul>
    <div className="tokenlist">
      {['--breadcrumb-text','--breadcrumb-text-hover','--breadcrumb-text-current','--breadcrumb-separator','--breadcrumb-icon','--breadcrumb-overflow-text','--breadcrumb-focus-ring'].map(t=><span key={t}>{t}</span>)}
    </div>
  </Sec>

  <Sec n="14" title="Developer Notes" note="Wiring it into a product.">
    <pre>{`import { Breadcrumb } from '@meridian/navigation';

// Build the trail from the RESOURCE's ancestors, never from history.
const trail = [
  { label: site.name, href: \`/sites/\${site.id}\`, icon: 'factory' },
  { label: area.name, href: \`/sites/\${site.id}/areas/\${area.id}\` },
  { label: line.name, href: \`/lines/\${line.id}\` },
  { label: order.code },                       // current page — no href
];

<PageHeader
  above={<Breadcrumb items={trail} maxItems={4} onNavigate={(i) => router.push(i.href)} />}
  title={order.code}
/>

// A path-shaped hierarchy.
<Breadcrumb variant="slash" size="sm" items={path.map((p, i, all) => (
  { label: p.name, href: i === all.length - 1 ? undefined : p.url }))} />`}</pre>
    <ul>
      <li><strong>Derive the trail server-side with the resource</strong>, in one payload. A trail assembled from three client fetches renders in three stages, and the page header jumps twice before the user has read the title.</li>
      <li><strong>Do not render a placeholder trail while loading.</strong> Skeleton crumbs are furniture pretending to be orientation. Render the trail when you know it; the title can arrive first.</li>
      <li><strong>Pass <code>onNavigate</code> in any SPA.</strong> Ancestor crumbs are real anchors your router already intercepts, but the collapsed menu's rows are not — without <code>onNavigate</code> they do a full page load.</li>
      <li><strong>Keep <code>label</code> identical to the destination's page title.</strong> The mismatch between crumb and title is the most-reported inconsistency in products with a trail.</li>
      <li><strong>Do not put the trail inside the <code>&lt;h1&gt;</code></strong> or use headings for crumbs. The trail is a nav landmark; the page has exactly one h1 and it is the title below.</li>
      <li><strong>Testing hooks:</strong> the landmark is <code>nav[aria-label="Breadcrumb"]</code>, ancestors are its <code>a[href]</code> in order, and the current page is <code>[aria-current="page"]</code>. The container also carries <code>[data-breadcrumb="chevron|slash"]</code>. Assert that exactly one element has <code>aria-current</code>.</li>
    </ul>
    <div className="demo col">
      <div className="head">
        <Breadcrumb items={DEEP} maxItems={4} />
        <h4>WO-88431</h4>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',paddingTop:4}}>
          <Badge tone="warning" dot>Awaiting parts</Badge>
          <Text size="xs" tone="tertiary">Opened 3 Sep · Torque head, station 3</Text>
        </div>
      </div>
    </div>
  </Sec>
</div>
);}
