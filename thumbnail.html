<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:0 0 75%;display:grid;place-items:center;background:var(--blue-600)}
.mark{font-family:var(--font-sans);font-size:150px;font-weight:600;letter-spacing:-0.045em;color:#fff;white-space:nowrap}
.strip{flex:1;display:flex;flex-direction:column}
.strip div{flex:1}</style></head>
<body><div class="main"><span class="mark">Meridian</span></div>
<div class="strip"><div style="background:var(--orange-500)"></div><div style="background:var(--green-500)"></div><div style="background:var(--red-600)"></div><div style="background:var(--blue-900)"></div></div></body></html>
