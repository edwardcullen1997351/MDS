<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-card)}.r{display:flex;gap:8px}.c{display:flex;flex-direction:column}.mono{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-tertiary);letter-spacing:0}.cap{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);font-weight:var(--weight-semibold)}</style></head><body><style>@keyframes slide{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(220px)}}</style><div class="c" style="gap:10px"><div class="r" style="align-items:center;gap:12px"><div class="mono" style="width:118px">--duration-instant</div><div style="flex:1;height:6px;background:var(--surface-sunken);border-radius:var(--radius-pill);position:relative;overflow:hidden"><div style="position:absolute;top:0;left:0;width:34px;height:6px;border-radius:var(--radius-pill);background:var(--action-solid);animation:slide 2.4s var(--ease-out) infinite alternate"></div></div><div style="width:150px;font-size:var(--text-2xs);color:var(--text-secondary)">90ms · hover, press, tint</div></div><div class="r" style="align-items:center;gap:12px"><div class="mono" style="width:118px">--duration-fast</div><div style="flex:1;height:6px;background:var(--surface-sunken);border-radius:var(--radius-pill);position:relative;overflow:hidden"><div style="position:absolute;top:0;left:0;width:34px;height:6px;border-radius:var(--radius-pill);background:var(--action-solid);animation:slide 2.4s var(--ease-out) infinite alternate"></div></div><div style="width:150px;font-size:var(--text-2xs);color:var(--text-secondary)">140ms · control state, tooltip</div></div><div class="r" style="align-items:center;gap:12px"><div class="mono" style="width:118px">--duration-base</div><div style="flex:1;height:6px;background:var(--surface-sunken);border-radius:var(--radius-pill);position:relative;overflow:hidden"><div style="position:absolute;top:0;left:0;width:34px;height:6px;border-radius:var(--radius-pill);background:var(--action-solid);animation:slide 2.4s var(--ease-out) infinite alternate"></div></div><div style="width:150px;font-size:var(--text-2xs);color:var(--text-secondary)">200ms · panel, tab, toast</div></div><div class="r" style="align-items:center;gap:12px"><div class="mono" style="width:118px">--duration-slow</div><div style="flex:1;height:6px;background:var(--surface-sunken);border-radius:var(--radius-pill);position:relative;overflow:hidden"><div style="position:absolute;top:0;left:0;width:34px;height:6px;border-radius:var(--radius-pill);background:var(--action-solid);animation:slide 2.4s var(--ease-out) infinite alternate"></div></div><div style="width:150px;font-size:var(--text-2xs);color:var(--text-secondary)">320ms · dialog, drawer</div></div></div></body></html>
