dding:0 var(--control-px-md);background:var(--surface-card);border:1px solid var(--status-critical-solid);border-radius:var(--radius-sm);box-shadow:var(--ring-danger);font-size:var(--text-sm)">Invalid</div><div class="mono">invalid</div></div></div></body></html>
