<!-- @dsCard group="Colors" viewport="700x200" name="Semantic hues" subtitle="Green, amber and red — state only, never decoration" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-card)}.r{display:flex;gap:8px}.c{display:flex;flex-direction:column}.mono{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-tertiary);letter-spacing:0}.cap{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);font-weight:var(--weight-semibold)}</style></head><body><div class="c" style="gap:10px"><div class="r" style="align-items:center;gap:10px"><div style="width:78px;font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--text-secondary)">Success</div><div class="c" style="flex:1"><div style="height:24px;background:var(--green-50);border-radius:var(--radius-xs)"></div><div class="mono">green-50</div></div><div class="c" style="flex:1"><div style="height:24px;background:var(--green-100);border-radius:var(--radius-xs)"></div><div class="mono">green-100</div></div><div class="c" style="flex:1"><div style="height:24px;background:var(--green-500);border-radius:var(--radius-xs)"></div><div class="mono">green-500</div></div><div class="c" style="flex:1"><div style="height:24px;background:var(--green-600);border-radius:var(--radius-xs)"></div><div class="mono">green-600</div></div><div class="c" style="flex:1"><div style="height:24px;background:var(--green-700);border-radius:var(--radius-xs)"></div><div class="mono">green-700</div></div></div><div class="r" style="align-items:center;gap:10px"><div style="width:78px;font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--text-secondary)">Warning</div><div class="c" style="flex:1"><div style="height:24px;background:var(--orange-50);border-radius:var(--radius-xs)"></div><div class="mono">amber-50</div></div><div class="c" style="flex:1"><div style="height:24px;background:var(--orange-100);border-radius:var(--radius-xs)"></div><div class="mono">amber-100</div></div><div class="c" style="flex:1"><div style="height:24px;background:var(--orange-500);border-radius:var(--radius-xs)"></div><div class="mono">amber-500</div></div><div class="c" style="flex:1"><div style="height:24px;background:var(--orange-600);border-radius:var(--radius-xs)"></div><div class="mono">amber-600</div></div><div class="c" style="flex:1"><div style="height:24px;background:var(--orange-700);border-radius:var(--radius-xs)"></div><div class="mono">amber-700</div></div></div><div class="r" style="align-items:center;gap:10px"><div style="width:78px;font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--text-secondary)">Danger</div><div class="c" style="flex:1"><div style="height:24px;background:var(--red-50);border-radius:var(--radius-xs)"></div><div class="mono">red-50</div></div><div class="c" style="flex:1"><div style="height:24px;background:var(--red-100);border-radius:var(--radius-xs)"></div><div class="mono">red-100</div></div><div class="c" style="flex:1"><div style="height:24px;background:var(--red-500);border-radius:var(--radius-xs)"></div><div class="mono">red-500</div></div><div class="c" style="flex:1"><div style="height:24px;background:var(--red-600);border-radius:var(--radius-xs)"></div><div class="mono">red-600</div></div><div class="c" style="flex:1"><div style="height:24px;background:var(--red-700);border-radius:var(--radius-xs)"></div><div class="mono">red-700</div></div></div></div></body></html>
