<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-card)}.r{display:flex;gap:8px}.c{display:flex;flex-direction:column}.mono{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-tertiary);letter-spacing:0}.cap{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);font-weight:var(--weight-semibold)}</style></head><body><div class="r" style="gap:10px;align-items:flex-end"><div class="c" style="flex:1"><div style="height:28px;background:var(--viz-1);border-radius:var(--radius-xs) var(--radius-xs) 0 0"></div><div class="mono" style="margin-top:6px">viz-1</div></div><div class="c" style="flex:1"><div style="height:36px;background:var(--viz-2);border-radius:var(--radius-xs) var(--radius-xs) 0 0"></div><div class="mono" style="margin-top:6px">viz-2</div></div><div class="c" style="flex:1"><div style="height:44px;background:var(--viz-3);border-radius:var(--radius-xs) var(--radius-xs) 0 0"></div><div class="mono" style="margin-top:6px">viz-3</div></div><div class="c" style="flex:1"><div style="height:52px;background:var(--viz-4);border-radius:var(--radius-xs) var(--radius-xs) 0 0"></div><div class="mono" style="margin-top:6px">viz-4</div></div><div class="c" style="flex:1"><div style="height:60px;background:var(--viz-5);border-radius:var(--radius-xs) var(--radius-xs) 0 0"></div><div class="mono" style="margin-top:6px">viz-5</div></div><div class="c" style="flex:1"><div style="height:68px;background:var(--viz-6);border-radius:var(--radius-xs) var(--radius-xs) 0 0"></div><div class="mono" style="margin-top:6px">viz-6</div></div></div></body></html>
