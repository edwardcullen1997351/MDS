<!-- @dsCard group="Brand" viewport="700x230" name="Voice in the UI" subtitle="Direct, lowercase-averse, no exclamation marks, no emoji" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-card)}.r{display:flex;gap:8px}.c{display:flex;flex-direction:column}.mono{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-tertiary);letter-spacing:0}.cap{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);font-weight:var(--weight-semibold)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
<div class="c" style="gap:8px"><div class="cap" style="color:var(--text-success)">Write</div><div style="font-size:var(--text-sm);color:var(--text-primary)">Deploy queued</div><div style="font-size:var(--text-sm);color:var(--text-primary)">Rollout starts in a few seconds.</div><div style="font-size:var(--text-sm);color:var(--text-primary)">Name is already taken</div><div style="font-size:var(--text-sm);color:var(--text-primary)">Delete cluster</div><div style="font-size:var(--text-sm);color:var(--text-primary)">p95 over the last hour</div></div>
<div class="c" style="gap:8px"><div class="cap" style="color:var(--text-critical)">Avoid</div><div style="font-size:var(--text-sm);color:var(--text-tertiary);text-decoration:line-through;text-decoration-color:var(--border-strong)">Success! 🎉</div><div style="font-size:var(--text-sm);color:var(--text-tertiary);text-decoration:line-through;text-decoration-color:var(--border-strong)">Your deployment has been successfully queued for rollout.</div><div style="font-size:var(--text-sm);color:var(--text-tertiary);text-decoration:line-through;text-decoration-color:var(--border-strong)">Invalid input</div><div style="font-size:var(--text-sm);color:var(--text-tertiary);text-decoration:line-through;text-decoration-color:var(--border-strong)">OK</div><div style="font-size:var(--text-sm);color:var(--text-tertiary);text-decoration:line-through;text-decoration-color:var(--border-strong)">95th percentile latency metric value</div></div></div></body></html>
