<!-- @dsCard group="Colors" viewport="700x160" name="Text colours" subtitle="Four levels of hierarchy plus link and status text" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-card)}.r{display:flex;gap:8px}.c{display:flex;flex-direction:column}.mono{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-tertiary);letter-spacing:0}.cap{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);font-weight:var(--weight-semibold)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px 18px"><div class="c"><span style="color:var(--text-primary);font-size:var(--text-sm);font-weight:var(--weight-medium)">Primary — headings, values</span><span class="mono">--text-primary</span></div><div class="c"><span style="color:var(--text-secondary);font-size:var(--text-sm);font-weight:var(--weight-medium)">Secondary — labels, body</span><span class="mono">--text-secondary</span></div><div class="c"><span style="color:var(--text-tertiary);font-size:var(--text-sm);font-weight:var(--weight-medium)">Tertiary — hints, meta</span><span class="mono">--text-tertiary</span></div><div class="c"><span style="color:var(--text-disabled);font-size:var(--text-sm);font-weight:var(--weight-medium)">Disabled</span><span class="mono">--text-disabled</span></div><div class="c"><span style="color:var(--text-link);font-size:var(--text-sm);font-weight:var(--weight-medium)">Link</span><span class="mono">--text-link</span></div><div class="c"><span style="color:var(--text-success);font-size:var(--text-sm);font-weight:var(--weight-medium)">Success</span><span class="mono">--text-success</span></div><div class="c"><span style="color:var(--text-warning);font-size:var(--text-sm);font-weight:var(--weight-medium)">Warning</span><span class="mono">--text-warning</span></div><div class="c"><span style="color:var(--text-critical);font-size:var(--text-sm);font-weight:var(--weight-medium)">Danger</span><span class="mono">--text-critical</span></div></div></body></html>
