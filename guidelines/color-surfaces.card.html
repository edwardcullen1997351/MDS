<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-card)}.r{display:flex;gap:8px}.c{display:flex;flex-direction:column}.mono{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-tertiary);letter-spacing:0}.cap{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);font-weight:var(--weight-semibold)}</style></head><body><div class="r" style="gap:10px"><div class="c" style="flex:1"><div style="height:54px;background:var(--background-page);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div><div style="margin-top:6px;font-size:var(--text-2xs);font-weight:var(--weight-semibold);color:var(--text-secondary)">Page</div><div class="mono">page</div></div><div class="c" style="flex:1"><div style="height:54px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div><div style="margin-top:6px;font-size:var(--text-2xs);font-weight:var(--weight-semibold);color:var(--text-secondary)">Card</div><div class="mono">card</div></div><div class="c" style="flex:1"><div style="height:54px;background:var(--surface-sunken);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div><div style="margin-top:6px;font-size:var(--text-2xs);font-weight:var(--weight-semibold);color:var(--text-secondary)">Sunken</div><div class="mono">sunken</div></div><div class="c" style="flex:1"><div style="height:54px;background:var(--surface-hover);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div><div style="margin-top:6px;font-size:var(--text-2xs);font-weight:var(--weight-semibold);color:var(--text-secondary)">Hover</div><div class="mono">hover</div></div><div class="c" style="flex:1"><div style="height:54px;background:var(--surface-active);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div><div style="margin-top:6px;font-size:var(--text-2xs);font-weight:var(--weight-semibold);color:var(--text-secondary)">Active</div><div class="mono">active</div></div><div class="c" style="flex:1"><div style="height:54px;background:var(--surface-selected);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div><div style="margin-top:6px;font-size:var(--text-2xs);font-weight:var(--weight-semibold);color:var(--text-secondary)">Selected</div><div class="mono">selected</div></div><div class="c" style="flex:1"><div style="height:54px;background:var(--surface-inverse);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div><div style="margin-top:6px;font-size:var(--text-2xs);font-weight:var(--weight-semibold);color:var(--text-secondary)">Inverse</div><div class="mono">inverse</div></div></div></body></html>
