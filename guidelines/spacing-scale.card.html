;height:var(--space-10);background:var(--action-solid);border-radius:2px"></div><div class="mono">40</div></div><div class="c" style="align-items:center;gap:6px"><div style="width:var(--space-12);height:var(--space-12);background:var(--action-solid);border-radius:2px"></div><div class="mono">48</div></div><div class="c" style="align-items:center;gap:6px"><div style="width:var(--space-16);height:var(--space-16);background:var(--action-solid);border-radius:2px"></div><div class="mono">64</div></div></div></body></html>
