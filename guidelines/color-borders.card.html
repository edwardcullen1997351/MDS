<!-- @dsCard group="Colors" viewport="700x140" name="Borders" subtitle="Hairlines do the structural work; strong on hover, blue on focus" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-card)}.r{display:flex;gap:8px}.c{display:flex;flex-direction:column}.mono{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-tertiary);letter-spacing:0}.cap{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);font-weight:var(--weight-semibold)}</style></head><body><div class="r" style="gap:14px"><div class="c" style="flex:1"><div style="height:48px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-sm)"></div><div style="margin-top:6px;font-size:var(--text-2xs);color:var(--text-secondary)">Subtle — row rules</div><div class="mono">--border-subtle</div></div><div class="c" style="flex:1"><div style="height:48px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div><div style="margin-top:6px;font-size:var(--text-2xs);color:var(--text-secondary)">Default — cards, controls</div><div class="mono">--border-default</div></div><div class="c" style="flex:1"><div style="height:48px;background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-sm)"></div><div style="margin-top:6px;font-size:var(--text-2xs);color:var(--text-secondary)">Strong — hover, emphasis</div><div class="mono">--border-strong</div></div><div class="c" style="flex:1"><div style="height:48px;background:var(--surface-card);border:1px solid var(--border-focus);border-radius:var(--radius-sm)"></div><div style="margin-top:6px;font-size:var(--text-2xs);color:var(--text-secondary)">Focus — active control</div><div class="mono">--border-focus</div></div></div></body></html>
