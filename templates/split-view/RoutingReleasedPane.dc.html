<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div style="display:flex;flex-direction:column;min-height:0;width:100%">
<x-import component-from-global-scope="MeridianDesignSystem_962c43.Stack" gap="{{ 4 }}" hint-size="100%,100%">

<div style="display:flex;flex-direction:column;gap:4px">
<h2 id="pane-released-heading" style="margin:0;font-size:var(--text-md);font-weight:var(--weight-semibold)">Released routing — what the shop is running</h2>
<span style="font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-tertiary)">{{ subline }}</span>
</div>

<sc-if value="{{ toolbars }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="MeridianDesignSystem_962c43.Toolbar" label="Released routing view" size="sm" overflow="none" hint-size="100%,38px">
<x-import component-from-global-scope="MeridianDesignSystem_962c43.Select" options="{{ revs }}" value="{{ rev }}" onChange="{{ onRev }}" size="sm" aria-label="Released revision to read against" hint-size="230px,28px"></x-import>
<x-import component-from-global-scope="MeridianDesignSystem_962c43.Tag" size="sm" font="mono" hint-size="110px,22px">read only</x-import>
</x-import>
</sc-if>

<sc-if value="{{ paneScroll }}" hint-placeholder-val="{{ true }}">
<div style="max-height:520px;min-height:220px;overflow:auto;border:var(--border-hairline);border-radius:var(--radius-md);background:var(--surface-card)">
<x-import component-from-global-scope="MeridianDesignSystem_962c43.Table" columns="{{ columns }}" rows="{{ ops }}" row-key="id" caption="Released routing, HSG-3360-B, operations in sequence" sticky-header="{{ true }}" min-width="520px" aria-labelledby="pane-released-heading" hint-size="100%,520px"></x-import>
</div>
</sc-if>
<sc-if value="{{ workspaceScroll }}" hint-placeholder-val="{{ false }}">
<div style="overflow-x:auto;border:var(--border-hairline);border-radius:var(--radius-md);background:var(--surface-card)">
<x-import component-from-global-scope="MeridianDesignSystem_962c43.Table" columns="{{ columns }}" rows="{{ ops }}" row-key="id" caption="Released routing, HSG-3360-B, operations in sequence" min-width="520px" aria-labelledby="pane-released-heading" hint-size="100%,520px"></x-import>
</div>
</sc-if>

<x-import component-from-global-scope="MeridianDesignSystem_962c43.DescriptionList" items="{{ facts }}" layout="stacked" size="sm" divided="{{ true }}" hint-size="100%,140px"></x-import>

<p style="margin:0;font-size:var(--text-2xs);color:var(--text-tertiary);text-wrap:pretty">This pane is the record, not a preview of the draft. Changing it needs its own ECN — nothing typed in the draft pane reaches it.</p>

</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:700,&quot;height&quot;:760},&quot;ops&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;},&quot;rev&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Rev C — released 2026-06-12 (IST)&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onRev&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e: any) =&gt; void&quot;},&quot;toolbars&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;overflow&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pane&quot;,&quot;workspace&quot;],&quot;default&quot;:&quot;pane&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const ops = this.props.ops || [];
    const rev = this.props.rev || '';
    const revC = rev.indexOf('Rev C') === 0;
    const total = ops.reduce((t, o) => t + (parseFloat(o.cycle) || 0), 0);
    const setup = ops.reduce((t, o) => t + (o.setup || 0), 0);
    const pane = this.props.overflow === 'pane';
    return {
      ops,
      rev,
      onRev: this.props.onRev,
      toolbars: this.props.toolbars ?? true,
      revs: ['Rev C — released 2026-06-12 (IST)', 'Rev B — released 2025-11-03 (IST)'],
      paneScroll: pane,
      workspaceScroll: !pane,
      subline: (revC ? 'Rev C' : 'Rev B') + ' \u00b7 ' + ops.length + ' operations \u00b7 ' + total.toFixed(1) + ' min/pc \u00b7 ' + setup + ' min setup',
      columns: [
        { key: 'op', header: 'Op', mono: true, width: '54px' },
        { key: 'desc', header: 'Operation', wrap: true },
        { key: 'wc', header: 'Work centre', mono: true, width: '108px' },
        { key: 'setup', header: 'Setup', align: 'right', mono: true, width: '68px', render: (r) => r.setup + ' min' },
        { key: 'cycle', header: 'Cycle min/pc', align: 'right', mono: true, width: '104px' },
        { key: 'tool', header: 'Tooling', wrap: true },
      ],
      facts: [
        { term: 'Released by', value: revC ? 'Nitin Gokhale, manufacturing engineering — 2026-06-12 (IST)' : 'Nitin Gokhale, manufacturing engineering — 2025-11-03 (IST)' },
        { term: 'Standard cost basis', value: revC ? '\u20b91,240 per piece at 2026-07 rates' : '\u20b91,186 per piece at 2025-10 rates', mono: true },
        { term: 'Built to date', value: revC ? '18,400 pieces \u00b7 last run 2026-09-05 (IST) on B shift' : '41,900 pieces \u00b7 superseded' },
        { term: 'Open quality history', value: revC ? '3 CMM rejections at op 80 since June, all burr at the bore mouth' : 'closed' },
      ],
    };
  }
}
</script>
</body>
</html>
