<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div style="display:flex;flex-direction:column;min-height:0;width:100%">
<x-import component-from-global-scope="MeridianDesignSystem_962c43.Stack" gap="{{ 4 }}" hint-size="100%,100%">

<div style="display:flex;flex-direction:column;gap:4px">
<h2 id="pane-draft-heading" style="margin:0;font-size:var(--text-md);font-weight:var(--weight-semibold)">Draft routing — rev D</h2>
<span style="font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-tertiary)">{{ subline }}</span>
</div>

<sc-if value="{{ toolbars }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="MeridianDesignSystem_962c43.Toolbar" label="Draft routing actions" size="sm" overflow="none" hint-size="100%,38px">
<x-import component-from-global-scope="MeridianDesignSystem_962c43.Button" size="sm" variant="secondary" onClick="{{ on.add }}" hint-size="130px,28px">Add operation</x-import>
<x-import component-from-global-scope="MeridianDesignSystem_962c43.Tag" size="sm" font="mono" hint-size="110px,22px">{{ deltaTag }}</x-import>
<x-import component-from-global-scope="MeridianDesignSystem_962c43.Tag" size="sm" font="mono" hint-size="120px,22px">ECN-2026-0412</x-import>
</x-import>
</sc-if>

<sc-if value="{{ paneScroll }}" hint-placeholder-val="{{ true }}">
<div style="max-height:520px;min-height:220px;overflow:auto;border:var(--border-hairline);border-radius:var(--radius-md);background:var(--surface-card)">
<x-import component-from-global-scope="MeridianDesignSystem_962c43.Table" columns="{{ columns }}" rows="{{ ops }}" row-key="id" caption="Draft routing rev D, HSG-3360-B, operations in sequence" sticky-header="{{ true }}" min-width="560px" aria-labelledby="pane-draft-heading" hint-size="100%,520px"></x-import>
</div>
</sc-if>
<sc-if value="{{ workspaceScroll }}" hint-placeholder-val="{{ false }}">
<div style="overflow-x:auto;border:var(--border-hairline);border-radius:var(--radius-md);background:var(--surface-card)">
<x-import component-from-global-scope="MeridianDesignSystem_962c43.Table" columns="{{ columns }}" rows="{{ ops }}" row-key="id" caption="Draft routing rev D, HSG-3360-B, operations in sequence" min-width="560px" aria-labelledby="pane-draft-heading" hint-size="100%,520px"></x-import>
</div>
</sc-if>

<sc-if value="{{ saved }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="MeridianDesignSystem_962c43.Alert" tone="success" size="sm" title="Draft rev D saved" hint-size="100%,60px">Saved 2026-09-08 15:20 (IST) by Kavita Joshi. Nitin Gokhale is notified to approve before rev D can be released to the shop floor.</x-import>
</sc-if>

<div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-top:var(--border-hairline);padding-top:14px">
<x-import component-from-global-scope="MeridianDesignSystem_962c43.Button" variant="primary" size="sm" onClick="{{ on.save }}" hint-size="130px,30px">Save draft</x-import>
<x-import component-from-global-scope="MeridianDesignSystem_962c43.Button" variant="secondary" size="sm" disabled="{{ clean }}" onClick="{{ on.discard }}" hint-size="120px,30px">Discard edits</x-import>
<span style="font-size:var(--text-xs);color:var(--text-secondary);text-wrap:pretty">{{ saveNote }}</span>
</div>

</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:760},&quot;ops&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;},&quot;on&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, Function&gt;&quot;},&quot;dirty&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;saved&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;toolbars&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;overflow&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pane&quot;,&quot;workspace&quot;],&quot;default&quot;:&quot;pane&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const ops = this.props.ops || [];
    const on = this.props.on || {};
    const dirty = this.props.dirty ?? 0;
    const R = React.createElement;
    const NS = window.MeridianDesignSystem_962c43 || {};
    const { Badge, Input, Select } = NS;
    const tone = { unchanged: 'neutral', changed: 'warning', added: 'success', removed: 'critical' };
    const label = { unchanged: 'unchanged', changed: 'changed', added: 'added', removed: 'removed' };
    const centres = ['SAW-02', 'VMC-11', 'VMC-12', 'HMC-04', 'BN-3 bench', 'WSH-01', 'CMM-02'];
    const changed = ops.filter((o) => o.status !== 'unchanged').length;
    const total = ops.filter((o) => o.status !== 'removed')
      .reduce((t, o) => t + (parseFloat(o.cycle) || 0), 0);
    const pane = this.props.overflow === 'pane';
    return {
      ops,
      on,
      clean: dirty === 0,
      saved: !!this.props.saved,
      toolbars: this.props.toolbars ?? true,
      paneScroll: pane,
      workspaceScroll: !pane,
      subline: changed + ' of ' + ops.length + ' operations differ from the released routing \u00b7 ' + total.toFixed(1) + ' min/pc total cycle',
      deltaTag: dirty ? dirty + ' unsaved' : 'no local edits',
      saveNote: dirty
        ? 'Nothing reaches the shop floor until you save, and rev D still needs Nitin Gokhale to approve after that.'
        : 'Rev C stays the running routing until rev D is saved and approved.',
      columns: [
        { key: 'op', header: 'Op', mono: true, width: '54px' },
        { key: 'desc', header: 'Operation', wrap: true },
        { key: 'wc', header: 'Work centre', width: '132px', render: (r) => (Select
          ? R(Select, { options: centres, value: r.wc, size: 'sm', onChange: on.wc ? on.wc(r.id) : undefined, 'aria-label': 'Work centre for operation ' + r.op })
          : r.wc) },
        { key: 'setup', header: 'Setup', align: 'right', mono: true, width: '68px', render: (r) => r.setup + ' min' },
        { key: 'cycle', header: 'Cycle min/pc', align: 'right', width: '104px', render: (r) => (Input
          ? R(Input, { value: r.cycle, size: 'sm', inputMode: 'decimal', style: { textAlign: 'right' }, onChange: on.cycle ? on.cycle(r.id) : undefined, 'aria-label': 'Cycle time for operation ' + r.op })
          : r.cycle) },
        { key: 'status', header: 'Against rev C', width: '112px', render: (r) => (Badge ? R(Badge, { tone: tone[r.status], size: 'sm' }, label[r.status]) : label[r.status]) },
        { key: 'note', header: 'Why', wrap: true, render: (r) => r.note || '\u2014' },
      ],
    };
  }
}
</script>
</body>
</html>
