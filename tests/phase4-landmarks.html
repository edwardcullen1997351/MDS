<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Phase 4 assembly landmark check</title>
<div id="result">PENDING</div>
<script>
const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
const checks = [];

async function run() {
  const index = await fetch('/index.json').then(response => response.json());
  const ids = Object.keys(index.entries).filter(id => id.startsWith('reference-assemblies-'));
  for (const id of ids) {
    const frame = document.createElement('iframe');
    frame.src = `/iframe.html?id=${id}&viewMode=story`;
    frame.style.display = 'none';
    document.body.append(frame);
    await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    let root;
    for (let attempt = 0; attempt < 100; attempt++) {
      root = frame.contentDocument?.querySelector('#storybook-root .reference-assembly-root, #storybook-root .ds-planner-root');
      if (root?.querySelector('main:not([role]),main[role="main"],[role="main"]')) break;
      await delay(50);
    }
    const mains = root?.querySelectorAll('main:not([role]),main[role="main"],[role="main"]') ?? [];
    const secondary = [...(root?.querySelectorAll('nav:not([role]),nav[role="navigation"],aside:not([role]),aside[role="complementary"]') ?? [])];
    const labels = secondary.map(region => region.getAttribute('aria-label')?.trim());
    const nestedControls = root?.querySelectorAll('button button,button a,a button,a a,[role="button"] button,[role="button"] a,[role="link"] button,[role="link"] a') ?? [];
    checks.push(`${id}-main:${mains.length === 1 ? 'pass' : `fail(${mains.length},raw=${root?.querySelectorAll('main').length ?? 0},children=${root?.children.length ?? 0})`}`);
    checks.push(`${id}-secondary:${labels.every(Boolean) && new Set(labels).size === labels.length ? 'pass' : 'fail'}`);
    checks.push(`${id}-nested-controls:${nestedControls.length === 0 ? 'pass' : 'fail'}`);
    frame.remove();
  }
  document.querySelector('#result').textContent = `PHASE4_LANDMARKS ${checks.join(' ')}`;
}

run().catch(error => {
  document.querySelector('#result').textContent = `PHASE4_LANDMARKS script:fail ${String(error)}`;
});
</script>
</html>
