<!-- @dsCard group="Components" viewport="780x360" name="Navigation — local" subtitle="L2 Section and workspace navigation: grouped categories, badge counts, and scoped sub-domains" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Local Navigation</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--surface-card);padding:20px;font-family:var(--font-sans)}
.row{display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);font-weight:var(--weight-semibold)}
.local-nav-box{width:220px;border:var(--border-hairline);border-radius:var(--radius-md);overflow:hidden;background:var(--surface-card);display:flex;flex-direction:column;padding:8px 0}
.local-nav-hdr{padding:4px 12px 8px;font-size:var(--text-xs);font-weight:var(--weight-semibold);border-bottom:var(--border-subtle);display:flex;justify-content:space-between;align-items:center}
.local-grp-hdr{font-size:9px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);padding:8px 12px 2px;font-weight:var(--weight-semibold)}
.local-item{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;font-size:var(--text-xs);color:var(--text-secondary);text-decoration:none;border-radius:var(--radius-sm);margin:1px 6px;cursor:pointer}
.local-item.active{background:var(--status-info-soft);color:var(--text-link);font-weight:var(--weight-medium)}
.local-badge{font-size:10px;padding:1px 5px;border-radius:10px;background:var(--surface-sunken);font-family:var(--font-mono)}
.local-item.active .local-badge{background:var(--action-solid);color:#fff}
</style></head><body><div id="root"></div>
<script type="text/babel">
const { Text } = window.MeridianDesignSystem_962c43;

const GROUPS = [
  {
    group: 'Inspections',
    items: [
      { id: 'incoming', label: 'Incoming Material', badge: 5 },
      { id: 'in-process', label: 'In-Process Checks' },
      { id: 'final', label: 'Final Release', badge: 1 },
    ]
  },
  {
    group: 'Dispositions',
    items: [
      { id: 'ncr', label: 'NC Reports (NCR)', badge: 8 },
      { id: 'vendor-claims', label: 'Vendor Rejections' },
      { id: 'calibration', label: 'Gauge Calibration' },
    ]
  }
];

function Demo(){
  const [active, setActive] = React.useState('ncr');

  return (
    <div className="row">
      <div className="col">
        <span className="lbl">Grouped Local Navigation</span>
        <div className="local-nav-box">
          <div className="local-nav-hdr">
            <span>Quality & NCs</span>
            <span style={{fontSize:9,fontFamily:'var(--font-mono)',color:'var(--text-tertiary)'}}>L2</span>
          </div>
          {GROUPS.map((grp, i) => (
            <div key={i}>
              <div className="local-grp-hdr">{grp.group}</div>
              {grp.items.map(it => (
                <a key={it.id}
                   href={`#${it.id}`}
                   className={`local-item ${active===it.id?'active':''}`}
                   onClick={(e)=>{e.preventDefault();setActive(it.id);}}>
                  <span>{it.label}</span>
                  {it.badge ? <span className="local-badge">{it.badge}</span> : null}
                </a>
              ))}
            </div>
          ))}
        </div>
      </div>

      <div className="col" style={{flex:1,minWidth:240}}>
        <span className="lbl">Scoped Workspace Context</span>
        <div style={{background:'var(--surface-sunken)',border:'var(--border-hairline)',borderRadius:'var(--radius-md)',padding:14,fontSize:'var(--text-xs)'}}>
          <div style={{fontFamily:'var(--font-mono)',marginBottom:6}}>Scope: <strong>/quality/{active}</strong></div>
          <div style={{color:'var(--text-secondary)',lineHeight:1.4}}>
            Active Workspace: <strong>{GROUPS.flatMap(g=>g.items).find(i=>i.id===active)?.label}</strong>. Local navigation groups related workspaces under the parent module without re-drawing or altering global orientation.
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
