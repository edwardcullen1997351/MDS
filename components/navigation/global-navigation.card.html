<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Global Navigation</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--surface-card);padding:20px;font-family:var(--font-sans)}
.row{display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);font-weight:var(--weight-semibold)}
.nav-preview-box{border:var(--border-hairline);border-radius:var(--radius-md);overflow:hidden;background:var(--background-page);display:flex}
.nav-rail-box{width:56px;border:var(--border-hairline);border-radius:var(--radius-md);overflow:hidden;background:var(--surface-card);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px}
.nav-rail-btn{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);text-decoration:none}
.nav-rail-btn.active{background:var(--status-info-soft);color:var(--text-link)}
.nav-side-box{width:220px;border:var(--border-hairline);border-radius:var(--radius-md);overflow:hidden;background:var(--surface-card);display:flex;flex-direction:column}
.nav-side-hdr{padding:10px 12px;border-bottom:var(--border-hairline);display:flex;align-items:center;gap:8px}
.nav-side-item{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;font-size:var(--text-xs);color:var(--text-secondary);text-decoration:none;border-radius:var(--radius-sm);margin:2px 6px;cursor:pointer}
.nav-side-item.active{background:var(--status-info-soft);color:var(--text-link);font-weight:var(--weight-medium)}
.nav-badge{font-size:10px;padding:1px 6px;border-radius:10px;background:var(--surface-sunken);font-family:var(--font-mono)}
.nav-side-item.active .nav-badge{background:var(--action-solid);color:#fff}
</style></head><body><div id="root"></div>
<script type="text/babel">
const { Badge, Text, Button } = window.MeridianDesignSystem_962c43;

const ITEMS = [
  { id: 'planning', label: 'Shift Planning', badge: 3 },
  { id: 'work-orders', label: 'Work Orders', badge: 14 },
  { id: 'quality', label: 'Quality & NCs', badge: 2 },
  { id: 'maintenance', label: 'Maintenance' },
  { id: 'stores', label: 'Stores & BOM' },
];

function Demo(){
  const [active, setActive] = React.useState('work-orders');

  return (
    <div className="row">
      <div className="col">
        <span className="lbl">Expanded Sidebar</span>
        <div className="nav-side-box">
          <div className="nav-side-hdr">
            <div style={{width:22,height:22,borderRadius:'var(--radius-xs)',background:'var(--action-solid)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'bold',fontSize:10,fontFamily:'var(--font-mono)'}}>S</div>
            <div>
              <div style={{fontSize:'var(--text-xs)',fontWeight:'var(--weight-semibold)'}}>Suryodaya Autocomp</div>
              <div style={{fontSize:9,color:'var(--text-tertiary)',fontFamily:'var(--font-mono)'}}>Chakan PL-04 (IST)</div>
            </div>
          </div>
          <div style={{padding:'6px 0'}}>
            {ITEMS.map(it => (
              <a key={it.id}
                 href={`#${it.id}`}
                 className={`nav-side-item ${active===it.id?'active':''}`}
                 onClick={(e)=>{e.preventDefault();setActive(it.id);}}>
                <span style={{display:'flex',alignItems:'center',gap:6}}>
                  <span style={{width:5,height:5,borderRadius:'50%',background:'currentColor'}} />
                  <span>{it.label}</span>
                </span>
                {it.badge ? <span className="nav-badge">{it.badge}</span> : null}
              </a>
            ))}
          </div>
          <div style={{padding:'8px 10px',borderTop:'var(--border-hairline)',background:'var(--background-page)',fontSize:10,color:'var(--text-secondary)'}}>
            Sandeep Kulkarni (Line Supv)
          </div>
        </div>
      </div>

      <div className="col">
        <span className="lbl">Compact Rail</span>
        <div className="nav-rail-box">
          <div style={{width:22,height:22,borderRadius:'var(--radius-xs)',background:'var(--action-solid)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'bold',fontSize:10,fontFamily:'var(--font-mono)'}}>S</div>
          <div style={{width:24,height:1,background:'var(--border-subtle)',margin:'2px 0'}} />
          {ITEMS.map(it => (
            <a key={it.id}
               href={`#${it.id}`}
               title={it.label}
               className={`nav-rail-btn ${active===it.id?'active':''}`}
               onClick={(e)=>{e.preventDefault();setActive(it.id);}}>
              <span style={{width:6,height:6,borderRadius:'50%',background:'currentColor'}} />
            </a>
          ))}
        </div>
      </div>

      <div className="col" style={{flex:1,minWidth:220}}>
        <span className="lbl">Active Route Context</span>
        <div style={{background:'var(--surface-sunken)',border:'var(--border-hairline)',borderRadius:'var(--radius-md)',padding:14,fontSize:'var(--text-xs)'}}>
          <div style={{fontFamily:'var(--font-mono)',marginBottom:6}}>Route: <strong>/plant-04/{active}</strong></div>
          <div style={{color:'var(--text-secondary)',lineHeight:1.4}}>
            Domain: <strong>{ITEMS.find(n=>n.id===active)?.label}</strong>. Global Navigation maintains the primary mental model across shop floor screens and updates <code>aria-current="page"</code> deterministically.
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
