<!-- @dsCard group="Components" viewport="780x360" name="Navigation — pagination" subtitle="Collection page navigation: 1-based indexing, condensed range ellipsis, and boundary disable rules" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Pagination Navigation</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--surface-card);padding:20px;font-family:var(--font-sans)}
.row{display:flex;flex-direction:column;gap:18px}
.col{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);font-weight:var(--weight-semibold)}
.pag-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--background-page);border:var(--border-hairline);border-radius:var(--radius-md);flex-wrap:wrap;gap:8px}
.pag-btn{min-width:30px;height:30px;padding:0 6px;border-radius:var(--radius-sm);border:var(--border-hairline);background:var(--surface-card);font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-secondary);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.pag-btn.active{background:var(--action-solid);color:#fff;border-color:var(--action-solid);font-weight:bold}
.pag-btn:disabled{opacity:0.35;cursor:not-allowed}
</style></head><body><div id="root"></div>
<script type="text/babel">
function Demo(){
  const [page, setPage] = React.useState(3);
  const totalPages = 12;

  return (
    <div className="row">
      <div className="col">
        <span className="lbl">Standard Numbered Pagination (Work Order Ledger)</span>
        <div className="pag-bar">
          <span style={{fontSize:'var(--text-xs)',color:'var(--text-secondary)'}}>
            Showing <strong>{(page-1)*25 + 1}–{Math.min(page*25, 290)}</strong> of <strong>290</strong> orders
          </span>
          <div style={{display:'flex',alignItems:'center',gap:4}}>
            <button type="button" className="pag-btn" disabled={page<=1} onClick={()=>setPage(p=>p-1)}>‹ Prev</button>
            <button type="button" className={`pag-btn ${page===1?'active':''}`} onClick={()=>setPage(1)}>1</button>
            {page > 3 && <span style={{padding:'0 4px',color:'var(--text-tertiary)'}}>…</span>}
            {page > 2 && <button type="button" className="pag-btn" onClick={()=>setPage(page-1)}>{page-1}</button>}
            {page !== 1 && page !== totalPages && <button type="button" className="pag-btn active">{page}</button>}
            {page < totalPages - 1 && <button type="button" className="pag-btn" onClick={()=>setPage(page+1)}>{page+1}</button>}
            {page < totalPages - 2 && <span style={{padding:'0 4px',color:'var(--text-tertiary)'}}>…</span>}
            <button type="button" className={`pag-btn ${page===totalPages?'active':''}`} onClick={()=>setPage(totalPages)}>{totalPages}</button>
            <button type="button" className="pag-btn" disabled={page>=totalPages} onClick={()=>setPage(p=>p+1)}>Next ›</button>
          </div>
        </div>
      </div>

      <div className="col">
        <span className="lbl">Compact Stepped Pagination (Mobile & Tablet)</span>
        <div className="pag-bar" style={{width:260}}>
          <button type="button" className="pag-btn" disabled={page<=1} onClick={()=>setPage(p=>p-1)}>‹</button>
          <span style={{fontSize:'var(--text-xs)',fontFamily:'var(--font-mono)'}}>Page <strong>{page}</strong> of <strong>{totalPages}</strong></span>
          <button type="button" className="pag-btn" disabled={page>=totalPages} onClick={()=>setPage(p=>p+1)}>›</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
