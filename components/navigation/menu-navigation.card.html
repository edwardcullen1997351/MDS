<!-- @dsCard group="Components" viewport="780x360" name="Navigation — menu-popover" subtitle="On-demand destination menu: app suite switchers, profile portals, and focus restoration" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Menu Navigation</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--surface-card);padding:20px;font-family:var(--font-sans)}
.row{display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);font-weight:var(--weight-semibold)}
.menu-popover-surface{background:var(--surface-card);border:var(--border-hairline);border-radius:var(--radius-md);box-shadow:var(--shadow-md, 0 4px 14px rgba(0,0,0,0.1));width:220px;padding:6px 0;display:flex;flex-direction:column}
.menu-pop-item{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;font-size:var(--text-xs);color:var(--text-secondary);text-decoration:none;border-radius:var(--radius-sm);margin:1px 4px;cursor:pointer}
.menu-pop-item:hover{background:var(--surface-sunken);color:var(--text-primary)}
.menu-pop-item.active{background:var(--status-info-soft);color:var(--text-link);font-weight:var(--weight-medium)}
</style></head><body><div id="root"></div>
<script type="text/babel">
const { Button, Badge, Text } = window.MeridianDesignSystem_962c43;

const PORTALS = [
  { id: 'mes', label: 'MES Plant Console' },
  { id: 'scada', label: 'Telemetry & SCADA' },
  { id: 'quality', label: 'Quality & NC Portal', badge: 2 },
  { id: 'cmms', label: 'CMMS Maintenance' },
];

function Demo(){
  const [open, setOpen] = React.useState(true);
  const [active, setActive] = React.useState('mes');

  return (
    <div className="row">
      <div className="col">
        <span className="lbl">On-Demand App Switcher Trigger</span>
        <Button variant="secondary" size="sm" onClick={()=>setOpen(!open)}>
          <span>Plant Portals</span>
          <span style={{marginLeft:6,fontSize:10}}>▾</span>
        </Button>

        {open && (
          <div className="menu-popover-surface" style={{marginTop:8}}>
            <div style={{padding:'4px 10px 2px',fontSize:9,fontFamily:'var(--font-mono)',textTransform:'uppercase',letterSpacing:'var(--tracking-caps)',color:'var(--text-tertiary)',fontWeight:'bold'}}>
              Enterprise Portals
            </div>
            {PORTALS.map(p => (
              <a
                key={p.id}
                href={`#${p.id}`}
                className={`menu-pop-item ${active===p.id?'active':''}`}
                onClick={(e)=>{e.preventDefault();setActive(p.id);}}
              >
                <span>{p.label}</span>
                {p.badge ? <Badge size="sm" tone="critical">{p.badge}</Badge> : null}
              </a>
            ))}
          </div>
        )}
      </div>

      <div className="col" style={{flex:1,minWidth:240}}>
        <span className="lbl">Context Jump Information</span>
        <div style={{background:'var(--surface-sunken)',border:'var(--border-hairline)',borderRadius:'var(--radius-md)',padding:14,fontSize:'var(--text-xs)'}}>
          <div style={{fontFamily:'var(--font-mono)',marginBottom:6}}>Selected Portal: <strong>{active}</strong></div>
          <div style={{color:'var(--text-secondary)',lineHeight:1.4}}>
            Menu Navigation provides clean transient wayfinding to secondary portals, dismissing on selection or <kbd>Esc</kbd> while restoring keyboard focus cleanly to the trigger.
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
