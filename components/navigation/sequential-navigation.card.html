<!-- @dsCard group="Components" viewport="780x420" name="Navigation — sequential" subtitle="Ordered sequence navigation: contextual preview cards, progress strips, and deterministic traversal" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Sequential Navigation</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--surface-card);padding:20px;font-family:var(--font-sans)}
.row{display:flex;flex-direction:column;gap:18px}
.col{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);font-weight:var(--weight-semibold)}
.seq-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seq-card{background:var(--background-page);border:var(--border-hairline);border-radius:var(--radius-md);padding:10px 14px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;transition:all 0.15s ease}
.seq-card:hover:not(:disabled){border-color:var(--border-focus);box-shadow:var(--shadow-xs)}
.seq-card:disabled{opacity:0.35;cursor:not-allowed}
.seq-dir{font-family:var(--font-mono);font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary)}
.seq-title{font-size:var(--text-xs);font-weight:var(--weight-semibold);color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seq-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--background-page);border:var(--border-hairline);border-radius:var(--radius-md)}
.seq-btn{padding:5px 12px;border-radius:var(--radius-sm);border:var(--border-hairline);background:var(--surface-card);font-family:var(--font-mono);font-size:var(--text-xs);cursor:pointer}
.seq-btn.primary{background:var(--action-solid);color:#fff;border-color:var(--action-solid)}
.seq-btn:disabled{opacity:0.35;cursor:not-allowed}
</style></head><body><div id="root"></div>
<script type="text/babel">
const STEPS = [
  { id: 'SOP-01', title: 'Safety Interlocks & E-Stop Test', sub: 'Chakan PL-04 Press Shop' },
  { id: 'SOP-02', title: 'Hydraulic Oil Viscosity Check', sub: 'Reservoir Tank R-02' },
  { id: 'SOP-03', title: 'Die Bed Alignment & Clamping', sub: '500T Lower Platen' },
  { id: 'SOP-04', title: 'Pressure Relief Calibration', sub: 'Main Cylinder (280 bar)' }
];

function Demo(){
  const [idx, setIdx] = React.useState(1);
  const total = STEPS.length;
  const prev = idx > 0 ? STEPS[idx - 1] : null;
  const next = idx < total - 1 ? STEPS[idx + 1] : null;

  return (
    <div className="row">
      <div className="col">
        <span className="lbl">Preview Cards Variant (SOP Manual Chapter Walkthrough)</span>
        <div className="seq-cards">
          <button type="button" className="seq-card" disabled={!prev} onClick={()=>setIdx(i=>i-1)}>
            <div className="seq-dir">← PREVIOUS ({prev ? prev.id : 'START'})</div>
            <div className="seq-title">{prev ? prev.title : 'Beginning of SOP'}</div>
          </button>
          <button type="button" className="seq-card" disabled={!next} onClick={()=>setIdx(i=>i+1)} style={{textAlign:'right'}}>
            <div className="seq-dir">NEXT ({next ? next.id : 'END'}) →</div>
            <div className="seq-title">{next ? next.title : 'Sequence Complete'}</div>
          </button>
        </div>
      </div>

      <div className="col">
        <span className="lbl">Standard Bar Variant (Machine Calibration)</span>
        <div className="seq-bar">
          <button type="button" className="seq-btn" disabled={!prev} onClick={()=>setIdx(i=>i-1)}>
            ← Prev: {prev ? prev.id : 'Start'}
          </button>
          <span style={{fontFamily:'var(--font-mono)',fontSize:'var(--text-xs)'}}>
            Step <strong>{idx + 1}</strong> of <strong>{total}</strong>: {STEPS[idx].title}
          </span>
          <button type="button" className="seq-btn primary" disabled={!next} onClick={()=>setIdx(i=>i+1)}>
            Next: {next ? next.id : 'Done'} →
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
