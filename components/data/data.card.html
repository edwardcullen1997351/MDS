<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Data</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-card);padding:20px;font-family:var(--font-sans)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.lbl{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);font-weight:var(--weight-semibold)}.grid{display:grid;gap:16px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Table, Card, Badge, IconButton } = window.MeridianDesignSystem_962c43;
const rows=[
  {id:1,name:'Assembly 3',inst:'PRS-4120',status:'Running',tone:'success',p95:'91.6 %'},
  {id:2,name:'Assembly 4',inst:'PRS-4121',status:'Changeover',tone:'neutral',p95:'74.0 %'},
  {id:3,name:'Weld 1',inst:'WLD-2207',status:'Down',tone:'danger',p95:'38.2 %'},
  {id:4,name:'Pack 1',inst:'PKG-6014',status:'Running',tone:'success',p95:'94.1 %'}];
function Demo(){
  const [sel,setSel]=React.useState([1]);
  const [sort,setSort]=React.useState({key:'p95',direction:'desc'});
  return (
  <Card padding="none">
    <Table caption="Production lines" selectable selectedKeys={sel} onSelectionChange={setSel} rowLabel={r=>r.name} sort={sort} onSortChange={setSort} rows={rows}
      columns={[
        {key:'name',header:'Line',sortable:true},
        {key:'inst',header:'Machine',mono:true},
        {key:'status',header:'State',render:r=><Badge tone={r.tone} dot>{r.status}</Badge>},
        {key:'p95',header:'OEE',align:'right',mono:true,sortable:true},
        {key:'act',header:'',width:'44px',align:'right',render:()=><IconButton icon="ellipsis" label="Row actions" size="sm" />}]} />
  </Card>
);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
