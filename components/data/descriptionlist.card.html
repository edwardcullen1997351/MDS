<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>DescriptionList</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--background-page);padding:20px;font-family:var(--font-sans)}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}</style></head><body><div id="root"></div>
<script type="text/babel">
const { DescriptionList, Card, Badge, Tag, Text } = window.MeridianDesignSystem_962c43;
const FIELDS = [
  { term: 'Work order', value: 'WO-88431', mono: true },
  { term: 'Line', value: 'Assembly 3' },
  { term: 'Machine', value: 'PRS-4120', mono: true },
  { term: 'State', value: <Badge tone="success" dot>Running</Badge> },
  { term: 'Owners', value: ['Maya Osei', 'Tomas Lind'] },
  { term: 'Quantity', value: '2,000 ea', mono: true },
  { term: 'Closed', value: null },
];
function Demo(){
  return (
  <div style={{display:'flex',flexDirection:'column',gap:16}}>
    <div className="grid">
      <Card title="Work order · columns" headingLevel={2} padding="md">
        <DescriptionList items={FIELDS} />
      </Card>
      <Card title="Drawer · stacked, sm" headingLevel={2} padding="md">
        <DescriptionList layout="stacked" size="sm" items={FIELDS.slice(0,5)} />
      </Card>
    </div>
    <Card title="Divided" headingLevel={2} padding="md">
      <DescriptionList divided items={FIELDS.slice(0,4)} />
    </Card>
    <Text size="xs" tone="tertiary">The term column is one width down the whole list — that alignment is the component. “Owners” shows two values under one term; “Closed” has none, so it renders — rather than a blank cell.</Text>
  </div>
);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
