<!-- @dsCard group="Components" viewport="700x380" name="MultiCombobox — several values" subtitle="Tokens in the box, a list that stays open, Backspace to remove" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>MultiCombobox</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-card);padding:20px;font-family:var(--font-sans)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}</style></head><body><div id="root"></div>
<script type="text/babel">
const { MultiCombobox, Field, Text } = window.MeridianDesignSystem_962c43;
const CUISINES = [
  {value:'thai',label:'Thai'},{value:'oaxacan',label:'Oaxacan',description:'Mole, tlayudas, mezcal'},
  {value:'georgian',label:'Georgian',description:'Khachapuri, walnut sauces'},{value:'sichuan',label:'Sichuan'},
  {value:'basque',label:'Basque'},{value:'ethiopian',label:'Ethiopian'},{value:'levantine',label:'Levantine'},
];
const RIGHTS = [
  {value:'read',label:'Read'},{value:'comment',label:'Comment'},{value:'edit',label:'Edit'},
  {value:'share',label:'Share',description:'Includes external links'},{value:'admin',label:'Administer',disabled:true},
];
function Demo(){
  const [cuisines,setCuisines]=React.useState(['thai','georgian','sichuan','basque']);
  const [rights,setRights]=React.useState(['read','comment']);
  return (
  <div className="grid">
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <Field label="Cuisines" hint="Collapsed to three at rest; focus to see them all.">
        <MultiCombobox value={cuisines} onChange={setCuisines} options={CUISINES} placeholder="Search cuisines" />
      </Field>
      <Text size="xs" tone="tertiary">Value: [{cuisines.join(', ')}] — option order, not click order.</Text>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <Field label="Permissions" hint="Two at most on a shared link.">
        <MultiCombobox value={rights} onChange={setRights} options={RIGHTS} max={2} collapseAfter={false} placeholder="Add a permission" />
      </Field>
      <Field label="Empty, sm" >
        <MultiCombobox size="sm" value={[]} onChange={()=>{}} options={CUISINES} placeholder="Nothing selected yet" />
      </Field>
    </div>
  </div>
);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
