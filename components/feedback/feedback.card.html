<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Feedback</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-card);padding:20px;font-family:var(--font-sans)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.lbl{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);font-weight:var(--weight-semibold)}.grid{display:grid;gap:16px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Toast, Tooltip, Popover, Dialog, Button, IconButton, Icon, Field, Select, Checkbox } = window.MeridianDesignSystem_962c43;
function Demo(){return (
  <div className="col" style={{gap:20}}>
    <div className="col" style={{gap:10}}>
      <Toast tone="success" title="Work order released" message="Line 3 starts on the next changeover." onDismiss={()=>{}} />
      <Toast tone="danger" title="Release failed" message="Station 4 sensor is offline." action={<Button variant="link" size="sm">View machine</Button>} onDismiss={()=>{}} />
      <div className="row" style={{gap:18,paddingTop:6}}>
        <Tooltip content="Command menu" shortcut="⌘K"><IconButton icon="search" label="Search" variant="outline" /></Tooltip>
        <Tooltip content="OEE for the current shift" side="right"><Icon name="info" size={14} style={{color:'var(--text-tertiary)'}} /></Tooltip>
        <Popover title="Filters" trigger={<Button variant="secondary" size="sm" iconRight="chevron-down">Filters</Button>}>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            <Field label="Area"><Select options={['assembly','fabrication','finishing']} placeholder="All areas" /></Field>
            <Checkbox label="Only lines with open faults" />
            <div style={{display:'flex',justifyContent:'flex-end',gap:8}}><Button size="sm">Apply</Button></div>
          </div>
        </Popover>
      </div>
    </div>
    <div style={{position:'relative',minHeight:300,background:'var(--background-page)',border:'1px solid var(--border-default)',borderRadius:'var(--radius-md)',overflow:'hidden'}}>
      {/* STACKED, not beside the toasts, and the reason is the declared card
          width. As a flex row this frame got 280px of the card's 700px, which
          squeezed the width="sm" panel to 230px; the title and description
          then rewrapped to five lines (229px of content) while the panel's
          `maxHeight: 100%` resolved against the scrim's 250px minus its inset,
          capping the panel at 120px and slicing the footer through the middle.
          The binding constraint was the frame's WIDTH, so raising its height
          did nothing — and none of it was visible in a 924px preview, where the
          frame gets 565px and the panel never rewraps. Verify cards at their
          DECLARED viewport, not the preview's.

          The frame's height is DERIVED, not guessed: the panel's content is
          167px and the scrim spends `--dialog-inset-block` (64px) at the top
          AND the bottom, so `maxHeight: 100%` gives the panel frameH − 128.
          Anything under 295 caps the panel below its content; 300 leaves a
          little slack. Two earlier passes raised this number by feel (210 →
          250 → 230) and all three were under the floor.

          No `position` override on the Dialog either: its scrim is
          deliberately `absolute; inset: 0` (see Dialog.jsx) so it fills the
          nearest relative ancestor, which is this frame. Forcing it to
          `relative` collapsed the scrim to auto height and the panel's
          `maxHeight: 100%` then resolved against a near-zero box. */}
      <Dialog open title="Delete routing?" tone="danger" width="sm"
        description="All operations on this routing are removed. This cannot be undone."
        footer={<><Button variant="secondary">Cancel</Button><Button variant="danger">Delete routing</Button></>} />
    </div>
  </div>
);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
