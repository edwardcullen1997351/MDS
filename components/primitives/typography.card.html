   screenshot and export of this card (html-to-image news up an Image to inline
   media) and left `Icon` permanently invisible: its glyph probe news an Image
   inside a Promise executor, so the throw REJECTED instead of resolving and
   the status never left 'pending'. This card renders no Icons, so nothing
   looked wrong — the failure was reserved for whoever added one.

   Function scope keeps the bindings off window entirely, which also fixes the
   `Text` collision here (window.Text is otherwise the React component, and
   `node instanceof Text` is then false for every real text node). */
(() => {
const { Heading, Text, Stack, Image, Divider, Grid } = window.MeridianDesignSystem_962c43;
function Demo(){return (
  <Stack direction="row" gap={6} align="flex-start">

);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
