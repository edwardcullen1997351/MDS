      <Surface tone="inverse" padding="sm" style={{flex:1}}><Text size="xs" tone="inverse">inverse</Text></Surface>
      <Box p={3} background="surface-selected" radius="md" border="focus" style={{flex:1}}><Text size="xs" tone="accent">Box + tokens</Text></Box>

);}
