<!-- @dsCard group="Components" viewport="900x620" name="SortableCollection — the mechanics of a move" subtitle="Composite: grab, keyboard grab mode, insertion indicator, per-position legality, announcements — and no commit of its own" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>SortableCollection</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-card);padding:20px;font-family:var(--font-sans)}.col{display:flex;flex-direction:column;gap:16px;max-width:640px}.lbl{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);font-weight:var(--weight-semibold);margin-bottom:6px}.box{border:var(--border-hairline);border-radius:var(--radius-md);padding:6px 4px}.rw{display:flex;align-items:baseline;gap:10px;min-width:0}.nm{font-size:var(--text-sm);color:var(--text-primary)}.mt{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-tertiary)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { SortableCollection, Text, Badge } = window.MeridianDesignSystem_962c43;
const OPS = {
  OP10:{seq:'10',name:'Blank',wc:'PR-02 press'}, OP20:{seq:'20',name:'Pierce',wc:'PR-03 press'},
  OP30:{seq:'30',name:'Deburr',wc:'DB-01 bench'}, OP40:{seq:'40',name:'Wash',wc:'WS-01'},
  OP50:{seq:'50',name:'CNC bore',wc:'CNC-04'}, OP80:{seq:'80',name:'Despatch pack',wc:'PK-01'}
};
const nameOf = id => 'op ' + OPS[id].seq + ' ' + OPS[id].name;
function Demo(){
  if (!SortableCollection) return <Text tone="secondary">The bundle has not been recompiled with <code>components/composite/SortableCollection.jsx</code> yet — reload once it has.</Text>;
  const [order,setOrder] = React.useState(['OP10','OP20','OP30','OP40','OP50','OP80']);
  const [log,setLog] = React.useState('nothing moved yet');
  const [pending,setPending] = React.useState(null);
  // The consumer owns the commit: the component asked, this writes.
  const commit = (id,from,to) => {
    setPending(id);
    setTimeout(() => {
      setOrder(o => { const a = o.filter(x=>x!==id); a.splice(to,0,id); return a; });
      setPending(null);
      setLog('committed: ' + nameOf(id) + ' from ' + (from+1) + ' to ' + (to+1));
    }, 500);
  };
  return (
  <div className="col">
    <div>
      <div className="lbl">Routing · BRK-4820-A · grab a handle, or focus one and press Space</div>
      <div className="box">
        <SortableCollection
          label="Routing sequence"
          items={order}
          itemName={nameOf}
          size="sm"
          canMove={(id)=> id==='OP10' ? 'Pinned first — the raw blank starts here.' : id==='OP80' ? 'Pinned last — nothing runs after despatch pack.' : true}
          canDrop={(id,to,next)=>
            next[0]!=='OP10' ? 'Op 10 Blank stays at position 1.' :
            next[next.length-1]!=='OP80' ? 'Op 80 Despatch pack is pinned last.' :
            next.indexOf('OP50') < next.indexOf('OP20') ? 'Op 50 CNC bore is pinned to fixture FX-2210, which requires op 20 Pierce complete.' : true}
          onMove={commit}
          onAnnounce={setLog}
        >
          {order.map((id) => (
            <div className="rw" key={id}>
              <span className="mt" style={{width:'18px',flex:'none'}}>{OPS[id].seq}</span>
              <span className="nm">Op {OPS[id].seq} {OPS[id].name}</span>
              <span className="mt">{OPS[id].wc}</span>
              {pending===id ? <Badge tone="accent" size="sm" dot>writing</Badge> : null}
            </div>
          ))}
        </SortableCollection>
      </div>
      <Text size="xs" tone="tertiary">{log}</Text>
    </div>
    <Text size="xs" tone="tertiary">The component never reorders <code>items</code>: a legal drop calls <code>onMove</code>, and this demo's own 500 ms write is what changes the order. Try op 50 above op 20 for a refusal that names fixture FX-2210, and op 10 or op 80 for a pinned item whose handle is disabled with its reason.</Text>
  </div>
);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
