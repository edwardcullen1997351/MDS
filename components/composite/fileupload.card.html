<!-- @dsCard group="Components" viewport="880x560" name="FileUpload — one attachment set" subtitle="Composite: the aggregate status that decides whether the record may be released" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>FileUpload</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-card);padding:20px;font-family:var(--font-sans)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}.col{display:flex;flex-direction:column;gap:10px;min-width:0}.lbl{font-family:var(--font-mono);font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary)}.bar{display:flex;align-items:center;gap:10px}a,a:hover{color:var(--text-link)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { FileUpload, Button, Text, Badge } = window.MeridianDesignSystem_962c43;

function Demo(){
  const [files,setFiles] = React.useState([
    {id:'a',name:'BRK-4820-A_rev-C.pdf',size:2438144,state:'complete',meta:'Sheet 1 of 2'},
    {id:'b',name:'BOM_BRK-4820-A_rev-C.csv',size:18944,state:'uploading',progress:64},
  ]);
  const [status,setStatus] = React.useState('busy');
  const tone = status==='idle'?'success':status==='busy'?'info':'danger';
  return (
    <div className="col">
      <span className="lbl">ECR-2291 · routing change · Chakan plant (PL-04)</span>
      <FileUpload
        label="Revised drawing and BOM"
        targetLabel="Drop the revised drawing and BOM here, or browse"
        hint="PDF, DWG or CSV · up to 20 MB each · 5 files"
        accept=".pdf,.dwg,.csv" maxSize={20*1024*1024} maxFiles={5} required
        value={files} onChange={setFiles} onStatusChange={setStatus} />
      <div className="bar">
        <Button size="sm" disabled={status!=='idle'}>Release ECR-2291</Button>
        <Badge tone={tone}>{status}</Badge>
        {status==='busy' && <Text size="xs" tone="tertiary">Waiting for 1 upload</Text>}
        {status==='failed' && <Text size="xs" tone="critical">Resolve the failed file first</Text>}
        {status==='invalid' && <Text size="xs" tone="critical">A drawing is required</Text>}
      </div>
      <Text size="xs" tone="tertiary">Status is derived from the set, never stored — remove both files, or fail one, and the button follows.</Text>
      <div className="bar">
        <Button size="sm" variant="secondary" onClick={()=>setFiles(f=>f.map(x=>x.id==='b'?{...x,state:'failed',error:'MES did not answer.',progress:undefined}:x))}>Fail the BOM</Button>
        <Button size="sm" variant="secondary" onClick={()=>setFiles(f=>f.map(x=>x.state==='uploading'||x.state==='failed'?{...x,state:'complete',progress:undefined,error:undefined}:x))}>Finish uploads</Button>
      </div>
    </div>
  );
}

function ReadOnly(){
  const [files] = React.useState([
    {id:'c',name:'BRK-4820-A_rev-B.pdf',size:2340000,state:'complete',meta:'Superseded 2026-08-14 (IST)'},
    {id:'d',name:'BOM_BRK-4820-A_rev-B.csv',size:17800,state:'complete',meta:'Anjali Deshmukh'},
  ]);
  return (
    <div className="col">
      <span className="lbl">released record · aggregate disabled</span>
      <FileUpload label="Attachments" targetLabel="Attachments locked"
        hint="ECR-2288 is released; attachments are frozen."
        value={files} onChange={()=>{}} disabled size="sm" />
      <Text size="xs" tone="tertiary">One flag stops the target and every row together.</Text>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <div className="grid"><Demo /><ReadOnly /></div>
);
</script></body></html>
