<script type="text/babel">

  { id:'xlsx', label:'Export as XLSX' },

function Demo(){

  const [log,setLog] = React.useState('nothing run yet');

  <div className="col">
    <div>

      <SplitButton label="Save" onAction={()=>setLog('primary: Save')} actions={SAVE} onSelect={(a)=>setLog('alternative: '+a.id)} />

    <div>
      <div className="lbl">Variants · one height per size</div>

  </div>
