<!-- @dsCard group="Components" viewport="820x420" name="SearchField — the query control" subtitle="Composite: search semantics, clear and submit as separate actions, coordinated sizing" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>SearchField</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-card);padding:20px;font-family:var(--font-sans)}.col{display:flex;flex-direction:column;gap:18px;max-width:520px}.lbl{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);font-weight:var(--weight-semibold);margin-bottom:6px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { SearchField, Text } = window.MeridianDesignSystem_962c43;
function Demo(){
  if (!SearchField) return <Text tone="secondary">The bundle has not been recompiled with <code>components/composite/SearchField.jsx</code> yet — reload once it has.</Text>;
  const [q,setQ] = React.useState('acme');
  const [ran,setRan] = React.useState('nothing run yet');
  return (
  <div className="col">
    <div>
      <div className="lbl">Search as you type</div>
      <SearchField label="Search invoices" value={q} onChange={setQ} placeholder="Invoice no. or customer" />
      <Text size="xs" tone="tertiary">Query: <code>{q ? q : '(empty)'}</code></Text>
    </div>
    <div>
      <div className="lbl">Explicit submission</div>
      <SearchField label="Search the archive" submit="button" onSubmit={(v)=>setRan(v ? 'ran: "'+v+'"' : 'ran: (empty)')} hint="Whole words only. Quotes for an exact phrase." />
      <Text size="xs" tone="tertiary">{ran}</Text>
    </div>
    <div>
      <div className="lbl">Compact, stable clear target</div>
      <SearchField label="Filter rows" size="sm" clearable="always" defaultValue="overdue" />
    </div>
    <div>
      <div className="lbl">Disabled — the searched context is unavailable</div>
      <SearchField label="Search customers" defaultValue="acme" submit="button" onSubmit={()=>{}} disabled />
    </div>
    <Text size="xs" tone="tertiary">The label is the scope and the accessible name; the placeholder only hints at format. Clearing fires an ordinary value change and returns focus to the field.</Text>
  </div>
);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
