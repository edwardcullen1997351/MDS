<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>DateRangePicker</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-card);padding:20px;font-family:var(--font-sans)}.col{display:flex;flex-direction:column;gap:22px;max-width:600px}.lbl{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);font-weight:var(--weight-semibold);margin-bottom:8px}.narrow{max-width:300px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { DateRangePicker, Field, Text } = window.MeridianDesignSystem_962c43;
function Demo(){
  if (!DateRangePicker) return <Text tone="secondary">The bundle has not been recompiled with <code>components/composite/DateRangePicker.jsx</code> yet — reload once it has.</Text>;
  const [a,setA] = React.useState(['2026-09-01','2026-09-30']);
  const [b,setB] = React.useState(['2026-09-14','2026-09-03']);
  const [c,setC] = React.useState([undefined,undefined]);
  return (
  <div className="col">
    <div>
      <div className="lbl">One range, bounded and inclusive</div>
      <DateRangePicker label="Report window" value={a} onChange={setA} min="2026-01-01" max="2026-12-31"
        hint="Both dates are inclusive. The end panel cannot open before the start." />
      <Text size="xs" tone="tertiary" family="mono">[{a[0]||'—'}, {a[1]||'—'}]</Text>
    </div>
    <div>
      <div className="lbl">Invalid range — reported, never swapped</div>
      <DateRangePicker label="Downtime" value={b} onChange={setB} constrain={false} />
    </div>
    <div>
      <div className="lbl">Complete range required · inside a Field</div>
      <Field label="Shift period" hint="Used to select the shifts included in the export.">
        <DateRangePicker value={c} onChange={setC} startLabel="First shift" endLabel="Last shift" />
      </Field>
    </div>
    <div>
      <div className="lbl">Stacks when the container narrows — order stays start then end</div>
      <div className="narrow"><DateRangePicker label="Accrual period" size="sm" value={a} onChange={setA} /></div>
    </div>
  </div>
);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
