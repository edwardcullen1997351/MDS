<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Accordion</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-card);padding:20px;font-family:var(--font-sans);color:var(--text-primary)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.lbl{font-family:var(--font-mono);font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);display:block;margin-bottom:8px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Accordion, Badge, Text } = window.MeridianDesignSystem_962c43;
const ITEMS = [
  {value:'thresholds',title:'Alert thresholds',description:'4 rules · last edited 12 Aug',icon:'gauge',content:<Text size="sm">Starve and blockage alarms fire after 90 seconds of no movement.</Text>},
  {value:'window',title:'Maintenance window',icon:'calendar-clock',meta:<Badge tone="warning" dot>Overdue</Badge>,content:<Text size="sm">Sundays 02:00–06:00 CET.</Text>},
  {value:'audit',title:'Audit trail',description:'Requires admin',icon:'scroll-text',disabled:true},
];
function Demo(){
  const [one,setOne] = React.useState('thresholds');
  const [many,setMany] = React.useState(['calibration']);
  return (
    <div className="grid">
      <div>
        <span className="lbl">bordered · one at a time</span>
        <Accordion items={ITEMS} value={one} onChange={setOne} />
      </div>
      <div>
        <span className="lbl">flush · sm · multiple</span>
        <Accordion variant="flush" size="sm" multiple value={many} onChange={setMany} items={[
          {value:'calibration',title:'Calibration',content:<Text size="xs">Torque head recalibrated 3 Sep.</Text>},
          {value:'parts',title:'Consumable parts',content:<Text size="xs">Filter PN-7749 due in 240 hours.</Text>},
          {value:'notes',title:'Operator notes',content:<Text size="xs">Nights shift reports intermittent vibration.</Text>},
        ]} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
