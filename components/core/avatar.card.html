<!-- @dsCard group="Components" viewport="820x480" name="Avatar — no colour identity" subtitle="Initials identify; only presence is coloured. Person vs machine, and a group that announces once" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Avatar</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-card);padding:20px;font-family:var(--font-sans)}.col{display:flex;flex-direction:column;gap:18px}.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.lbl{font-family:var(--font-mono);font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-tertiary);min-width:96px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Avatar, AvatarGroup, Text } = window.MeridianDesignSystem_962c43;
function Demo(){
  return (
  <div className="col">
    <div className="row"><span className="lbl">sizes</span>
      {['xs','sm','md','lg','xl'].map(s=><Avatar key={s} name="Maya Osei" size={s} />)}
      <Text size="xs" tone="tertiary">20 · 24 · 32 · 40 · 64. One initial below 32px — two would fall under the 11px type floor.</Text>
    </div>
    <div className="row"><span className="lbl">initials</span>
      <Avatar name="Maya Osei" /><Avatar name="李小龙" /><Avatar name="María del Carmen Rodríguez" />
      <Avatar name="Prince" /><Avatar name="m.osei@meridian.industries" /><Avatar name="Jean-Luc Picard" />
      <Text size="xs" tone="tertiary">MO · 李 · MR · P · MO · JP</Text>
    </div>
    <div className="row"><span className="lbl">machine</span>
      <Avatar name="PRS-4120" kind="machine" /><Avatar name="PKG-6014" kind="machine" /><Avatar name="WLD-2207" kind="machine" /><Avatar name="svc-scheduler" kind="machine" size="lg" />
      <Text size="xs" tone="tertiary">PR · PK · WL · SV — an identifier takes two, so a press is distinguishable from a packer. Mono and square: Tag’s rule, identifiers are not names.</Text>
    </div>
    <div className="row"><span className="lbl">presence</span>
      <Avatar name="Maya Osei" size="lg" status="online" statusLabel="online" />
      <Avatar name="Tomas Lind" size="lg" status="busy" statusLabel="on a call" />
      <Avatar name="Ana Ruiz" size="lg" status="away" statusLabel="away" />
      <Avatar name="Ken Ito" size="lg" status="offline" statusLabel="offline" />
      <Text size="xs" tone="tertiary">The only coloured part — presence is a state, so it uses the state ramps.</Text>
    </div>
    <div className="row"><span className="lbl">group</span>
      <AvatarGroup people={['Maya Osei','Tomas Lind','Ana Ruiz','Ken Ito','Jo Park','Sam Vale']} max={4} />
      <AvatarGroup size="md" people={['Maya Osei','Tomas Lind']} />
      <Text size="xs" tone="tertiary">One initial per disc — in a group each disc loses a third of itself to its neighbour, so two glyphs would smudge. Two announcements: the shown people, plus a “+2 more” chip that names itself and describes the rest.</Text>
    </div>
  </div>
);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
